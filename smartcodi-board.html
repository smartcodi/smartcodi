<title>스마트제조 코디 보드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  color-scheme: light;
  --bg:#eef1f6;
  --surface:#ffffff;
  --surface-2:#f7f9fc;
  --line:#d7dee9;
  --line-soft:#e6ebf3;
  --ink:#131923;
  --ink-2:#4c5768;
  --ink-3:#7b8798;
  --accent:#1b5fd0;
  --r-sogongin:#2f6fdb;
  --r-coord:#0e8a60;
  --r-supplier:#7644cc;
  --r-consultant:#d24379;
  --warn:#a8530b;
  --shadow:0 1px 2px rgba(19,25,35,.06), 0 8px 24px rgba(19,25,35,.07);
  --shadow-lg:0 2px 8px rgba(19,25,35,.10), 0 24px 60px rgba(19,25,35,.18);
}
/* 라이트 전용. 뷰어가 다크 테마여도 이 화면은 항상 밝게 렌더링한다.
   (현장·사무실 출력과 색 구분 일관성 때문에 의도적으로 단일 테마) */

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  font-size:14px; line-height:1.55;
  display:flex; flex-direction:column;
  overflow:hidden;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:4px}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}

/* ---------- top bar ---------- */
header{
  flex:0 0 auto; background:var(--surface);
  border-bottom:1px solid var(--line);
  padding-top:env(safe-area-inset-top,0px);
}
.bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:12px 16px}
.brand{display:flex;flex-direction:column;gap:1px;margin-right:4px}
.brand b{font-size:15px;font-weight:700;letter-spacing:-.02em}
.brand span{font-size:11px;color:var(--ink-3);letter-spacing:.08em;text-transform:uppercase;font-family:"IBM Plex Mono",monospace}
.stats{display:flex;gap:6px;flex-wrap:wrap}
.stat{
  border:1px solid var(--line); border-radius:7px; background:var(--surface-2);
  padding:5px 10px; display:flex; align-items:baseline; gap:7px; min-width:72px;
}
.stat i{font-style:normal;font-size:10.5px;color:var(--ink-3);letter-spacing:.04em}
.stat b{font-size:16px;font-weight:600;font-family:"IBM Plex Mono",monospace}
.stat.alert b{color:var(--warn)}
.spacer{flex:1 1 auto}
.ctl{
  border:1px solid var(--line); background:var(--surface); border-radius:7px;
  padding:6px 10px; font-size:13px; min-width:0;
}
.ctl::placeholder{color:var(--ink-3)}
.btn{
  border:1px solid var(--line); background:var(--surface); border-radius:7px;
  padding:6px 12px; font-size:13px; font-weight:500;
}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{color:#c0392b;border-color:color-mix(in oklab,#c0392b 35%,var(--line))}

.legend{display:flex;gap:14px;flex-wrap:wrap;padding:0 16px 10px;font-size:11.5px;color:var(--ink-2);align-items:center}
.legend .k{display:inline-flex;align-items:center;gap:5px}
.legend .dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
.legend .sep{color:var(--ink-3)}

.notice{
  margin:0 16px 10px; padding:7px 11px; border-radius:7px; font-size:12.5px;
  background:color-mix(in oklab,var(--warn) 12%,var(--surface));
  border:1px solid color-mix(in oklab,var(--warn) 32%,var(--line));
  color:color-mix(in oklab,var(--warn) 70%,var(--ink));
}

/* ---------- board ---------- */
main{flex:1 1 auto;overflow:auto;padding:14px 16px 18px;-webkit-overflow-scrolling:touch}
.board{display:flex;gap:12px;align-items:flex-start;min-height:100%;width:max-content;padding-bottom:4px}
.col{
  flex:0 0 268px; width:268px; background:var(--surface);
  border:1px solid var(--line); border-radius:11px; box-shadow:var(--shadow);
  display:flex; flex-direction:column; max-height:100%;
}
.col.drop{border-color:var(--rc);box-shadow:0 0 0 2px color-mix(in oklab,var(--rc) 45%,transparent)}
.col-head{padding:10px 12px 9px;border-bottom:1px solid var(--line-soft);border-top:3px solid var(--rc);border-radius:9px 9px 0 0}
.col-head .no{
  font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:600;
  color:var(--rc);letter-spacing:.06em;
}
.col-head h2{margin:1px 0 4px;font-size:14px;font-weight:700;letter-spacing:-.01em}
.col-head .meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.owner-chip{
  display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;
  padding:2px 7px;border-radius:20px;
  color:var(--rc); background:color-mix(in oklab,var(--rc) 13%,var(--surface));
  border:1px solid color-mix(in oklab,var(--rc) 30%,transparent);
}
.count{margin-left:auto;font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--ink-3)}
.col-body{padding:9px;display:flex;flex-direction:column;gap:8px;overflow-y:auto;min-height:56px}
.col-empty{color:var(--ink-3);font-size:12px;text-align:center;padding:14px 4px;border:1px dashed var(--line);border-radius:8px}

.card{
  border:1px solid var(--line); border-left:3px solid var(--rc); border-radius:8px;
  background:var(--surface-2); padding:9px 10px; text-align:left; width:100%;
  display:flex; flex-direction:column; gap:6px;
}
.card:hover{background:var(--surface);border-color:color-mix(in oklab,var(--rc) 40%,var(--line))}
.card.dragging{opacity:.4}
.card .co{font-size:13.5px;font-weight:600;letter-spacing:-.01em;line-height:1.3}
.card .sub{display:flex;gap:6px;align-items:center;font-size:11px;color:var(--ink-3)}
.card .cyc{font-family:"IBM Plex Mono",monospace;font-weight:500;color:var(--ink-2)}
.pips{display:flex;gap:3px}
.pip{width:100%;height:5px;border-radius:2px;background:var(--line);flex:1 1 0}
.pip.done{background:var(--pc)}
.pip.doing{background:color-mix(in oklab,var(--pc) 45%,var(--line))}
.pip.hold{background:repeating-linear-gradient(45deg,var(--line),var(--line) 2px,var(--ink-3) 2px,var(--ink-3) 4px)}
.card .foot{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--ink-3);flex-wrap:wrap}
.badge{
  font-size:10.5px;font-weight:600;padding:1px 6px;border-radius:4px;
  border:1px solid transparent;
}
.badge.warn{color:var(--warn);background:color-mix(in oklab,var(--warn) 13%,var(--surface));border-color:color-mix(in oklab,var(--warn) 30%,transparent)}
.badge.late{color:#c0392b;background:color-mix(in oklab,#c0392b 12%,var(--surface));border-color:color-mix(in oklab,#c0392b 30%,transparent)}
.badge.sample{color:var(--ink-3);background:var(--surface);border-color:var(--line)}
.badge.ntc-main{color:#3d4a5c;background:color-mix(in oklab,#3d4a5c 9%,var(--surface));border-color:color-mix(in oklab,#3d4a5c 28%,transparent)}
.badge.ntc-extra{color:#0b6b73;background:color-mix(in oklab,#0b6b73 10%,var(--surface));border-color:color-mix(in oklab,#0b6b73 32%,transparent)}
.card .nextdue{display:flex;gap:5px;align-items:baseline;font-size:11px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pct{margin-left:auto;font-family:"IBM Plex Mono",monospace;font-weight:600;color:var(--ink-2)}

/* ---------- drawer ---------- */
.scrim{position:fixed;inset:0;background:rgba(10,14,20,.45);backdrop-filter:blur(1.5px);z-index:40}
.drawer{
  position:fixed;top:0;right:0;bottom:0;width:min(480px,100%);z-index:41;
  background:var(--surface);border-left:1px solid var(--line);box-shadow:var(--shadow-lg);
  display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
.dr-head{padding:14px 16px 12px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
.dr-head h2{margin:0;font-size:17px;font-weight:700;letter-spacing:-.02em}
.dr-head .sub{font-size:11.5px;color:var(--ink-3);margin-top:2px}
.dr-body{flex:1 1 auto;overflow-y:auto;padding:12px 16px 28px}
.sec-title{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:600;margin:16px 0 7px;font-family:"IBM Plex Mono",monospace}
.sec-title:first-child{margin-top:2px}

.contacts{display:flex;flex-direction:column;gap:9px}
.crow{display:grid;grid-template-columns:70px 1fr 1fr;gap:5px;align-items:center;
  border-left:2px solid var(--rc);padding-left:8px}
.crow .rl{grid-row:span 2;font-size:11.5px;font-weight:600;color:var(--rc)}
.crow input{border:1px solid var(--line);background:var(--surface-2);border-radius:6px;padding:5px 8px;font-size:12.5px;width:100%;min-width:0}

.step{border:1px solid var(--line);border-radius:9px;margin-bottom:8px;overflow:hidden;background:var(--surface)}
.step-head{
  width:100%;display:flex;align-items:center;gap:9px;padding:9px 11px;
  background:color-mix(in oklab,var(--rc) 7%,var(--surface));
  border:0;border-left:3px solid var(--rc);text-align:left;
}
.step-head:hover{background:color-mix(in oklab,var(--rc) 13%,var(--surface))}
.step-head .n{font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:600;color:var(--rc);width:14px}
.step-head .t{font-size:13.5px;font-weight:600;flex:1 1 auto;letter-spacing:-.01em}
.state{font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2)}
.state.done{color:var(--r-coord);border-color:color-mix(in oklab,var(--r-coord) 40%,transparent);background:color-mix(in oklab,var(--r-coord) 12%,var(--surface))}
.state.doing{color:var(--accent);border-color:color-mix(in oklab,var(--accent) 40%,transparent);background:color-mix(in oklab,var(--accent) 12%,var(--surface))}
.state.hold{color:var(--warn);border-color:color-mix(in oklab,var(--warn) 40%,transparent);background:color-mix(in oklab,var(--warn) 12%,var(--surface))}
.chev{color:var(--ink-3);font-size:11px;transition:transform .15s}
.step.open .chev{transform:rotate(90deg)}
.step-body{padding:11px 12px 13px;border-top:1px solid var(--line-soft);display:flex;flex-direction:column;gap:12px}
.field-row{display:flex;gap:8px;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:3px;flex:1 1 118px;min-width:0}
.field label{font-size:10.5px;color:var(--ink-3);letter-spacing:.04em;font-weight:600}
.field select,.field input{border:1px solid var(--line);background:var(--surface-2);border-radius:6px;padding:5px 7px;font-size:12.5px;width:100%}

.rolegrp{border-left:2px solid var(--rc);padding-left:9px}
.rolegrp .rh{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.rolegrp .rh b{font-size:11.5px;font-weight:600;color:var(--rc)}
.rolegrp .rh .ow{font-size:10px;color:var(--ink-3);border:1px solid var(--line);border-radius:3px;padding:0 4px}
.chk{display:flex;gap:7px;align-items:flex-start;padding:2.5px 0;font-size:12.5px;line-height:1.45;cursor:pointer}
.chk input{margin:3px 0 0;accent-color:var(--rc);flex:0 0 auto;width:14px;height:14px}
.chk.on span{color:var(--ink-3);text-decoration:line-through}
.docs .chk input{accent-color:var(--accent)}
.subhead{font-size:11px;font-weight:600;color:var(--ink-2);margin-bottom:2px}

.notes{display:flex;flex-direction:column;gap:6px}
.note{background:var(--surface-2);border:1px solid var(--line-soft);border-radius:7px;padding:6px 9px;font-size:12.5px;white-space:pre-wrap;word-break:break-word}
.note time{display:block;font-size:10.5px;color:var(--ink-3);font-family:"IBM Plex Mono",monospace;margin-bottom:2px}
.noteadd{display:flex;gap:6px}
.noteadd textarea{flex:1 1 auto;border:1px solid var(--line);background:var(--surface-2);border-radius:7px;padding:6px 9px;font-size:12.5px;resize:vertical;min-height:34px;max-height:140px}
.diag{display:flex;flex-direction:column;gap:3px}
.diag label{font-size:11.5px;font-weight:600;color:var(--ink-2);margin-top:5px}
.diag textarea{width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:7px;padding:6px 9px;font-size:12.5px;line-height:1.5;resize:vertical;min-height:40px;font-family:inherit}
.diag textarea::placeholder{color:var(--ink-3)}
@media (max-width:640px){ .diag textarea{font-size:16px} }
.pcheck .cin input:not([type=checkbox]){border:1px solid var(--line);background:var(--surface-2);border-radius:6px;padding:5px 8px;font-size:12.5px;width:100%;min-width:0}
.pclabor{border:1px solid var(--line-soft);border-radius:7px;padding:6px}
.pclabor .field label{margin-top:0}
.pup{align-items:center;margin-top:6px}
.pup select,.pup input{border:1px solid var(--line);background:var(--surface-2);border-radius:6px;padding:5px 8px;font-size:12.5px}
.pup input{flex:1 1 180px;min-width:0}
.pdoc .pstat{margin-left:auto}
.presult table{font-size:12px;border-collapse:collapse;width:100%}
.presult td{word-break:break-word}
.presult td.co{width:28%}
.presult .pcomment{min-width:90px}
.presult th{text-align:left;font-size:10.5px;color:var(--ink-3);padding:5px 6px;border-bottom:1px solid var(--line)}
.presult td{padding:5px 6px;border-bottom:1px solid var(--line-soft);vertical-align:top}
.presult td.co{font-weight:600}
.pverdict{border:1px solid var(--line);border-radius:6px;padding:3px 5px;font-size:12px;background:var(--surface)}
.pverdict.v-fix{color:var(--warn);border-color:color-mix(in oklab,var(--warn) 45%,var(--line))}
.pverdict.v-pass{color:var(--r-coord)}
.pcomment{border:1px solid var(--line);background:var(--surface-2);border-radius:6px;padding:4px 7px;font-size:12px;width:100%;min-width:140px}
.pmsg{margin-top:6px}
.admcard td .btn{padding:2px 8px;font-size:11.5px}
/* 보드 도우미 */
#assistBtn.on{border-color:var(--accent);color:var(--accent)}
.assist{position:fixed;top:0;right:0;bottom:0;width:min(400px,100%);z-index:42;background:var(--surface);border-left:1px solid var(--line);box-shadow:var(--shadow-lg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.ahead{display:flex;align-items:center;gap:6px;padding:12px 14px;border-bottom:1px solid var(--line)}
.ahead b{font-size:15px}
.alog{flex:1 1 auto;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.abub{max-width:92%;padding:8px 11px;border-radius:10px;font-size:13px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
.abub.me{align-self:flex-end;background:color-mix(in oklab,var(--accent) 12%,var(--surface));border:1px solid color-mix(in oklab,var(--accent) 25%,var(--line))}
.abub.bot{align-self:flex-start;background:var(--surface-2);border:1px solid var(--line-soft)}
.abub.sys{align-self:stretch;max-width:none;font-size:12px;color:var(--ink-2);background:color-mix(in oklab,var(--warn) 8%,var(--surface));border:1px solid color-mix(in oklab,var(--warn) 22%,var(--line))}
.abub .cardbox{white-space:normal;margin-top:8px}
.abub .dprev{white-space:normal;margin-top:8px}
.dview details{border:1px solid var(--line-soft);border-radius:7px;margin-top:6px;background:var(--surface)}
.dview summary{cursor:pointer;padding:6px 9px;font-size:12px;font-weight:600;color:var(--ink-2)}
.dview table{border-collapse:collapse;width:100%;font-size:12px}
.dview td{padding:5px 8px;border-top:1px solid var(--line-soft);vertical-align:top;white-space:pre-wrap;word-break:break-word}
.dview td.co{width:32%;font-weight:600;color:var(--ink-2)}
.outs{display:flex;flex-direction:column;gap:6px}
.pout .lact{align-items:center}
.abub .cardbox .kv i{width:60px}
.afoot{border-top:1px solid var(--line);padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.afoot textarea{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:8px 10px;font-size:13px;resize:vertical;min-height:44px;max-height:160px;font-family:inherit}
.abar{display:flex;gap:6px;align-items:center}
.abar .grow{flex:1 1 auto}
.athumbs{display:flex;gap:5px;flex-wrap:wrap}
.athumb{display:inline-flex;align-items:center;gap:2px;font-size:11.5px;border:1px dashed var(--line);border-radius:6px;padding:1px 2px 1px 7px;background:var(--surface-2)}
.athumb .btn{padding:0 5px}
@media (max-width:640px){ .assist{width:100%;border-left:0} .afoot textarea{font-size:16px} }
@media (max-width:640px){ .pup input,.pup select,.pcomment{font-size:16px} }
.rcard tr.sumrow td{font-weight:600;border-top:1px solid var(--line)}
.budcard td .badge{white-space:nowrap;display:inline-block;margin:1px 0}
.budcard td .badge + .badge{margin-left:4px}
.pcheck .caveat{margin-top:4px}
@media (max-width:640px){ .pcheck input:not([type=checkbox]){font-size:16px} }   /* iOS: 16px 미만이면 입력 시 화면이 확대된다 */

/* ---------- modal ---------- */
.modal{
  position:fixed;z-index:50;left:50%;top:50%;transform:translate(-50%,-50%);
  width:min(420px,calc(100% - 32px));max-height:min(86vh,720px);overflow:auto;
  background:var(--surface);border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow-lg);
  padding:18px;
}
.modal.wide{width:min(580px,calc(100% - 24px))}
.modal h2{margin:0 0 3px;font-size:16px;font-weight:700;letter-spacing:-.02em}

/* ---------- 보내기 ---------- */
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface-2);border-radius:20px;padding:3px 11px;font-size:12px;font-weight:600;color:var(--ink-2)}
.chip:hover:not(:disabled){border-color:var(--rc);color:var(--rc)}
.chip.on{background:color-mix(in oklab,var(--rc) 14%,var(--surface));border-color:color-mix(in oklab,var(--rc) 45%,transparent);color:var(--rc)}
.chip:disabled{opacity:.4;cursor:not-allowed}
.sf{display:flex;flex-direction:column;gap:4px;margin-top:13px}
.sf > label{font-size:10.5px;color:var(--ink-3);font-weight:600;letter-spacing:.04em}
.sf input,.sf textarea{border:1px solid var(--line);background:var(--surface-2);border-radius:7px;padding:7px 9px;font-size:12.5px;width:100%}
.sf textarea{min-height:190px;resize:vertical;line-height:1.6;font-family:inherit}
.kv{display:flex;align-items:center;gap:7px;font-size:12px;padding:5px 0;border-bottom:1px solid var(--line-soft);flex-wrap:wrap}
.kv:last-child{border-bottom:0}
.kv i{font-style:normal;color:var(--ink-3);width:44px;flex:0 0 auto;font-size:11px;font-weight:600}
.kv .val{font-family:"IBM Plex Mono",monospace;user-select:all;word-break:break-all;flex:1 1 140px;min-width:0}
.kv .val.none{color:var(--ink-3);font-family:inherit;user-select:auto}
.kv button{border:1px solid var(--line);background:var(--surface);border-radius:5px;padding:2px 8px;font-size:11px;color:var(--ink-2)}
.kv button:hover{background:var(--surface-2)}
.sendbar{display:flex;gap:6px;flex-wrap:wrap;margin-top:15px;align-items:center}
.sendbar .grow{flex:1 1 auto}
a.btn{text-decoration:none;display:inline-flex;align-items:center;gap:5px}
a.btn.off{opacity:.45;pointer-events:none}
.caveat{font-size:11.5px;color:var(--ink-2);background:color-mix(in oklab,var(--warn) 10%,var(--surface));
  border:1px solid color-mix(in oklab,var(--warn) 28%,var(--line));border-radius:7px;padding:8px 10px;margin-top:12px;line-height:1.65}
.sendrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.sendstat{font-size:12px;margin-top:10px;padding:7px 10px;border-radius:7px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink-2);line-height:1.6}

/* ======================= 주소록 마스터 =======================
   accounts(기관) / contacts(사람) 컬렉션. 과제의 contacts[role]은 지금 모양의
   스냅샷({name, phone, email, kakao})에 contactId·accountId·org를 더해 둔다.
   다른 코드는 전부 스냅샷을 읽으므로, 마스터를 고치면 syncProjects()가
   연결된 과제의 스냅샷을 다시 써서 자동 반영한다. 활동 이력은 건드리지 않는다. */
const EMPTY_CONTACT = () => ({ name:'', phone:'', email:'', kakao:'' });
const newId = pfx => pfx + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const personLabel = c => [c.name, c.title].filter(Boolean).join(' ');
const SNAP_KEYS = ['accountId','org','name','phone','email','kakao'];

function snapshotOf(cid){
  const c = state.people.get(cid);
  if (!c) return null;
  const a = state.accounts.get(c.accountId) || {};
  return { contactId:cid, accountId:c.accountId || '', org:a.name || '', name:personLabel(c),
           phone:c.phone || '', email:c.email || '', kakao:c.kakao || '' };
}
/** 유형(role)별 담당자 목록: [{id, c, a}] — 기관명·이름 순 */
function peopleOfType(type){
  return [...state.people.entries()]
    .map(([id,c]) => ({ id, c, a:state.accounts.get(c.accountId) }))
    .filter(x => x.a && (!type || x.a.type === type))
    .sort((x,y) => (x.a.name||'').localeCompare(y.a.name||'','ko') || personLabel(x.c).localeCompare(personLabel(y.c),'ko'));
}
const optLabel = x => (x.a?.name || '(기관 없음)') + ' — ' + (personLabel(x.c) || '(이름 없음)');
const projectsLinkedTo = pred => [...state.projects.entries()].filter(([,p]) => ROLE_ORDER.some(r => pred(p.contacts?.[r] || {}, r)));

async function writeMaster(col, map, id, data){
  const now = new Date().toISOString();
  data.updatedAt = now; if (!data.createdAt) data.createdAt = now;
  map.set(id, data);
  syncProjects();
  render();
  if (!db || !writable) return;
  try { await db.doc(col + '/' + id).set(data); }
  catch (e) { setNotice('기관·담당자 저장에 실패했습니다 (' + ((e&&e.code)||'unknown') + ').'); }
}
const saveAccount = (id, data) => writeMaster('accounts', state.accounts, id, data);
const saveContact = (id, data) => writeMaster('contacts', state.people, id, data);
async function deleteMaster(col, map, id){
  map.delete(id); render();
  if (db && writable){ try { await db.doc(col + '/' + id).delete(); } catch(e){} }
}

/** 마스터 → 과제 스냅샷 반영. 실제로 달라진 과제만 다시 저장한다. */
function syncProjects(){
  for (const [pid, p] of state.projects){
    let np = null;
    const edit = () => (np = np || structuredClone(p));
    for (const r of ROLE_ORDER){
      const cur = p.contacts?.[r];
      if (!cur) continue;
      if (cur.contactId){
        const snap = snapshotOf(cur.contactId);
        if (snap && SNAP_KEYS.some(k => (cur[k] || '') !== snap[k])) Object.assign(edit().contacts[r], snap);
      } else if (cur.accountId){
        const a = state.accounts.get(cur.accountId);
        if (a && (cur.org || '') !== a.name) edit().contacts[r].org = a.name;
      }
    }
    // 소공인 기관명 = 과제 업체명
    const sa = state.accounts.get((np || p).contacts?.sogongin?.accountId);
    if (sa && sa.name && (np || p).company !== sa.name) edit().company = sa.name;
    if (np) save(pid, np);
  }
}

/* ======================= 방문지 · 지도 =======================
   방문지 = 과제 구축지(p.visit)가 있으면 그것, 없으면 소공인 기관 주소.
   지도 SDK·우편번호 검색은 CSP에 막혀 쓰지 않고, 외부 지도를 새 탭 링크로 연다.
   구글은 대중교통 경로를 바로 열고, 네이버·카카오는 좌표 없이 경로를 열 수 없어 주소 검색 화면까지 연다.
   출발지는 보는 사람별 편의 설정이라 localStorage(비우면 현재 위치).                        */
function visitOf(p){
  if (p?.visit?.address) return { address:p.visit.address, addressDetail:p.visit.addressDetail || '', visitNote:p.visit.visitNote || '', src:'site' };
  const aid = p?.contacts?.sogongin?.accountId;
  const a = aid && state.accounts.get(aid);
  if (a?.address) return { address:a.address, addressDetail:a.addressDetail || '', visitNote:a.visitNote || '', src:'account', accountId:aid };
  return null;
}
const fullAddr = v => [v.address, v.addressDetail].filter(Boolean).join(' ');
const ORIGIN_KEY = 'smartcodi.origin';
function getOrigin(){ try { return localStorage.getItem(ORIGIN_KEY) || ''; } catch (e) { return ''; } }
function setOrigin(v){ try { if (v) localStorage.setItem(ORIGIN_KEY, v); else localStorage.removeItem(ORIGIN_KEY); } catch (e) {} }
/* 현재 위치: 출발지를 비워 두면 브라우저 위치(권한 필요)를 한 번 찾아 구글 길찾기 출발지로 넣는다.
   좌표는 이 화면의 메모리에만 두고 저장하지 않는다(보는 사람의 위치 — 공유 데이터 아님).
   위치를 못 얻으면(권한 거부·미지원·화면 제한) origin 없이 열어 구글 지도가 기기 위치로 출발지를 잡게 둔다. */
let here = null, hereState = '';   // '' | 'finding' | 'ok' | 'fail'
function locateHere(force){
  if (hereState && !force) return;
  if (!navigator.geolocation){ hereState = 'fail'; return; }
  hereState = 'finding';
  navigator.geolocation.getCurrentPosition(
    pos => { here = { lat:+pos.coords.latitude.toFixed(5), lng:+pos.coords.longitude.toFixed(5) }; hereState = 'ok'; render(); },
    () => { here = null; hereState = 'fail'; render(); },
    { enableHighAccuracy:false, timeout:10000, maximumAge:600000 });
}
const originForMap = () => getOrigin() || (here ? here.lat + ',' + here.lng : '');
/** 목적지는 도로명 주소만(상세를 붙이면 검색이 실패하기 쉽다). 출발지 = 입력한 출발지 > 현재 위치(자동) > 구글이 기기 위치로 */
function mapLinks(addr, origin = originForMap()){
  const q = encodeURIComponent(addr);
  return {
    transit:'https://www.google.com/maps/dir/?api=1' + (origin ? '&origin=' + encodeURIComponent(origin) : '') + '&destination=' + q + '&travelmode=transit',
    naver:'https://map.naver.com/p/search/' + q,
    kakao:'https://map.kakao.com/link/search/' + q,
  };
}
function extLink(cls, text, href, title){
  const a = document.createElement('a');
  a.className = cls; a.textContent = text; a.href = href; a.target = '_blank'; a.rel = 'noopener noreferrer';
  if (title) a.title = title;
  return a;
}
function mapButtons(v){
  const L = mapLinks(v.address);
  const row = el('div','lact maps');
  const tip = '주소 검색 화면이 열립니다. 거기서 «도착»을 누르면 버스·지하철 경로가 나옵니다';
  row.append(
    extLink('btn primary', '대중교통 길찾기 ↗', L.transit, (getOrigin() || (here ? '현재 위치(' + here.lat + ', ' + here.lng + ')' : '현재 위치(구글 지도가 찾음)')) + ' → ' + v.address + ' (구글 지도 대중교통)'),
    extLink('btn', '네이버 지도 ↗', L.naver, tip),
    extLink('btn', '카카오맵 ↗', L.kakao, tip));
  const cp = el('button','btn ghost','주소 복사');
  cp.addEventListener('click', () => copyText(cp, fullAddr(v)));
  row.append(cp);
  return row;
}
function originControl(){
  const saved = getOrigin();
  if (!saved) locateHere();   // 출발지를 비워 두면 현재 위치를 자동으로 찾는다(한 번, 첫 호출에 브라우저 권한 창)
  const w = el('label','origin');
  w.append(document.createTextNode('출발지'));
  const i = document.createElement('input');
  i.placeholder = hereState === 'ok' ? '현재 위치 (자동) — 다른 곳이면 입력' : hereState === 'finding' ? '현재 위치 찾는 중…' : '비우면 현재 위치 (예: 사무실 주소)';
  i.value = saved;
  i.addEventListener('change', () => { setOrigin(i.value.trim()); render(); });
  w.append(i);
  const st = el('span','ohere');
  if (saved){
    const b = el('button','btn ghost','현재 위치로');
    b.type = 'button'; b.title = '입력한 출발지를 지우고 현재 위치를 씁니다';
    b.addEventListener('click', e => { e.preventDefault(); setOrigin(''); locateHere(true); render(); });
    st.append(b);
  } else if (hereState === 'ok') st.textContent = '📍 현재 위치 자동 (' + here.lat + ', ' + here.lng + ')';
  else if (hereState === 'fail'){
    st.textContent = '위치 권한이 없어 구글 지도가 기기 위치로 출발지를 잡습니다 ';
    const b = el('button','btn ghost','다시 찾기');
    b.type = 'button';
    b.addEventListener('click', e => { e.preventDefault(); locateHere(true); render(); });
    st.append(b);
  }
  w.append(st);
  return w;
}

let visitEdit = null;   // 구축지 입력칸을 연 과제 id
/** 과제 상세 «방문지» 섹션 */
function visitSection(id, p){
  const box = el('div','visit');
  const v = visitOf(p);
  const sgAid = p.contacts?.sogongin?.accountId;
  if (v){
    const line = el('div','linked');
    line.append(el('b', null, fullAddr(v)), document.createTextNode(' '), el('span','badge sample', v.src === 'site' ? '과제 구축지' : '소공인 기관 주소'));
    box.append(line);
    if (v.visitNote) box.append(el('div','rnote', '방문 안내: ' + v.visitNote));
    box.append(mapButtons(v), originControl());
  } else {
    box.append(el('div','rnote','방문지 주소가 없습니다. 소공인 기관 주소를 입력하거나, 방문 현장(구축지)이 다르면 따로 입력하세요.'));
  }
  const la = el('div','lact');
  if (sgAid && state.accounts.has(sgAid)){
    const b = el('button','btn ghost', state.accounts.get(sgAid).address ? '기관 주소 수정' : '기관 주소 입력');
    b.addEventListener('click', () => openAccountForm(sgAid));
    la.append(b);
  }
  const editing = visitEdit === id;
  const sb = el('button','btn ghost', editing ? '구축지 입력 닫기' : p.visit?.address ? '구축지 수정' : '구축지 따로 입력');
  sb.addEventListener('click', () => { visitEdit = editing ? null : id; render(); });
  la.append(sb);
  if (p.visit){
    const ub = el('button','btn ghost','기관 주소 사용');
    ub.title = '과제 구축지를 지우고 소공인 기관 주소를 방문지로 씁니다';
    ub.addEventListener('click', () => { const np = structuredClone(state.projects.get(id)); delete np.visit; visitEdit = null; save(id, np); });
    la.append(ub);
  }
  box.append(la);
  if (editing){
    const g = el('div','cin');
    for (const [k, ph] of [['address','구축지 도로명 주소'], ['addressDetail','상세 (동·층·호)'], ['visitNote','방문 안내 (주차·출입)']]){
      const i = document.createElement('input');
      i.id = 'vs-' + id + '-' + k; i.placeholder = ph; i.value = p.visit?.[k] || '';
      if (k === 'address') i.style.gridColumn = '1 / -1';
      i.addEventListener('change', () => {
        const np = structuredClone(state.projects.get(id));
        np.visit = Object.assign({ address:'', addressDetail:'', visitNote:'' }, np.visit);
        np.visit[k] = i.value.trim();
        if (!np.visit.address && !np.visit.addressDetail && !np.visit.visitNote) delete np.visit;
        save(id, np);
      });
      g.append(i);
    }
    box.append(g);
  }
  return box;
}

const WEEK = '일월화수목금토';
const withDow = d => d ? d + ' (' + WEEK[new Date(d + 'T00:00:00').getDay()] + ')' : '';
const mmdd = ts => { const d = new Date(ts); return isNaN(d) ? '' : String(d.getMonth() + 1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };
/** "정상호 대표" → "정상호" (주소록 연결이면 이름 칸 그대로) */
function bareName(c){
  if (!c) return '';
  const m = c.contactId && state.people.get(c.contactId);
  if (m) return m.name || '';
  const mt = String(c.name || '').match(/^(.+?)\s+(\S+)$/);
  return mt && TITLES.test(mt[2]) ? mt[1] : (c.name || '');
}

/** 근거 목록: 단계 메모(작성순) + 체크된 업무 + 연락 이력(오래된 순) */
function evidence(p, steps, opts = {}){
  const lines = [];
  for (const n of steps){
    const st = p.steps?.[String(n)] || {};
    for (const nt of st.notes || []) lines.push('· (' + mmdd(nt.ts) + ') ' + nt.text);
    if (opts.tasksOf) for (const t of STEPS[n - 1].tasks[opts.tasksOf] || []) if (st.tasks?.[n + '|' + opts.tasksOf + '|' + t]) lines.push('· [완료] ' + t);
    if (opts.acts) for (const a of activitiesOf(p).filter(a => a.step === n).reverse())
      lines.push('· (' + mmdd(a.ts) + ') ' + chLabel(a) + ' ' + (KIND_LABEL[a.kind] || '') + (a.channel === 'calendar' ? ' ' + (a.date || '') : ' → ' + (recipText(a.to) || '—')));
  }
  return lines;
}

    .map(([a, pr]) => '· ' + (full ? '[' + (PRODUCT_KIND[pr.kind] || '') + '] ' : '') + productLabel(pr) + ' × ' + (a.qty || 1) + (pr.unit || '대')

/** 초안 → docx Document. D = docx 라이브러리 (브라우저 전역 docx / node require('docx')) */
function buildDocx(D, draft){
  const F = '맑은 고딕';
  const run = (t, o = {}) => new D.TextRun({ text:t, font:F, size:o.size || 20, bold:!!o.bold, color:o.color });
  const paras = (text, o) => String(text || '').split('\n').map(line => new D.Paragraph({ children:[run(line, o)] }));
  const children = [
    new D.Paragraph({ spacing:{ after:120 }, children:[run(draft.intro, { size:16, color:'808080' })] }),
    new D.Paragraph({ alignment:D.AlignmentType.CENTER, spacing:{ after:240 }, children:[run(draft.title, { size:30, bold:true })] }),
  ];
  for (const sec of draft.sections){
    children.push(new D.Paragraph({ spacing:{ before:240, after:120 }, children:[run(sec.heading, { size:22, bold:true })] }));
    children.push(new D.Table({
      width:{ size:9638, type:D.WidthType.DXA }, columnWidths:[2700, 6938],
      rows: sec.rows.map(([k, v]) => new D.TableRow({ children:[
        new D.TableCell({ width:{ size:2700, type:D.WidthType.DXA }, shading:{ type:D.ShadingType.CLEAR, color:'auto', fill:'EEF1F6' }, children:paras(k, { bold:true }) }),
        new D.TableCell({ width:{ size:6938, type:D.WidthType.DXA }, children:paras(v) }),
      ]})),
    }));
    if (sec.note) children.push(new D.Paragraph({ spacing:{ before:80 }, children:[run(sec.note, { size:18, color:'555555' })] }));
  }
  for (const l of draft.sign || []) children.push(new D.Paragraph({ spacing:{ before:200 }, children:[run(l)] }));
  return new D.Document({ sections:[{ properties:{ page:{ size:{ width:11906, height:16838 }, margin:{ top:1134, bottom:1134, left:1134, right:1134 } } }, children }] });
}

let docxLoading = null;
function loadDocx(){
  if (window.docx) return Promise.resolve(window.docx);
  return docxLoading = docxLoading || new Promise((ok, fail) => {
    const s = document.createElement('script');
    s.src = DOCX_URL;
    s.onload = () => window.docx ? ok(window.docx) : fail(new Error('no global'));
    s.onerror = () => { docxLoading = null; fail(new Error('load')); };
    document.head.append(s);
  });
}

/* ======================= 첨부 · 과제 자료함 =======================
   메일 첨부 출처: 내 컴퓨터 / 보드 파일(과제 자료함 · Word 초안 · 양식 원본 PDF) / 구글 드라이브.
   첨부 항목: { key, name, size, mime, src, blob? | load(), link? } — link 항목은 파일이 아니라 본문 링크.
   전송 한도(커넥터 입력 1MiB): 700KB 이하 파일은 base64로 합계 700KB까지, 그보다 큰 파일은 $file로 호출당 1개(16MiB).
   자료함은 assets 저장소(PDF·이미지·동영상·텍스트만, 파일당 20MB). hwp·xlsx·docx는 플랫폼이 받지 않는다 → 드라이브.  */
const FORM_PDFS = [
  { path:'forms/plan.pdf',   name:'1. 소공인 사업계획서(총괄표, 상세).pdf',      size:171831 },
  { path:'forms/log.pdf',    name:'2. 소공인 코디네이터 수행일지(양식, 예시).pdf', size:3699278 },
  { path:'forms/result.pdf', name:'3. 소공인 코디네이터 결과보고서.pdf',          size:478485 },
  { path:'forms/cases.pdf',  name:'4. 실습 교육 제공 사례.pdf',                 size:1057567 },
];
const MIME_BY_EXT = {
  pdf:'application/pdf', png:'image/png', jpg:'image/jpeg', jpeg:'image/jpeg', gif:'image/gif', webp:'image/webp', svg:'image/svg+xml',
  txt:'text/plain', csv:'text/csv', md:'text/markdown', json:'application/json', mp4:'video/mp4', webm:'video/webm',
  docx:'application/vnd.openxmlformats-officedocument.wordprocessingml.document',
  xlsx:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',
  pptx:'application/vnd.openxmlformats-officedocument.presentationml.presentation',
  hwp:'application/x-hwp', hwpx:'application/hwp+zip', zip:'application/zip',
};
const extOf = name => (String(name).match(/\.([a-z0-9]+)$/i) || [,''])[1].toLowerCase();
const mimeOf = (name, fallback) => fallback || MIME_BY_EXT[extOf(name)] || 'application/octet-stream';
/** 자료함(assets)에 올릴 수 있는 형식 — 확장자로 판정하고 올릴 때 정확한 type을 넘긴다 */
const STORE_EXT = new Set(['pdf','png','jpg','jpeg','gif','webp','svg','txt','csv','md','json','mp4','webm']);

/** 첨부 목록 → send_message attachments + 본문 끝 링크 블록. 한도를 넘으면 {code:'att_limit'}로 거부 */
async function packAttachments(atts, fileArgs){
  const loaded = [];
  for (const a of atts.filter(a => !a.link)){
    const b = a.blob || await a.load();
    if (!b || !b.size) throw { code:'att_load', message:a.name + ' 파일을 읽지 못했습니다' };
    loaded.push({ a, b });
  }
  const small = [], big = [];
  let inline = 0;
  for (const x of loaded.slice().sort((p, q) => p.b.size - q.b.size)){
    if (x.b.size <= INLINE_MAX && inline + x.b.size <= INLINE_MAX){ inline += x.b.size; small.push(x); }
    else big.push(x);
  }
  if (big.length > 1 || (big.length && (!fileArgs || big[0].b.size > FILE_ARG_MAX)))
    throw { code:'att_limit', over:big.map(x => x.a.name + ' (' + fmtSize(x.b.size) + ')'), fileArgs };
  const attachments = [];
  for (const x of small) attachments.push({ filename:x.a.name, mimeType:mimeOf(x.a.name, x.a.mime || x.b.type), content:await fileBase64(x.b) });
  for (const x of big){
    const type = mimeOf(x.a.name, x.a.mime || x.b.type);
    attachments.push({ filename:x.a.name, mimeType:type, content:{ $file:{ data:x.b, name:x.a.name, type } } });
  }
  const links = atts.filter(a => a.link);
  return { attachments, linkBlock: links.length ? '\n\n[첨부 링크]\n' + links.map(l => '· ' + l.name + ' — ' + l.link).join('\n') : '' };
}
function attLimitText(e){
  return (e.fileArgs
    ? '한 번에 보낼 수 있는 첨부 한도를 넘습니다. 700KB 이하 파일은 합계 700KB까지, 그보다 큰 파일은 1개(16MB까지)만 보낼 수 있습니다.'
    : '이 화면에서는 700KB가 넘는 파일을 보낼 수 없습니다(파일 인자 미지원).')
    + ' 넘치는 파일: ' + e.over.join(', ') + ' — 빼거나 드라이브 링크로 보내세요.';
}
const attachSummary = atts => {
  const files = atts.filter(a => !a.link).map(a => a.name), links = atts.filter(a => a.link).length;
  return files.join(', ') + (links ? (files.length ? ' ' : '') + '(+링크 ' + links + ')' : '');
};

/** 과제 상세 «자료함» 섹션 */

    if (assets){
      const del = el('button','btn ghost danger','삭제');
      del.addEventListener('click', async () => {
        if (!del.dataset.armed){ del.dataset.armed = '1'; del.textContent = '삭제 확인'; return; }
        del.disabled = true;
        try { await assets.delete(f.id); }
        catch (e){ note('삭제하지 못했습니다 (' + ((e && e.code) || 'unknown') + ')'); del.disabled = false; return; }
        const np = structuredClone(state.projects.get(id));
        np.files = (np.files || []).filter(x => x.id !== f.id);
        save(id, np);
      });
      top.append(del);
    }
    row.append(top);
    box.append(row);
  }
  if (assets){
    const up = document.createElement('input');
    up.type = 'file'; up.multiple = true; up.id = 'fu-' + id;
    up.accept = '.pdf,.png,.jpg,.jpeg,.gif,.webp,.txt,.csv,.md,.json,.mp4,.webm';
    up.addEventListener('change', async () => {
      const picked = [...(up.files || [])];
      const bad = picked.filter(f => !STORE_EXT.has(extOf(f.name)));
      const ok = picked.filter(f => STORE_EXT.has(extOf(f.name)));
      const added = [];
      note(ok.length ? '올리는 중…' : '');
      const errs = [];
      for (const f of ok){
        try {
          const r = await assets.upload(f, { type:MIME_BY_EXT[extOf(f.name)] });
          added.push({ id:r.id, name:f.name, type:r.contentType, size:r.sizeBytes, ts:new Date().toISOString() });
        } catch (e){
          errs.push(f.name + ': ' + ({ too_large:'파일이 너무 큽니다(20MB 한도)', unsupported_type:'보관할 수 없는 형식입니다', quota_or_state:'저장 공간이 부족합니다', not_granted:'올리기 권한이 없습니다' }[e && e.code] || '올리지 못했습니다 (' + ((e && e.code) || 'unknown') + ')'));
        }
      }
      if (bad.length) errs.push(bad.map(f => f.name).join(', ') + ': 보드 자료함은 PDF·이미지·텍스트만 보관합니다(플랫폼 제한). 한글·엑셀·워드는 구글 드라이브에 두고 메일에서 «구글 드라이브»로 첨부하세요.');
      note(errs.join(' / ') || (added.length ? added.length + '개 올렸습니다.' : ''));
      up.value = '';
      if (added.length){
        const np = structuredClone(state.projects.get(id));
        np.files = (np.files || []).concat(added);
        save(id, np);
      }
    });
    const lab = el('label','btn', '파일 올리기');
    lab.htmlFor = up.id;
    up.style.display = 'none';
    const act = el('div','lact');
    act.append(lab);
    box.append(act, up);
  }
  box.append(msg);
  return box;
}

/** 과제의 역할 담당자를 마스터 담당자로 지정(또는 cid 없으면 해제). */
function assignContact(pid, role, cid){
  const cur = state.projects.get(pid);
  if (!cur) return;
  const np = structuredClone(cur);
  np.contacts = np.contacts || {};
  if (cid){
    const snap = snapshotOf(cid);
    if (!snap) return;
    np.contacts[role] = snap;
    if (role === 'sogongin' && snap.org) np.company = snap.org;
  } else {
    // 해제: 값은 직접 입력 칸으로 남기고 연결만 끊는다
    const old = np.contacts[role] || {};
    np.contacts[role] = { name:old.name || '', phone:old.phone || '', email:old.email || '', kakao:old.kakao || '' };
  }
  save(pid, np);
}

/* 저장은 바뀐 부분만 update(중첩 객체는 병합)로 보낸다 — 두 사람이 같은 과제의 다른 필드·다른 단계를
   동시에 고쳐도 서로 지우지 않는다. 배열(notes·activities·files)은 통째로 바뀌므로 같은 배열에
   거의 동시에 추가하면 나중 것이 이긴다(스냅샷 구독으로 창은 짧다). update는 필드 삭제를 못 하므로
   키가 사라진 변경(구축지 삭제·담당자 해제 등)만 전체 set으로 쓴다. 같은 문서 쓰기는 한 번에 하나(대기열). */
const deepEq = (a, b) => JSON.stringify(a) === JSON.stringify(b);
const isObj = v => v && typeof v === 'object' && !Array.isArray(v);
/** prev → next 병합 패치. 사라진 키가 있으면 null(= 전체 set 필요) */
function patchOf(prev, next){
  for (const k of Object.keys(prev)) if (!(k in next)) return null;
  const out = {};
  for (const k of Object.keys(next)){
    if (deepEq(prev[k], next[k])) continue;
    if (isObj(prev[k]) && isObj(next[k])){
      const sub = patchOf(prev[k], next[k]);
      if (sub === null) return null;
      out[k] = sub;
    } else out[k] = next[k];
  }
  return out;
}
const writeQ = new Map();   // 문서 경로 → 마지막 쓰기 promise
function queueWrite(path, fn){
  const run = (writeQ.get(path) || Promise.resolve()).catch(() => {}).then(fn);
  writeQ.set(path, run);
  return run;
}
async function save(id, data){
  const prev = state.projects.get(id);
  data.updatedAt = new Date().toISOString();
  state.projects.set(id, data);
  render();
  if (!db || !writable) return;
  const ref = db.doc('projects/' + id);
  const patch = prev ? patchOf(prev, data) : null;
  try {
    await queueWrite(ref.path || 'projects/' + id, async () => {
      if (patch === null) return ref.set(data);
      try { await ref.update(patch); }
      catch (e){ if (e && e.code === 'invalid_argument') await ref.set(data); else throw e; }   // 문서가 없으면(새로 만듦·다른 사람이 삭제) 전체 쓰기
    });
  } catch (e) {
    if (e && e.code === 'invalid_argument') {
      writable = false;
      setNotice('이 계정은 보기 권한만 있어 변경 내용이 저장되지 않습니다. 편집하려면 공유 설정에서 Contributor 이상 권한이 필요합니다.');
    } else {
      setNotice('저장에 실패했습니다 ('+((e&&e.code)||'unknown')+'). 잠시 후 다시 시도해 주세요.');
    }
    render();
  }
}
/* 과제 삭제: 문서와 자료함 파일(assets)을 지운다. 구글 캘린더 일정은 보드가 지우지 않으므로(삭제 권한 없음) 남은 건수를 알린다. */
async function removeProject(id){
  const p = state.projects.get(id) || {};
  for (const [aid] of assetsWhere(a => a.projectId === id)) deleteMaster('assets', state.assets, aid);   // 과제에 딸린 자산도 함께 지운다
  const files = p.files || [];
  const calCount = new Set(activitiesOf(p).filter(a => a.channel === 'calendar' && a.eventId).map(a => a.eventId)).size;
  state.projects.delete(id);
  if (state.openId === id) state.openId = null;
  render();
  if (!db || !writable) return;
  try { await queueWrite('projects/' + id, () => db.doc('projects/' + id).delete()); } catch (e) {}
  let left = 0;
  for (const f of files){
    try { if (assets) await assets.delete(f.id); else left++; } catch (e) { left++; }
  }
  const msgs = [];
  if (calCount) msgs.push('구글 캘린더에 등록된 일정 ' + calCount + '건은 지워지지 않았습니다 — 구글 캘린더에서 직접 지우세요.');
  if (left) msgs.push('자료함 파일 ' + left + '개를 지우지 못했습니다.');
  if (msgs.length) setNotice('«' + (p.company || '') + ' ' + (p.cycle || '') + '» 과제를 삭제했습니다. ' + msgs.join(' '));
}

/* ======================= 작성자 (G) =======================
   메모(notes[].by)·활동(activities[].by)에 기록한 사람의 불투명 id만 남긴다. 이름은 저장하지 않고
   볼 때 user.profiles()로 푼다(이름은 보는 사람마다·시점마다 다를 수 있다). 이전 기록은 by가 없다. */
const authorNames = new Map();   // id → 이름('' = 풀 수 없음). 화면 캐시일 뿐 저장하지 않는다
let authorsBusy = false;
const who = id => authorNames.get(id) || '작성자 미확인';
async function resolveAuthors(){
  if (!user || authorsBusy) return;
  const ids = new Set();
  for (const p of state.projects.values()){
    for (const st of Object.values(p.steps || {})) for (const nt of st.notes || []) if (nt.by) ids.add(nt.by);
    for (const a of p.activities || []) if (a.by) ids.add(a.by);
  }
  const missing = [...ids].filter(i => !authorNames.has(i));
  if (!missing.length) return;
  authorsBusy = true;
  try {
    const ps = await user.profiles(missing);
    for (const i of missing) authorNames.set(i, (ps[i] && ps[i].name) || '');
  } catch (e) { for (const i of missing) authorNames.set(i, ''); }
  finally { authorsBusy = false; }
  render();
}

/* ======================= 통합 검색 (J) =======================
   상단 검색은 과제 목록을 거르면서(업체·차수·역할별 담당자 이름·기관·전화·이메일·카톡),
   아래 결과 목록에 과제·기관·담당자를 함께 보여 준다. 숫자만 치면 전화번호를 하이픈 없이 맞춘다. */
function qMatch(q, vals){
  const t = String(q || '').trim().toLowerCase();
  if (!t) return true;
  const qd = /^[\d\s-]+$/.test(t) ? t.replace(/\D/g, '') : '';
  return vals.some(v => {
    const s = String(v || '');
    return s.toLowerCase().includes(t) || (qd.length >= 3 && s.replace(/\D/g, '').includes(qd));
  });
}
const projectHay = p => [p.company, p.cycle, ...ROLE_ORDER.flatMap(r => { const c = p.contacts?.[r] || {}; return [c.name, c.org, c.phone, c.email, c.kakao]; })];

  for (const [id, c] of state.people){

  }
  for (const [id, x] of state.products) if (qMatch(q, [x.name, x.model]))
    hits.push(['product', id, '장비 · ' + (PRODUCT_KIND[x.kind] || ''), productLabel(x), supplierOf(x)?.name || '']);
  for (const [id, a] of state.assets) if (a.serial && qMatch(q, [a.serial]))
    hits.push(['asset', id, '자산', productLabel(state.products.get(a.productId)) + ' · ' + a.serial, projLabel(state.projects.get(a.projectId))]);

  }
  if (hits.length > 12) box.append(el('div','none','상위 12건만 표시합니다. 검색어를 더 입력하세요.'));
  box.hidden = false;
}

   «전체 백업»: 과제·기관·담당자 전체(필터 무시)를 JSON 한 파일로. 복구·이관은 Claude가 ArtifactData로 넣는다

const SIZE_WARN = 180 * 1024;
const docBytes = p => new TextEncoder().encode(JSON.stringify(p)).length;
function backupBtn(){

    };

function trimOldBodies(id){
  const cur = state.projects.get(id);
  if (!cur) return;
  const cutoff = Date.now() - 365 * 86400000;
  const old = x => x.body && Date.parse(x.ts) < cutoff;
  const np = structuredClone(cur);
  let n = 0;
  for (const a of np.activities || []) if (old(a)){ a.body = ''; a.bodyTrimmed = true; n++; }
  for (const st of Object.values(np.steps || {})) for (const ml of st.mails || []) if (old(ml)){ ml.body = ''; ml.bodyTrimmed = true; n++; }
  if (!n){ setNotice('1년 지난 연락 이력이 없어 정리할 본문이 없습니다. 메모가 많다면 오래된 메모를 직접 정리해야 합니다.'); return; }
  save(id, np);
  setNotice('연락 이력 ' + n + '건의 본문을 비웠습니다. 현재 ' + fmtSize(docBytes(np)) + '.');
}

/* ======================= 파생값 ======================= */
const today = () => isoDate(new Date());   // 보는 사람의 현지 날짜(한국 시간). toISOString은 UTC라 새벽 0~9시에 하루 전이 된다

function progress(p){
  let done = 0;
  for (const s of STEPS) if (p.steps[String(s.n)]?.status === 'done') done++;
  return done;
}
function skipped(p){
  let n = 0;
  for (let i = 1; i < (p.currentStep||1); i++) if (p.steps[String(i)]?.status !== 'done') n++;
  return n;
}
function lateSteps(p){
  const t = today(); let n = 0;
  for (const s of STEPS){
    const st = p.steps[String(s.n)];
    if (st && st.planned && st.planned < t && st.status !== 'done') n++;
  }
  return n;
}
function visible(){
  const q = state.q.trim().toLowerCase();
  return [...state.projects.entries()].filter(([,p]) => {
    if (state.coord && (p.contacts?.coord?.name||'') !== state.coord) return false;
    if (state.year && !String(p.cycle||'').startsWith(state.year)) return false;
    if (state.notice && (p.notice || 'none') !== state.notice) return false;
    if (state.hideDone && (p.currentStep||1) >= DONE_COL) return false;
    return qMatch(q, projectHay(p));
  }).sort((a,b) => (a[1].company||'').localeCompare(b[1].company||'','ko') || (a[1].cycle||'').localeCompare(b[1].cycle||''));
}

/* 보고서용 파생값 */
const VISIT_STEPS = [1,2,7,8];   // 1·2·3·4차 방문

function visitRows(){
  const out = [];
  for (const [id,p] of visible()){
    for (const n of VISIT_STEPS){
      const st = p.steps?.[String(n)];
      if (!st || st.status !== 'done' || !st.actual) continue;
      if (st.actual < state.from || st.actual > state.to) continue;
      out.push({ id, date:st.actual, company:p.company, cycle:p.cycle,
                 visit:STEPS[n-1].name, step:n, coord:p.contacts?.coord?.name || '' });
    }
  }
  out.sort((a,b) => a.date.localeCompare(b.date) || a.company.localeCompare(b.company,'ko') || a.step - b.step);
  return out;
}

function statusRows(){
  return visible().map(([id,p]) => {
    let last = '', next = '';
    for (const s of STEPS){
      const st = p.steps?.[String(s.n)] || {};
      if (st.status === 'done' && st.actual && st.actual > last) last = st.actual;
      if (st.status !== 'done' && st.planned && (!next || st.planned < next)) next = st.planned;
    }
    const cur = Math.min(Math.max(p.currentStep||1,1), DONE_COL);
    return { id, p, cur,
      curName: cur >= DONE_COL ? '완료' : STEPS[cur-1].n + '. ' + STEPS[cur-1].name,
      owner: cur >= DONE_COL ? null : STEPS[cur-1].owner,
      done: progress(p), last, next, late: lateSteps(p), skip: skipped(p) };
  });
}

    const meta = el('div','meta');

    meta.append(el('span','count', String(byCol.get(i).length)));
    head.append(meta);
    col.append(head);

    const body = el('div','col-body');
    if (!byCol.get(i).length) body.append(el('div','col-empty', isDone ? '완료된 과제 없음' : '해당 과제 없음'));
    for (const [id,p] of byCol.get(i)) body.append(cardEl(id,p,isDone?null:step));
    col.append(body);

    col.addEventListener('dragover', e => { e.preventDefault(); col.classList.add('drop'); });
    col.addEventListener('dragleave', () => col.classList.remove('drop'));
    col.addEventListener('drop', e => {
      e.preventDefault(); col.classList.remove('drop');
      const id = e.dataTransfer.getData('text/plain');
      const p = state.projects.get(id);
      if (!p || p.currentStep === i) return;
      moveTo(id, i);
    });
    boardEl.append(col);
  }
}

function cardEl(id, p, step){
  const c = el('button','card');
  c.type = 'button';
  c.draggable = true;
  c.style.setProperty('--rc', step ? 'var(--'+ROLES[step.owner].v.slice(2)+')' : 'var(--ink-3)');
  c.append(el('div','co', p.company));

  const sub = el('div','sub');
  sub.append(el('span','cyc mono', p.cycle));
  if (p.contacts?.coord?.name) sub.append(el('span', null, '· ' + p.contacts.coord.name));
  c.append(sub);

  const pips = el('div','pips');
  for (const s of STEPS){
    const st = p.steps[String(s.n)] || {};
    const pip = el('div','pip' + (st.status === 'done' ? ' done' : st.status === 'doing' ? ' doing' : st.status === 'hold' ? ' hold' : ''));
    pip.style.setProperty('--pc', 'var(--'+ROLES[s.owner].v.slice(2)+')');
    pip.title = s.n + '. ' + s.name + ' — ' + (STATUS[st.status] || '대기');
    pips.append(pip);
  }
  c.append(pips);

  const nx = nextDue(p);
  if (nx){
    const line = el('div','nextdue');
    line.append(document.createTextNode('다음 ' + Number(nx.date.slice(5,7)) + '/' + Number(nx.date.slice(8)) + ' ' + nx.s.name),
      el('span','dday ' + (nx.dd < 0 ? 'over' : nx.dd <= 7 ? 'soon' : 'far'), ddayLabel(nx.dd)));
    c.append(line);
  }

  const foot = el('div','foot');
  foot.append(noticeBadge(p));
  const sk = skipped(p), lt = lateSteps(p);
  if (sk) foot.append(el('span','badge warn', '건너뜀 ' + sk));
  if (lt) foot.append(el('span','badge late', '지연 ' + lt));
  if (p.isSample) foot.append(el('span','badge sample','예시'));
  const d = progress(p);
  foot.append(el('span','pct mono', d + '/8'));
  c.append(foot);

  c.addEventListener('click', () => { state.openId = id; state.openSteps = new Set([String(Math.min(p.currentStep||1,8))]); render(); });
  c.addEventListener('dragstart', e => { e.dataTransfer.setData('text/plain', id); e.dataTransfer.effectAllowed = 'move'; c.classList.add('dragging'); });
  c.addEventListener('dragend', () => c.classList.remove('dragging'));
  return c;
}

/** 완료되지 않은 단계 중 예정일이 가장 이른 것 {s, date, dd} */
function nextDue(p){
  let best = null;
  for (const s of STEPS){
    const st = p.steps?.[String(s.n)] || {};
    if (st.planned && st.status !== 'done' && (!best || st.planned < best.date)) best = { s, date:st.planned };
  }
  if (best) best.dd = dayDiff(best.date, today());
  return best;
}
const missingDocs = (s, st) => s.docs.filter(d => !st?.docs?.[d]);

function moveTo(id, col){
  const p = { ...state.projects.get(id) };
  p.steps = JSON.parse(JSON.stringify(p.steps));
  p.currentStep = col;
  if (col < DONE_COL && p.steps[String(col)].status === 'todo') p.steps[String(col)].status = 'doing';
  const miss = [];
  if (col === DONE_COL) for (const s of STEPS) if (p.steps[String(s.n)].status === 'doing'){
    p.steps[String(s.n)].status = 'done';
    if (missingDocs(s, p.steps[String(s.n)]).length) miss.push(s.n + '단계');
  }
  save(id, p);
  // 누락 알림만 — 산출물 체크는 사람이 한다
  if (miss.length) setNotice('«' + p.company + '» 완료 처리 — ' + miss.join(', ') + '에 체크하지 않은 서명·산출물이 있습니다. 과제 상세에서 확인하세요.');
}

/* ======================= 일정 ======================= */
const rv = r => 'var(--' + ROLES[r].v.slice(2) + ')';
const dash = s => s || '—';

// 캘린더 이벤트 본문에 넣는 보드 링크. 다른 아티팩트로 옮겨 게시하면 이 값도 바꾼다.
const BOARD_URL = 'https://claude.ai/artifact/Ur2KLxwfwnpA8Nc1cm5i6Q';

const addDays = (d, n) => { const t = new Date(d + 'T00:00:00'); t.setDate(t.getDate() + n); return isoDate(t); };
const dayDiff = (a, b) => Math.round((Date.parse(a + 'T00:00:00') - Date.parse(b + 'T00:00:00')) / 86400000);
const usDate = d => d.slice(5,7) + '/' + d.slice(8,10) + '/' + d.slice(0,4);
function ddayLabel(n){ return n === 0 ? 'D-DAY' : n > 0 ? 'D-' + n : 'D+' + (-n); }

function scheduleRows(){
  const t = today();
  const out = [];
  for (const [id,p] of visible()){
    for (const s of STEPS){
      const st = p.steps?.[String(s.n)] || {};
      if (!st.planned) continue;
      if (!state.schedDone && st.status === 'done') continue;
      out.push({ id, p, s, st, date:st.planned, dd:dayDiff(st.planned, t),
                 overdue: st.planned < t && st.status !== 'done' });
    }
  }
  out.sort((a,b) => a.date.localeCompare(b.date) || a.p.company.localeCompare(b.p.company,'ko') || a.s.n - b.s.n);
  return out;
}

/* ---------- 구글 캘린더 ----------
   페이지가 보는 사람의 Google Calendar 커넥터(mcp)로 기본 캘린더를 읽고(월간 보기),
   보드 예정일을 종일 일정으로 등록·날짜 수정한다. 등록·수정은 활동(channel 'calendar')으로 남긴다.
   삭제는 하지 않는다. 캘린더에서 직접 고친 날짜는 보드로 돌아오지 않는다(단방향).
   캘린더 시간대가 UTC라 모든 호출에 Asia/Seoul을 준다.                              */
const GCAL = 'Google Calendar';   // claude.ai 커넥터 표시 이름
const TZ = 'Asia/Seoul';
const gcalTitle = r => '[스마트제조] ' + r.p.company + ' · ' + r.s.n + '. ' + r.s.name;

function gcalDetails(r){
  const { p, s } = r;
  const contact = p.contacts?.[s.owner] || {};
  const ownerLine = ROLES[s.owner].label
    + (contact.name ? ' · ' + contact.name + (contact.phone ? ' ' + contact.phone : '') : '');
  return [
    '과제: ' + p.company + ' (' + p.cycle + ')',
    '단계: ' + s.n + '. ' + s.name + ' — ' + s.aim,
    '주관: ' + ownerLine,
    (s.tasks[s.owner] || []).length ? '주관 업무: ' + s.tasks[s.owner].join(' / ') : '',
    '산출물: ' + s.docs.join(', '),
    '담당 코디: ' + (p.contacts?.coord?.name || '미지정')
      + (p.contacts?.coord?.phone ? ' ' + p.contacts.coord.phone : ''),
    '',
    '진행 보드: ' + BOARD_URL,
  ].filter(Boolean).join('\n');
}

/** 구글 캘린더 '일정 만들기' 화면을 내용이 채워진 채로 여는 링크 (종일 일정) — 커넥터가 없을 때의 대체 경로 */
function gcalUrl(r){
  const d = r.st.planned.replace(/-/g,'');
  return 'https://calendar.google.com/calendar/render?action=TEMPLATE'
    + '&text=' + encodeURIComponent(gcalTitle(r))
    + '&dates=' + d + '/' + addDays(r.st.planned, 1).replace(/-/g,'')
    + '&details=' + encodeURIComponent(gcalDetails(r))
    + (visitLocation(r) ? '&location=' + encodeURIComponent(visitLocation(r)) : '');
}
/** 방문 단계면 방문지 전체 주소, 아니면 '' */
const visitLocation = r => { const v = VISIT_STEPS.includes(r.s.n) ? visitOf(r.p) : null; return v ? fullAddr(v) : ''; };

/** 표의 «방문지» 칸: 방문 단계만 길찾기 */
function visitCell(r){
  const c = document.createElement('td');
  if (!VISIT_STEPS.includes(r.s.n)){ c.textContent = '—'; return c; }
  const v = visitOf(r.p);
  if (!v){ c.append(el('span','dday far','주소 없음')); return c; }
  c.append(extLink('gcal', '길찾기 ↗', mapLinks(v.address).transit, fullAddr(v) + ' — 구글 지도 대중교통'));
  return c;
}

/* 이벤트 날짜: 종일은 start.date("YYYY-MM-DDT00:00:00Z" 또는 "YYYY-MM-DD"),
   시각 일정은 start.dateTime(+09:00 오프셋이면 그대로, Z면 브라우저 시간대로 변환) */
function evParts(x){
  if (!x) return null;
  if (x.date) return { day:String(x.date).slice(0,10), time:'' };
  const s = String(x.dateTime || '');
  if (!s) return null;
  if (/[+-]\d\d:\d\d$/.test(s)) return { day:s.slice(0,10), time:s.slice(11,16) };
  const d = new Date(s);
  return isNaN(d) ? null : { day:isoDate(d), time:d.toTimeString().slice(0,5) };
}
/** 이벤트가 걸친 날짜들 (종일 여러 날은 end.date 배타) */
function evDays(e){
  const st = evParts(e.start);
  if (!st) return [];
  const en = evParts(e.end);
  if (st.time || !en || en.day <= st.day) return [st.day];
  const out = [];
  for (let d = st.day; d < en.day && out.length < 62; d = addDays(d, 1)) out.push(d);
  return out;
}

/** 캘린더 활동 색인: eventId → {pid, p, step, date, htmlLink} (같은 이벤트는 최신 기록) */
function calIndex(){
  const m = new Map();
  for (const x of allActivities().slice().reverse())   // 오래된 것부터 → 최신이 덮어씀
    if (x.a.channel === 'calendar' && x.a.eventId) m.set(x.a.eventId, { pid:x.pid, p:x.p, step:x.a.step, date:x.a.date, htmlLink:x.a.htmlLink });
  return m;
}
/** 과제·단계의 최신 캘린더 등록 활동 */
const registeredEvent = (p, step) => activitiesOf(p).find(a => a.channel === 'calendar' && a.step === step && a.eventId) || null;

function calError(e){
  const code = e && e.code;
  switch (code){
    case 'server_not_connected': return 'Google Calendar 커넥터가 연결돼 있지 않습니다. claude.ai 설정 → 커넥터에서 Google Calendar를 추가하세요.';
    case 'needs_reauth':         return 'Google Calendar 연결이 만료됐습니다. claude.ai 설정 → 커넥터에서 다시 연결하세요.';
    case 'selection_required':   return 'Google Calendar 커넥터가 둘 이상 있어 선택이 필요합니다. 화면의 선택 창에서 고르세요.';
    case 'not_in_manifest':
    case 'not_granted':
    case 'capability_disabled':
    case 'capability_removed':   return '이 화면에서 캘린더 사용이 허용되지 않았습니다.';
    case 'blocked_by_policy':
    case 'approval_required':    return '조직 정책으로 캘린더 사용이 막혀 있습니다.';
    case 'tool_error':           return '캘린더가 요청을 거부했습니다: ' + (e.message || '사유 미상');
    case 'bad_request':
    case 'transform_error':      return '캘린더 요청 형식 오류입니다 (' + code + ').';
    default:                     return '캘린더 응답을 확인할 수 없습니다 (' + (code || 'unknown') + '). 구글 캘린더에서 반영 여부를 확인한 뒤 다시 시도하세요.';
  }
}
const CAL_DENIED = new Set(['needs_reauth','server_not_connected','selection_required','not_in_manifest','not_granted','blocked_by_policy','approval_required','capability_disabled','capability_removed']);

/* 월 그리드 범위: 그 달 1일이 든 주의 일요일부터 6주 */
function monthGrid(ym){
  const first = new Date(ym + '-01T00:00:00');
  const start = new Date(first); start.setDate(1 - first.getDay());
  const days = [];
  for (let i = 0; i < 42; i++){ const d = new Date(start); d.setDate(start.getDate() + i); days.push(isoDate(d)); }
  return days;
}
const shiftMonth = (ym, n) => { const d = new Date(ym + '-01T00:00:00'); d.setMonth(d.getMonth() + n); return isoDate(d).slice(0,7); };

let calUnsub = null;
/** 표시 중인 달의 이벤트를 watch한다. 달이 바뀌면 이전 watch를 풀고 새로 건다. */
function ensureCalWatch(){
  if (!mcp || typeof mcp.watchTool !== 'function') return;
  const days = monthGrid(state.calMonth);
  const key = days[0] + '_' + days[41];
  if (state.gcal.key === key && calUnsub) return;
  if (calUnsub) calUnsub();
  state.gcal = { key, events:[], storedAt:0, error:null, loading:true };
  calUnsub = mcp.watchTool(GCAL, 'list_events',
    { startTime:days[0] + 'T00:00:00+09:00', endTime:addDays(days[41], 1) + 'T00:00:00+09:00', timeZone:TZ, orderBy:'startTime', pageSize:250 },
    ev => {
      if (state.gcal.key !== key) return;
      if (ev.type === 'data'){
        const pl = ev.result && ev.result.payload;
        const list = pl && typeof pl === 'object' ? (pl.events || pl.items || []) : [];
        state.gcal = { key, events:list.filter(e => e && e.status !== 'cancelled'), storedAt:(ev.result.cache && ev.result.cache.storedAt) || Date.now(), error:null, loading:false };
      } else {
        const denied = CAL_DENIED.has(ev.error && ev.error.code);
        state.gcal = Object.assign({}, state.gcal, { error:ev.error, loading:false }, denied ? { events:[] } : {});
      }
      if (state.tab === 'sched') renderSched();
    },
    { refetchInterval:300000 });
}
const calRefresh = () => { if (mcp && mcp.invalidate) mcp.invalidate(GCAL, 'list_events').catch(() => {}); };
function calMsg(cls, text){ state.calMsg = text ? { cls, text } : null; if (state.tab === 'sched') renderSched(); }

async function calRegister(r, btn){
  if (!db || !writable) return calMsg('bad', '이 화면은 저장 권한이 없어 캘린더 등록 이력을 남길 수 없습니다.');
  btn.disabled = true; btn.textContent = '등록 중…';
  const summary = gcalTitle(r), description = gcalDetails(r);
  try {
    const input = { summary, description, allDay:true,
      startTime:r.date + 'T00:00:00', endTime:addDays(r.date, 1) + 'T00:00:00', timeZone:TZ };
    const loc = visitLocation(r);
    if (loc) input.location = loc;   // 방문 단계: 구글 캘린더 일정에 지도 링크가 붙는다
    const res = await mcp.callTool(GCAL, 'create_event', input);
    const ev = res && res.payload && typeof res.payload === 'object' ? res.payload : {};
    if (!ev.id) throw { code:'upstream_error', message:'응답에 일정 id가 없습니다' };
    addActivity(r.id, { step:r.s.n, channel:'calendar', record:'auto', kind:'schedule', date:r.date,
      eventId:ev.id, htmlLink:ev.htmlLink || '', subject:summary, body:description, to:[], attachment:'' });
    calRefresh();
    calMsg('ok', r.p.company + ' ' + r.s.n + '단계 일정을 ' + r.date + '에 등록했습니다. «활동»에 기록됐습니다.');
  } catch (e){
    btn.disabled = false; btn.textContent = '등록';
    calMsg('bad', calError(e));
  }
}

async function calMove(r, reg, btn){
  if (!db || !writable) return calMsg('bad', '이 화면은 저장 권한이 없어 캘린더 수정 이력을 남길 수 없습니다.');
  btn.disabled = true; btn.textContent = '수정 중…';
  try {
    const res = await mcp.callTool(GCAL, 'update_event', { eventId:reg.eventId, allDay:true,
      startTime:r.date + 'T00:00:00', endTime:addDays(r.date, 1) + 'T00:00:00', timeZone:TZ });
    const ev = res && res.payload && typeof res.payload === 'object' ? res.payload : {};
    if (!ev.id) throw { code:'upstream_error', message:'응답에 일정 id가 없습니다' };
    addActivity(r.id, { step:r.s.n, channel:'calendar', record:'auto', kind:'schedule', date:r.date,
      eventId:ev.id, htmlLink:ev.htmlLink || reg.htmlLink || '', subject:gcalTitle(r) + ' — 날짜 변경 ' + reg.date + ' → ' + r.date,
      body:gcalDetails(r), to:[], attachment:'' });
    calRefresh();
    calMsg('ok', r.p.company + ' ' + r.s.n + '단계 일정을 ' + reg.date + ' → ' + r.date + '로 옮겼습니다.');
  } catch (e){
    btn.disabled = false; btn.textContent = '날짜 수정';
    calMsg('bad', calError(e));
  }
}

/** 표의 «캘린더» 칸 */
function calCell(r){

    const a = document.createElement('a');
    a.className = 'gcal'; a.href = gcalUrl(r); a.target = '_blank'; a.rel = 'noopener noreferrer';

    c.append(a); return c;

}

/** 월간 보기 카드 */
function calendarCard(rows){

  next.addEventListener('click', () => { state.calMonth = shiftMonth(state.calMonth, 1); renderSched(); });
  now.addEventListener('click',  () => { state.calMonth = today().slice(0,7); renderSched(); });

  else if (g.loading) stat.textContent = '불러오는 중…';
  else if (g.error) stat.textContent = CAL_DENIED.has(g.error.code) ? '캘린더를 읽을 수 없음' : '갱신 실패 — 이전 내용 표시';
  else if (g.storedAt) stat.textContent = Math.max(0, Math.round((Date.now() - g.storedAt) / 60000)) + '분 전 갱신';
  const refresh = el('button','btn ghost','새로고침');
  refresh.hidden = !mcp;

  const open = document.createElement('a');

  if (g.error && mcp){
    const w = el('div','notice'); w.style.margin = '0 0 10px';

    const s = el('div','sendstat ' + state.calMsg.cls); s.style.margin = '0 0 10px';
    s.textContent = state.calMsg.text;

  // 날짜별 칩 모으기
  const days = monthGrid(state.calMonth);
  const byDay = new Map(days.map(d => [d, []]));
  const idx = calIndex();
  for (const e of (mcp ? g.events : [])){
    const link = idx.get(e.id);
    const st = evParts(e.start);
    for (const d of evDays(e)){
      if (!byDay.has(d)) continue;
      byDay.get(d).push({ kind: link ? 'board' : 'ext', e, link, time: d === st?.day ? (st?.time || '') : '',
        text: String(e.summary || '(제목 없음)').replace(/^\[스마트제조\]\s*/, '') });

  for (const r of rows){
    if (!byDay.has(r.date)) continue;
    const reg = registeredEvent(r.p, r.s.n);
    if (reg && reg.date === r.date && mcp) continue;
    byDay.get(r.date).push({ kind:'plan', r, time:'', text: r.p.company + ' · ' + r.s.n + '. ' + r.s.name + (reg ? ' (날짜 변경)' : mcp ? ' (미등록)' : '') });
  }

  const grid = el('div','cgrid');
  for (const w of ['일','월','화','수','목','금','토']) grid.append(el('div','cwd', w));
  const t = today();
  for (const d of days){
    const cell = el('div','cday' + (d.slice(0,7) !== state.calMonth ? ' out' : '') + (d === t ? ' today' : ''));
    cell.append(el('span','dn', String(Number(d.slice(8)))));
    const items = byDay.get(d).sort((a,b) => (a.time ? 1 : 0) - (b.time ? 1 : 0) || a.time.localeCompare(b.time));
    for (const it of items.slice(0, 3)) cell.append(calChip(it));
    if (items.length > 3){
      const more = el('button','cmore', '+' + (items.length - 3));
      more.title = items.slice(3).map(it => (it.time ? it.time + ' ' : '') + it.text).join('\n');
      more.addEventListener('click', () => { cell.replaceChildren(el('span','dn', String(Number(d.slice(8))))); items.forEach(it => cell.append(calChip(it))); });

  }
  card.append(grid);
  card.append(el('div','rnote', mcp
    ? '색 칩 = 보드에서 등록한 일정(누르면 과제 상세) · 회색 칩 = 그 밖의 캘린더 일정(누르면 구글 캘린더) · 점선 칩 = 캘린더에 아직 없는 보드 예정일. 보는 사람의 claude.ai에 연결된 Google Calendar(기본 캘린더)를 읽습니다.'
    : '이 화면은 Google Calendar 커넥터를 쓸 수 없어 보드 예정일만 표시합니다. 아래 «캘린더 추가» 링크나 CSV로 올릴 수 있습니다.'));
  return card;
}

function calChip(it){

    return a;
  }
  const b = el('button','cchip' + (it.kind === 'plan' ? ' plan' : ''), label);
  b.title = label;
  if (it.kind === 'board'){
    const s = STEPS[(it.link.step || 1) - 1];
    b.style.setProperty('--rc', s ? rv(s.owner) : 'var(--ink-3)');

    b.addEventListener('click', () => go('project', it.r.id));
  }
  return b;
}

/* ======================= 회신 추적 =======================
   «자료 요청»·«일정 조율» Gmail 발송(30일 이내)의 스레드를 보는 사람의 Gmail 커넥터(get_thread)로 읽어
   보낸 메일 뒤에 받은 메일(SENT 라벨 없음)이 있으면 회신으로 본다. 회신을 찾으면 활동에 repliedAt을 남겨
   다른 사람(스레드가 없는 메일함)도 보게 한다. 미회신은 저장하지 않고 이 화면에서만 표시한다.
   스레드 id는 보낸 사람 메일함 기준이라 다른 계정에서는 '확인 불가'가 된다.                       */
const REPLY_KINDS = new Set(['request','schedule']);
const replyState = new Map();   // messageId → 'checking' | 'waiting' | 'replied' | 'unknown'
let replyRunning = false, replyDenied = false;
const isReplyTarget = a => a.channel === 'gmail' && REPLY_KINDS.has(a.kind) && a.threadId && a.messageId;

function replyTargets(){
  const cutoff = Date.now() - 30 * 86400000;
  return allActivities().filter(x => isReplyTarget(x.a) && !x.a.repliedAt && Date.parse(x.a.ts) >= cutoff);
}
async function checkReplies(){
  if (!mcp || replyRunning || replyDenied) return;
  const todo = replyTargets().filter(x => !replyState.has(x.a.messageId));
  if (!todo.length) return;
  replyRunning = true;
  const tms = m => Number(m.internalDate) || Date.parse(m.date) || 0;
  try {
    for (const x of todo){
      const mid = x.a.messageId;
      replyState.set(mid, 'checking');
      let res;
      try { res = await mcp.callTool(GMAIL, 'get_thread', { threadId:x.a.threadId, messageFormat:'METADATA_ONLY' }); }
      catch (e){
        replyState.set(mid, 'unknown');
        if (CAL_DENIED.has(e && e.code)){ replyDenied = true; break; }   // 연결·권한 없음: 이번 화면에서는 더 묻지 않는다
        continue;
      }
      const msgs = (res && res.payload && res.payload.messages) || [];
      const sent = msgs.find(m => m.id === mid);
      const t0 = sent ? tms(sent) : Date.parse(x.a.ts);
      const rep = msgs.find(m => m.id !== mid && !(m.labelIds || []).includes('SENT') && !(m.labelIds || []).includes('DRAFT') && tms(m) > t0);
      if (rep){ replyState.set(mid, 'replied'); markReplied(x.pid, mid, new Date(tms(rep)).toISOString()); }
      else replyState.set(mid, sent ? 'waiting' : 'unknown');
    }
  } finally { replyRunning = false; }
  render();
}
function markReplied(pid, mid, at){
  if (!db || !writable) return;
  const cur = state.projects.get(pid);
  const i = (cur?.activities || []).findIndex(a => a.messageId === mid);
  if (i < 0) return;   // 구형 steps[n].mails 기록은 이 화면에서만 표시
  const np = structuredClone(cur);
  np.activities[i].repliedAt = at;
  save(pid, np);
}
/** 활동 배지: 회신 M/D · n일째 미회신 · 확인 불가 */
function replyLabel(a){
  if (!isReplyTarget(a)) return null;
  if (a.repliedAt) return { cls:'ch-auto', text:'회신 ' + mmdd(a.repliedAt).replace('-', '/') };
  const st = replyState.get(a.messageId);
  if (st === 'replied') return { cls:'ch-auto', text:'회신 있음' };
  if (st === 'waiting'){ const n = dayDiff(today(), isoDate(new Date(a.ts))); return { cls:'late', text: n > 0 ? n + '일째 미회신' : '미회신' }; }
  if (st === 'unknown') return { cls:'sample', text:'회신 확인 불가' };
  return null;
}

    // 장비 도입 마감: 사업 종료일까지 «설치 완료»·«가동 중»이 아닌 자산(상태는 사람이 바꾼다)
    const end = programEnd(p);
    if (end) for (const [, a] of assetsWhere(a => a.projectId === id)){
      if (a.status === 'installed' || a.status === 'operating') continue;
      due.push({ id, p, s:STEPS[5], a, pr:state.products.get(a.productId), end, dd:dayDiff(end, t) });
    }
    const iss = planIssues(id, p);
    if (iss.length) plan.push({ id, p, s:STEPS[3], iss });
    for (const s of STEPS){
      const st = p.steps?.[String(s.n)] || {};
      if (st.planned && st.status !== 'done'){
        const it = { id, p, s, st, date:st.planned, dd:dayDiff(st.planned, t) };
        if (st.planned < t) over.push(it);
        else {
          if (VISIT_STEPS.includes(s.n) && st.planned <= wk) soon.push(it);
          if (mcp){ const reg = registeredEvent(p, s.n); if (!reg || reg.date !== st.planned) unreg.push(Object.assign({ reg }, it)); }

      if (st.status === 'done' || st.status === 'doing'){

    ['서명·서류 미수집', docs.length, '단계', 'var(--warn)'],

    const tl = el('div','tile'); tl.style.setProperty('--tc', c);
    tl.append(el('i', null, label), el('b', null, String(val)), el('em', null, unit));

  sum.append(el('div','rnote','상단 검색·연도·공고·코디 필터가 적용됩니다. 행을 누르면 그 단계가 펼쳐진 과제 상세가 열립니다.'));

  const out = [];
  for (const [id,p] of visible()){
    for (const a of activitiesOf(p)){

      if (!day || day < state.from || day > state.to) continue;
      if (state.actCh && a.channel !== state.actCh) continue;

/* ======================= 장비(Product) · 자산(Asset) =======================
   products/{id} = 장비 카탈로그 1종(모델). assets/{id} = 그 장비가 한 과제에 도입된 건(수량·시리얼·상태).
   상태 4단계는 CLAUDE.md 문서화 규칙대로 서로 섞지 않는다(검토 중 → 발주 → 설치 완료 → 가동 중).
   자산 상태와 단계 진행(6단계 장비 공급 등)은 자동으로 잇지 않는다 — 둘 다 사람이 바꾼다.
   공급기업·과제·장비 이름은 id로 그때그때 찾는다(과제 contacts 같은 스냅샷을 두지 않는다). */
const PRODUCT_KIND = { hw:'H/W', sw:'S/W' };
const PRODUCT_UNITS = ['대','식','개','월(임차)'];
const ASSET_STATUS = {
  review:    { label:'검토 중',   cls:'sample' },
  ordered:   { label:'발주',      cls:'warn' },
  installed: { label:'설치 완료', cls:'ntc-main' },
  operating: { label:'가동 중',   cls:'ch-auto' },
};
const productLabel = pr => pr ? [pr.name, pr.model].filter(Boolean).join(' ') || '(이름 없음)' : '(삭제된 장비)';
const supplierOf = pr => state.accounts.get(pr?.supplierId);
const projLabel = p => p ? p.company + ' ' + p.cycle : '(삭제된 과제)';
const won = n => n === '' || n == null ? '' : Number(n).toLocaleString('ko-KR') + '원';
const assetsWhere = pred => [...state.assets.entries()].filter(([, a]) => pred(a));
/* 연도별 사업 규칙 = programs/{연도} 문서(메타정보). 과제 탭 «사업 규칙»에서 편집한다 — 해마다 바뀌는 값은 코드에 두지 않는다.
   없는 연도는 «규칙 없음»으로 두고 한도·기간 경고를 내지 않는다(기본값을 지어내지 않는다).
   총 사업비 = H/W + S/W + 현물. H/W·S/W는 국고+현금으로 사고 현물(인건비)은 그 위에 더해진다(2026 공고 별첨 사업계획서 표).
   S/W ≤ swRate% × 총 ⟺ S/W ≤ (H/W + 현물) × swRate / (100 − swRate) (최대 swCap)
   현물 목표 = inkindRate% × 총 ⟺ (H/W + S/W) × inkindRate / (100 − inkindRate). 원 미만 버림.
   2026 값의 근거: 모집 공고(98_) 본문 1.라·바·사 + 협약일·S/W 전용 불가는 사용자 확인(2026-09-28). */
const programYear = p => String(p?.cycle || '').slice(0, 4);
const programOf = p => state.programs.get(programYear(p)) || null;
const programEnd = p => programOf(p)?.end || '';
const agreementOf = p => p?.agreementDate || programOf(p)?.agreeDefault || '';
const ratioOf = (base, pct) => Math.floor(base * pct / (100 - pct));
const salaryYearOf = p => programOf(p)?.salaryYear || '';
const addMonths = (d, n) => { const t = new Date(d + 'T00:00:00'), day = t.getDate(); t.setDate(1); t.setMonth(t.getMonth() + n);
  t.setDate(Math.min(day, new Date(t.getFullYear(), t.getMonth() + 1, 0).getDate())); return isoDate(t); };
/** start부터 n개월을 쓰면 끝나는 날(마지막 날 포함) */
const monthsEnd = (start, n) => addDays(addMonths(start, n), -1);
/** start~end(양끝 포함)에 들어가는 온전한 개월 수와 남는 일수. start > end면 null */
function periodSpan(start, end){
  if (!start || !end || start > end) return null;
  let months = 0;
  while (monthsEnd(start, months + 1) <= end) months++;
  return { months, days:dayDiff(end, monthsEnd(start, months)) };
}
const spanText = s => s ? s.months + '개월' + (s.days ? ' ' + s.days + '일' : '') : '';
/** 현물 인건비 1명 = 연봉 ÷ 12 × 계상 개월 × 참여율. 값이 빠지면 null */
const laborAmount = x => [x.salary, x.months, x.rate].every(v => v !== '' && v != null && isFinite(v))
  ? Math.floor(Number(x.salary) / 12 * Number(x.months) * Number(x.rate) / 100) : null;
/** 현물로 계상할 수 있는 인력 = 직전년도 연봉이 있는 대표자·기존 직원(eligible 체크) */
const laborTotal = p => (p?.labor || []).filter(x => x.eligible).reduce((n, x) => n + (laborAmount(x) || 0), 0);
/** 과제 자산의 견적 합계(수량 × 장비 단가), 현물(인건비), S/W·현물 한도. 단가 없는 장비는 합계에서 빼고 noPrice에 모은다 */
function budgetOf(pid){
  const sum = { hw:0, sw:0 }, noPrice = [];
  for (const [, a] of assetsWhere(a => a.projectId === pid)){
    const pr = state.products.get(a.productId);
    if (!pr || !(pr.kind in sum)) continue;
    if (pr.unitPrice === '' || pr.unitPrice == null){ noPrice.push(productLabel(pr)); continue; }
    sum[pr.kind] += (Number(a.qty) || 1) * Number(pr.unitPrice);
  }
  const p = state.projects.get(pid), rule = programOf(p);
  const inkind = laborTotal(p);
  const limit = rule ? Math.min(ratioOf(sum.hw + inkind, rule.swRate), rule.swCap) : null;
  const inkindMax = rule ? ratioOf(sum.hw + sum.sw, rule.inkindRate) : null;   // 현물 목표(= 상한)
  // 총 사업비 = H/W + S/W + 현물, 국비 = 총 × govRate%, 현금 = 나머지(현물이 모자라면 현금이 는다). govRate가 없는 규칙이면 null
  const total = sum.hw + sum.sw + inkind;
  const gov = rule && isFinite(rule.govRate) && rule.govRate !== '' ? Math.floor(total * rule.govRate / 100) : null;
  return { hw:sum.hw, sw:sum.sw, inkind, rule, year:programYear(p), limit, over:rule ? sum.sw - limit : 0,
           inkindMax, inkindOver:rule ? inkind - inkindMax : 0, hasLabor:!!(p?.labor || []).length, noPrice,
           total, gov, cash:gov == null ? null : total - gov - inkind, govOver:gov != null && rule.govCap ? gov - rule.govCap : 0 };
}
/** 현물 목표를 채울 수 있는 최대액: 직전년도 연봉이 있는 인력 전원 × 참여율 100% × 사업기간 온전한 개월. 그런 인력이 없으면 null */
function inkindMost(p, span){
  const elig = (p.labor || []).filter(x => x.eligible && x.salary !== '' && x.salary != null);
  return elig.length && span ? elig.reduce((n, x) => n + Math.floor(Number(x.salary) / 12 * span.months), 0) : null;
}
/** 사업계획서 점검 결과(짧은 문구 배열). 규칙이 있고, 4단계가 완료 전이고, 도입 장비가 있는 과제만 — «오늘» 카드용 */
function planIssues(id, p){
  const rule = programOf(p);
  if (!rule || p.steps?.['4']?.status === 'done') return [];
  const b = budgetOf(id);
  if (!(b.hw + b.sw)) return [];
  const out = [], end = programEnd(p), ag = agreementOf(p), span = periodSpan(ag, end);
  if (b.sw > 0 && b.over > 0) out.push('S/W 한도 ' + won(b.over) + ' 초과');
  for (const [, a] of assetsWhere(a => a.projectId === id)){
    const pr = state.products.get(a.productId);
    if (pr && pr.kind === 'sw' && pr.unit === '월(임차)' && ag && end && monthsEnd(ag, Number(a.qty) || 1) > end) out.push('S/W 임차 기간 초과(' + productLabel(pr) + ')');
  }
  if (b.inkind > 0 && b.inkindOver > 0) out.push('현물 ' + won(b.inkindOver) + ' 초과');
  if (b.inkindMax > 0 && b.inkindOver < 0) out.push('현물 ' + won(-b.inkindOver) + ' 부족');
  const most = inkindMost(p, span);
  if (most != null && b.inkindMax > 0 && most < b.inkindMax) out.push('현물 목표를 채울 수 없음(최대 ' + won(most) + ')');
  const lb = p.labor || [];
  if (span && lb.some(x => x.months !== '' && x.months != null && Number(x.months) > span.months)) out.push('계상 개월이 사업기간 초과');
  const noSal = lb.filter(x => !x.eligible).length;
  if (noSal) out.push('직전년도 연봉 미확인 ' + noSal + '명');
  if (b.govOver > 0) out.push('국비 상한 ' + won(b.govOver) + ' 초과');
  return out;
}
/** 한도 경고 줄들(과제 상세·4단계 체크포인트 공용). short = 현물 부족도 경고(체크포인트는 항상, 과제 상세는 인력을 넣었을 때만) */
function budgetWarnings(b, short = b.hasLabor){
  const out = [];
  if (!b.rule) return out;
  if (b.sw > 0 && b.over > 0) out.push('⚠ S/W 임차비가 한도를 ' + won(b.over) + ' 초과합니다. 임차 기간·금액 조정이 필요합니다.');
  if (b.inkind > 0 && b.inkindOver > 0) out.push('⚠ 현물(인건비)이 총 사업비의 ' + b.rule.inkindRate + '%를 ' + won(b.inkindOver) + ' 넘습니다. 참여율·계상 개월을 줄이세요.');
  if (b.govOver > 0) out.push('⚠ 국비(총 사업비의 ' + b.rule.govRate + '%)가 상한 ' + won(b.rule.govCap) + '을 ' + won(b.govOver) + ' 넘습니다. 국비는 상한까지만 지원됩니다(초과분 처리는 공고·운영지침 확인).');
  if (short && b.inkindMax > 0 && b.inkindOver < 0) out.push('⚠ 현물이 목표(총 사업비의 ' + b.rule.inkindRate + '%)보다 ' + won(-b.inkindOver) + ' 부족합니다 — 부족분만큼 현금 자부담이 늘어납니다.');
  return out;
}

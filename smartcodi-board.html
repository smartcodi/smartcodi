/* 단계 «산출물 초안»: 도우미가 쓴 양식 초안 버전(steps[n].outputs). Word는 저장된 내용으로 그때 만든다(자료함은 docx 불가). */
let outOpen = null;   // 펼친 초안 id
function outputsEl(id, p, key, st){
  const outs = st.outputs || [];
  if (!outs.length) return null;
  const box = el('div','outs');
  box.append(el('div','subhead','산출물 초안 ' + outs.length + '건 — 도우미로 작성 (산출물 체크는 서명·제출 후 직접)'));
  for (const o of outs.slice().reverse()){
    const row = el('div','frow pout');
    const top = el('div','lact');
    top.append(el('b', null, o.name), el('span','fmsg', fmtTs(o.ts) + (o.by ? ' · ' + who(o.by) : '')));
    const wb = el('button','btn','Word로 받기'); wb.disabled = !downloads;
    wb.addEventListener('click', () => saveDraftDocx(p, o.name, o.draft, wb));
    const open = outOpen === o.id;
    const vb = el('button','btn ghost', open ? '닫기' : '보기');
    vb.addEventListener('click', () => { outOpen = open ? null : o.id; render(); });
    const del = el('button','btn ghost danger','삭제');
    del.addEventListener('click', () => {
      if (!del.dataset.armed){ del.dataset.armed = '1'; del.textContent = '삭제 확인'; return; }
      const np = structuredClone(state.projects.get(id));
      np.steps[key].outputs = (np.steps[key].outputs || []).filter(x => x.id !== o.id);
      save(id, np);
    });
    top.append(wb, vb, del);
    row.append(top);
    if (open && o.draft) row.append(draftView(o.draft));
    box.append(row);
  }
  return box;
}

let stepWarn = null;   // '과제id|단계' — 방금 완료로 바꾼 단계의 누락 알림
function stepEl(id, p, s){
  const key = String(s.n);
  const st = p.steps[key] || { status:'todo', planned:'', actual:'', tasks:{}, docs:{}, notes:[] };
  const open = state.openSteps.has(key);
  const rc = 'var(--'+ROLES[s.owner].v.slice(2)+')';

  const wrap = el('div','step' + (open ? ' open' : ''));
  wrap.style.setProperty('--rc', rc);

  const head = el('button','step-head');
  head.type = 'button';
  head.append(el('span','n mono', String(s.n)));
  const t = el('span','t', s.name); head.append(t);
  const doneDocs = s.docs.filter(d => st.docs?.[d]).length;
  head.append(el('span','count mono', doneDocs + '/' + s.docs.length));
  head.append(el('span','state ' + (st.status === 'todo' ? '' : st.status), STATUS[st.status] || '대기'));
  head.append(el('span','chev','▶'));
  head.addEventListener('click', () => {
    if (state.openSteps.has(key)) state.openSteps.delete(key); else state.openSteps.add(key);
    render();
  });
  wrap.append(head);
  if (!open) return wrap;

  const body = el('div','step-body');

  if (stepWarn === id + '|' + key && st.status === 'done'){
    const miss = missingDocs(s, st);   // 체크하면 목록이 줄고, 다 체크하면 사라진다
    if (miss.length){
      const w = el('div','notice'); w.style.margin = '0';
      w.textContent = '완료로 바꿨지만 체크하지 않은 서명·산출물이 있습니다: ' + miss.join(', ') + '. 상태는 그대로 두었습니다 — 받았으면 아래에서 체크하세요. ';
      const x = el('button','btn ghost','닫기');
      x.addEventListener('click', () => { stepWarn = null; render(); });
      w.append(x);
      body.append(w);
    }
  }

  // 상태 / 일자
  const row = el('div','field-row');
  const mk = (label, node) => { const f = el('div','field'); const l = el('label', null, label); l.htmlFor = node.id; f.append(l, node); return f; };

  const sel = document.createElement('select'); sel.id = 'st-'+id+'-'+key;
  for (const [k,v] of Object.entries(STATUS)) sel.append(new Option(v, k));
  sel.value = st.status || 'todo';
  sel.addEventListener('change', () => {
    const np = structuredClone(p);
    np.steps[key].status = sel.value;
    if (sel.value === 'done'){
      stepWarn = missingDocs(s, np.steps[key]).length ? id + '|' + key : null;   // 알림만. 상태는 사람이 고른 그대로
      if (!np.steps[key].actual) np.steps[key].actual = today();
      if ((np.currentStep||1) <= s.n) np.currentStep = Math.min(s.n + 1, DONE_COL);
    }
    if (sel.value === 'doing' && (np.currentStep||1) !== s.n) np.currentStep = s.n;
    save(id, np);
  });
  row.append(mk('진행 상태', sel));

  for (const [f, label] of [['planned','예정일'],['actual','완료일']]){
    const inp = document.createElement('input');
    inp.type = 'date'; inp.id = 'd-'+id+'-'+key+'-'+f; inp.value = st[f] || '';
    inp.addEventListener('change', () => { const np = structuredClone(p); np.steps[key][f] = inp.value; save(id, np); });
    row.append(mk(label, inp));
  }
  body.append(row);

  // 역할별 task
  for (const r of ROLE_ORDER){
    const list = s.tasks[r] || [];
    if (!list.length) continue;
    const g = el('div','rolegrp');
    g.style.setProperty('--rc','var(--'+ROLES[r].v.slice(2)+')');
    const rh = el('div','rh');
    rh.append(el('b', null, ROLES[r].label));
    if (r === s.owner) rh.append(el('span','ow','주관'));
    const ct = p.contacts?.[r]?.name;
    if (ct) rh.append(el('span','ow', ct));
    g.append(rh);
    list.forEach(txt => {
      const tk = s.n + '|' + r + '|' + txt;
      const on = !!st.tasks?.[tk];
      const lab = el('label','chk' + (on ? ' on' : ''));
      const cb = document.createElement('input'); cb.type = 'checkbox'; cb.checked = on;
      cb.addEventListener('change', () => {
        const np = structuredClone(p);
        np.steps[key].tasks = np.steps[key].tasks || {};
        np.steps[key].tasks[tk] = cb.checked;   // 해제도 false로 남긴다(키 삭제는 병합 저장이 안 됨)
        save(id, np);
      });
      lab.append(cb, el('span', null, txt));
      g.append(lab);
    });
    body.append(g);
  }

  // 산출물·증빙
  const dv = el('div','docs');
  dv.append(el('div','subhead','산출물 · 증빙'));
  s.docs.forEach(d => {
    const on = !!st.docs?.[d];
    const lab = el('label','chk' + (on ? ' on' : ''));
    const cb = document.createElement('input'); cb.type = 'checkbox'; cb.checked = on;
    cb.addEventListener('change', () => {
      const np = structuredClone(p);
      np.steps[key].docs = np.steps[key].docs || {};
      np.steps[key].docs[d] = cb.checked;
      save(id, np);
    });
    lab.append(cb, el('span', null, d));
    dv.append(lab);
  });
  body.append(dv);
  const ov = outputsEl(id, p, key, st);
  if (ov) body.append(ov);

  // 현장진단표 항목 (1·2·3차 방문) — 입력값이 양식 초안의 해당 칸에 그대로 들어간다
  const round = DIAG_ROUND[s.n];
  if (round){
    const items = DIAG[round];
    const filled = items.filter(([k]) => String(st.diag?.[k] || '').trim()).length;
    const gv = el('div','diag');
    gv.append(el('div','subhead','현장진단표 항목 (' + round + '차) ' + filled + '/' + items.length + ' — 입력하면 수행일지·결과보고서 초안에 들어갑니다'));
    items.forEach(([k, guide], i) => {
      const saved = String(st.diag?.[k] || '').trim();
      const ta = document.createElement('textarea');
      ta.id = 'dg-' + id + '-' + key + '-' + i; ta.rows = 2; ta.placeholder = guide;
      ta.dataset.saved = saved;
      ta.value = drafts.has(ta.id) ? drafts.get(ta.id) : saved;
      const lab = el('label', null, k); lab.htmlFor = ta.id;
      // 칸을 떠날 때 저장. 다시 그려도 다음 칸으로 포커스를 넘긴다
      ta.addEventListener('blur', e => {
        if (redrawing) return;
        const v = ta.value.trim();
        if (v === saved) return;
        const nx = e.relatedTarget;
        if (nx && nx.id && nx.closest && nx.closest('.diag')) refocus = { id:nx.id, sel:null };
        const np = structuredClone(state.projects.get(id));
        np.steps[key].diag = np.steps[key].diag || {};
        np.steps[key].diag[k] = v;   // 비워도 ''로 남긴다(키 삭제는 병합 저장이 안 됨)
        drafts.delete(ta.id);
        save(id, np);
      });
      gv.append(lab, ta);
    });
    body.append(gv);
  }

  if (s.n === 4) body.append(planDocsSection(id, p), planCheck(id, p));

  // 양식 (원본 PDF · Word 초안 · Claude 작성 요청)
  const forms = formsOfStep(s.n);
  if (forms.length){
    const fv = el('div','forms');
    fv.append(el('div','subhead','양식'));
    for (const f of forms) fv.append(formRow(id, p, f));
    body.append(fv);
  }

  // 메모 · 이슈
  const nv = el('div','notes');
  nv.append(el('div','subhead','메모 · 이슈'));
  (st.notes || []).slice().reverse().forEach(nt => {
    const n = el('div','note');
    const tm = document.createElement('time');
    tm.dateTime = nt.ts; tm.textContent = fmtTs(nt.ts) + (nt.by ? ' · ' + who(nt.by) : '');   // 한국 시간 · 작성자
    n.append(tm, document.createTextNode(nt.text));
    nv.append(n);
  });
  const add = el('div','noteadd');
  const ta = document.createElement('textarea');
  ta.id = 'nt-'+id+'-'+key; ta.placeholder = '방문 내용, 애로사항, 조치 내역…'; ta.rows = 1;
  ta.value = drafts.get(ta.id) || '';
  const ab = el('button','btn','기록');
  ab.addEventListener('click', () => {
    const txt = ta.value.trim(); if (!txt) return;
    const np = structuredClone(p);
    np.steps[key].notes = np.steps[key].notes || [];
    np.steps[key].notes.push(Object.assign({ ts:new Date().toISOString(), text:txt }, me ? { by:me } : {}));
    ta.value = ''; drafts.delete(ta.id);
    save(id, np);
  });
  add.append(ta, ab);
  nv.append(add);
  body.append(nv);

  // 이 단계 활동 이력
  const acts = activitiesOf(p).filter(a => a.step === s.n);
  if (acts.length){
    const mv = el('div','mails');
    mv.append(el('div','subhead','이 단계 활동 이력 ' + acts.length + '건'));
    acts.forEach(a => mv.append(activityEl(a, false)));
    body.append(mv);
  }

  // 보내기
  const sendRow = el('div','sendrow');
  const sendBtn = el('button','btn','메일 · 카톡 보내기');
  sendBtn.addEventListener('click', () => openSend(id, p, s));
  sendRow.append(sendBtn);
  body.append(sendRow);

  wrap.append(body);
  return wrap;
}

/* ======================= 보내기 (메일 · 카톡) =======================
   메일은 보는 사람의 claude.ai Gmail 커넥터(mcp capability)로 바로 발송한다.
   수신자를 여러 명 고르면 한 통에 모두 받는 사람으로 넣는다. 발송은 두 번
   눌러야 나가고, 성공 응답(메시지 id)을 받은 건만 activities에 auto로 기록한다.
   카톡·메일 앱은 앱이 보낼 수 없어 문구 복사 후 사람이 «보냄 기록»을 누른다.  */

const fmtTs = ts => { const d = new Date(ts); return isNaN(d) ? '' : isoDate(d) + ' ' + d.toTimeString().slice(0,5); };
const EMAIL_RE = /^[^\s@,;]+@[^\s@,;]+\.[^\s@,;]+$/;

/* 첨부: 커넥터 호출 입력은 1MiB 한도라 base64(1.33배)로 싣는 건 700KB까지.
   그보다 크면 뷰어가 지원할 때만 $file 인자로 보낸다(16MiB). */
const INLINE_MAX = 700 * 1024;
const FILE_ARG_MAX = 16 * 1024 * 1024;
const fmtSize = n => n >= 1048576 ? (n / 1048576).toFixed(1) + 'MB' : Math.ceil(n / 1024) + 'KB';
const fileBase64 = f => new Promise((ok, fail) => {
  const r = new FileReader();
  r.onload = () => ok(String(r.result).split(',')[1] || '');
  r.onerror = () => fail({ code:'bad_request', message:'파일을 읽지 못했습니다' });
  r.readAsDataURL(f);
});

/* Gmail 커넥터 오류 코드별 안내. 발송이 됐는지 모르는 경우를 따로 구분한다. */
function mailError(e){
  const code = e && e.code;
  switch (code){
    case 'server_not_connected': return 'Gmail 커넥터가 연결돼 있지 않습니다. claude.ai 설정 → 커넥터에서 Gmail을 추가하세요. 메일은 발송되지 않았습니다.';
    case 'needs_reauth':         return 'Gmail 연결이 만료됐습니다. claude.ai 설정 → 커넥터에서 Gmail을 다시 연결하세요. 메일은 발송되지 않았습니다.';
    case 'selection_required':   return 'Gmail 커넥터가 둘 이상 있어 어느 것을 쓸지 선택이 필요합니다. 화면의 선택 창에서 고른 뒤 다시 누르세요.';
    case 'not_in_manifest':
    case 'not_granted':
    case 'capability_disabled':
    case 'capability_removed':   return '이 화면에서 Gmail 사용이 허용되지 않았습니다. 메일은 발송되지 않았습니다. «본문 복사»로 보내세요.';
    case 'blocked_by_policy':
    case 'approval_required':    return '조직 정책으로 Gmail 발송이 막혀 있습니다. 메일은 발송되지 않았습니다.';
    case 'tool_error':           return 'Gmail이 발송을 거부했습니다: ' + (e.message || '사유 미상');
    case 'bad_request':
    case 'transform_error':      return '발송 요청 형식 오류입니다 (' + code + '). 메일은 발송되지 않았습니다.';
    default:                     return '발송됐는지 확인할 수 없습니다 (' + (code || 'unknown') + '). 중복 발송을 막기 위해 먼저 Gmail «보낸편지함»을 확인한 뒤 다시 보내세요.';
  }
}

const MSG_KINDS = [
  { k:'schedule', label:'일정 조율' },
  { k:'notice',   label:'일정 안내' },
  { k:'request',  label:'자료 요청' },
  { k:'log',      label:'수행일지 송부', visit:true },   // 방문 단계에만. 첨부 필수, 수신자 소공인으로 초기화
  { k:'sign',     label:'서명 요청',     sign:true },    // 서명 산출물이 있는 단계에만
  { k:'done',     label:'완료 공유' },
];
const KIND_LABEL = Object.fromEntries(MSG_KINDS.map(t => [t.k, t.label]));
const signDocs = s => s.docs.filter(d => d.includes('서명'));
const kindAvail = (t, s) => (!t.visit || VISIT_STEPS.includes(s.n)) && (!t.sign || signDocs(s).length > 0);

// 직함이 이미 붙은 이름에 존칭을 겹쳐 붙이지 않는다 ("정상호 대표" → "정상호 대표님")
const TITLES = /(대표|사장|이사|부장|차장|과장|대리|주임|팀장|실장|소장|원장|센터장|본부장|책임|선임|수석|매니저|기사|회계사|세무사|위원|교수|박사|담당)$/;
const TITLE_LIST = TITLES.source.slice(1, -2).split('|');   // 담당자 직함 칸 추천 목록 · 이름 끝 직함 검사
// 소공인 외에는 기관명을 앞에 붙인다("에스엠솔루션 영업 담당님"). 이름에 기관명이 들어 있거나 그 반대면 겹쳐 붙이지 않는다.
const orgPrefix = (org, name) => !org || (name && (org.includes(name.split(' ')[0]) || name.includes(org))) ? '' : org + ' ';
function addressee(role, name, org){
  const base = role === 'sogongin' ? '대표님' : '담당자님';
  const pre = role === 'sogongin' ? '' : orgPrefix(org, name);
  if (!name) return pre ? pre + base : ROLES[role].label + ' ' + base;
  if (name.endsWith('님')) return pre + name;
  if (TITLES.test(name)) return pre + name + '님';
  return pre + name + ' ' + base;
}
/** 수동 추가 수신자 존칭. 이름이 없으면 null(인사말에서 뺀다). */
function extraAddressee(x){
  if (!x.name) return null;
  const pre = orgPrefix(x.org, x.name);
  if (x.name.endsWith('님')) return pre + x.name;
  return pre + x.name + (TITLES.test(x.name) ? '님' : ' 님');
}

/* 줄 배열을 본문으로 만든다. null = 그 줄을 빼고, '' = 빈 줄로 남긴다. */
const lay = lines => lines.filter(x => x !== null).join('\n');

/* roles: 수신 역할 배열. 여럿이면 한 통에 모두 받는 사람으로 들어간다.
   역할별 업무 목록은 수신자가 한 명일 때만 넣는다(여럿이면 누구 몫인지 모호). */
function buildMessage(p, s, roles, kind, extras = []){
  const st = p.steps?.[String(s.n)] || {};
  const co = p.contacts?.coord  || {};
  const one = roles.length === 1 && !extras.length ? roles[0] : null;
  const myTasks = one ? (s.tasks[one] || []) : [];
  const checked = s.docs.filter(d => st.docs?.[d]);
  const missing = s.docs.filter(d => !st.docs?.[d]);
  const visitDay = st.actual || st.planned;
  const vv = VISIT_STEPS.includes(s.n) ? visitOf(p) : null;
  const visitLine = vv ? '· 방문지: ' + fullAddr(vv) : null;   // 방문 단계 + 주소가 입력된 경우만

  const head = [
    (() => {
      const names = [...roles.map(r => addressee(r, p.contacts?.[r]?.name, p.contacts?.[r]?.org)), ...extras.map(extraAddressee).filter(Boolean)];
      return names.length ? names.join(', ') : '담당자님';
    })() + ' 안녕하세요.',
    '소공인 스마트제조지원사업 코디네이터' + (co.name ? ' ' + co.name : '') + '입니다.',
    '',
  ];
  const facts = [
    '· 과제: ' + p.company + ' (' + p.cycle + ')',
    '· 단계: ' + s.n + '. ' + s.name + ' — ' + s.aim,
  ];
  const sign = [
    '',
    (co.name || '코디네이터') + ' 드림' + (co.phone ? ' (' + co.phone + ')' : ''),
  ];
  const tag = '[소공인 스마트제조] ' + p.company + ' ' + s.name + ' ';

  if (kind === 'schedule'){
    return { subject: tag + '일정 조율', body: lay([
      ...head,
      s.name + ' 일정을 조율하고자 연락드립니다.',
      '',
      ...facts,
      st.planned ? '· 제안 일자: ' + st.planned : null,
      visitLine,
      '',
      st.planned ? '위 일자가 어려우시면 가능한 일자를 회신 부탁드립니다.' : '가능하신 일자를 두세 개 회신 부탁드립니다.',
      '감사합니다.',
      ...sign,
    ])};
  }

  if (kind === 'sign'){
    return { subject: tag + '서명 요청', body: lay([
      ...head,
      '아래 서류의 서명을 요청드립니다.',
      '',
      ...facts,
      visitDay ? '· 방문일: ' + visitDay : null,
      '',
      '[서명 필요 서류]',
      ...signDocs(s).map(d => '  - ' + d),
      '',
      '확인 후 서명 부탁드립니다. 감사합니다.',
      ...sign,
    ])};
  }

  if (kind === 'log'){
    return { subject: tag + '수행일지 송부', body: lay([
      ...head,
      s.name + ' 내용을 정리한 수행일지를 첨부해 보내드립니다.',
      '',
      ...facts,
      visitDay ? '· 방문일: ' + visitDay : null,
      '',
      '첨부 파일을 확인해 주시고, 고칠 부분이 있으면 회신 부탁드립니다.',
      '감사합니다.',
      ...sign,
    ])};
  }

  if (kind === 'request'){
    return { subject: tag + '자료 요청', body: lay([
      ...head,
      '아래 건으로 자료 제출을 요청드립니다.',
      '',
      ...facts,
      st.planned ? '· 회신 기한: ' + st.planned : null,
      '',
      '[요청 자료]',
      ...s.docs.map(d => '  - ' + d),
      myTasks.length ? '' : null,
      myTasks.length ? '[' + ROLES[one].label + ' 요청 업무]' : null,
      ...myTasks.map(t => '  - ' + t),
      '',
      '확인 후 회신 부탁드립니다. 감사합니다.',
      ...sign,
    ])};
  }

  if (kind === 'done'){
    return { subject: tag + '완료 안내', body: lay([
      ...head,
      '아래 단계가 마무리되어 공유드립니다.',
      '',
      ...facts,
      st.actual ? '· 완료일: ' + st.actual : null,
      '',
      '[작성·확인된 서류]',
      ...(checked.length ? checked.map(d => '  - ' + d) : ['  - (아직 확인된 서류가 없습니다)']),
      missing.length ? '' : null,
      missing.length ? '[미확인 서류]' : null,
      ...missing.map(d => '  - ' + d),
      '',
      '내용 확인 부탁드립니다. 감사합니다.',
      ...sign,
    ])};
  }

  return { subject: tag + '안내' + (st.planned ? ' (' + st.planned + ')' : ''), body: lay([
    ...head,
    '아래와 같이 진행하고자 합니다.',
    '',
    ...facts,
    '· 예정일: ' + (st.planned || '(조율 필요)'),
    visitLine,
    '· 주관: ' + ROLES[s.owner].label,
    myTasks.length ? '' : null,
    myTasks.length ? '[' + ROLES[one].label + ' 확인·준비 사항]' : null,
    ...myTasks.map(t => '  - ' + t),
    '',
    '[작성 서류]',
    ...s.docs.map(d => '  - ' + d),
    '',
    '일정 확인 부탁드립니다. 감사합니다.',
    ...sign,
  ])};
}

/** 카톡용: 내용은 그대로 두고 빈 줄만 줄여 한 덩어리로 만든다 */
function kakaoText(bodyText){
  return bodyText.replace(/\n{2,}/g, '\n').trim();
}

async function copyText(btn, text, okLabel = '복사됨'){
  const prev = btn.textContent;
  const done = () => { btn.textContent = okLabel; setTimeout(() => { if (btn.isConnected) btn.textContent = prev; }, 1600); };
  try { await navigator.clipboard.writeText(text); done(); return; }
  catch (e) { /* 아래 폴백 */ }
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.cssText = 'position:fixed;top:0;left:0;width:1px;height:1px;opacity:0';
  document.body.append(ta); ta.select();
  try { document.execCommand('copy'); done(); }
  catch (e2) { btn.textContent = '복사 불가'; setTimeout(() => { if (btn.isConnected) btn.textContent = prev; }, 1600); }
  ta.remove();
}

/* ======================= 활동 이력 =======================
   과제 문서의 activities 배열. gmail은 발송 응답(id)을 받은 건만 auto로,
   kakao·mailapp은 사람이 «보냄 기록»을 누른 건을 manual로 남긴다.
   구형 steps[n].mails(Gmail 발송 기록)는 옮기지 않고 읽을 때만 합친다.     */
const CHANNELS = { gmail:'Gmail', kakao:'카톡', mailapp:'메일앱', calendar:'캘린더' };

function activitiesOf(p){
  const out = (p.activities || []).slice();
  for (const [k, st] of Object.entries(p.steps || {})){
    for (const ml of st.mails || []) out.push({
      ts:ml.ts, step:Number(k), channel:'gmail', record:'auto', kind:ml.kind,
      to:[{ role:ml.role, name:ml.name || '', addr:ml.to }],
      subject:ml.subject, body:ml.body, attachment:ml.attachment || '',
      messageId:ml.messageId || '', threadId:ml.threadId || '',
    });
  }
  return out.sort((a,b) => String(b.ts).localeCompare(String(a.ts)));   // 최신순
}

const recipText = to => (to || []).map(t => [
  t.role ? (ROLES[t.role]?.label || '') : '추가',
  t.org && orgPrefix(t.org, t.name) ? t.org : '',
  t.name || (t.org ? '' : t.addr || ''),
].filter(Boolean).join(' ')).join(', ');
const chLabel = a => (CHANNELS[a.channel] || a.channel) + ' · ' + (a.record === 'auto' ? '자동' : '수동');

/** 최신 문서에 활동 1건을 덧붙여 저장한다. 저장할 수 없는 화면이면 false. */
function addActivity(id, act){
  if (!db || !writable || !state.projects.has(id)) return false;
  const np = structuredClone(state.projects.get(id));
  np.activities = np.activities || [];
  np.activities.push(Object.assign({ ts:new Date().toISOString() }, me ? { by:me } : {}, act));
  save(id, np);
  return true;
}

function activityEl(a, showStep, projLabel){
  const d = el('details','mail');
  const r0 = a.to?.[0]?.role;
  d.style.setProperty('--rc', ROLES[r0] ? rv(r0) : 'var(--ink-3)');
  const sm = document.createElement('summary');
  const meta = el('div','ameta');
  const tm = document.createElement('time');
  tm.dateTime = a.ts; tm.textContent = fmtTs(a.ts);
  meta.append(tm);
  if (projLabel) meta.append(el('span','proj', projLabel));
  if (showStep && a.step) meta.append(el('span','badge sample', a.step + '단계'));
  if (a.by) meta.append(el('span','proj', '기록 ' + who(a.by)));
  meta.append(el('span','badge ch-' + (a.record === 'auto' ? 'auto' : 'manual'), chLabel(a)));
  if (KIND_LABEL[a.kind]) meta.append(el('span','kindlbl', KIND_LABEL[a.kind]));
  const rl = replyLabel(a);
  if (rl) meta.append(el('span','badge ' + rl.cls, rl.text));
  if (a.channel === 'calendar'){
    // 캘린더 등록: 수신자 대신 예정일과 캘린더 링크
    const line = el('span','to', '예정일 ' + (a.date || '—') + ' ');
    if (a.htmlLink){ const l = document.createElement('a'); l.href = a.htmlLink; l.target = '_blank'; l.rel = 'noopener noreferrer'; l.textContent = '캘린더에서 보기 ↗'; line.append(l); }
    sm.append(meta, el('b', null, a.subject || '(제목 없음)'), line);
  } else
  sm.append(meta, el('b', null, a.subject || '(제목 없음)'), el('span','to', '→ ' + (recipText(a.to) || '(수신자 미상)')));
  if (a.attachment) sm.append(el('span','to', '첨부 · ' + a.attachment));
  d.append(sm, el('pre', null, a.body || (a.bodyTrimmed ? '(본문 정리됨 — 전체 백업 파일에 남아 있습니다)' : '')));
  return d;
}

function openSend(id, p, s){
  // 기본 수신자: 주관 역할. 코디네이터 주관 단계는 코디 자신이 아니라 소공인.
  let roles = new Set([s.owner === 'coord' ? 'sogongin' : s.owner]);
  let kind = 'notice';
  const recorded = new Set();   // 같은 문구를 같은 채널로 두 번 기록하지 않게
  const rolesArr = () => ROLE_ORDER.filter(r => roles.has(r));

  // 수동 추가 수신자: 이 창에서만 쓰고 과제·주소록에는 저장하지 않는다
  let extras = [];   // [{ key, name, org, email, kakao, contactId }]
  /** 발송·기록용 수신자 전체: 역할 수신자 + 추가 수신자 */
  const recipients = () => [
    ...rolesArr().map(r => { const c = contact(r); return { role:r, name:c.name || '', org:c.org || '', email:(c.email || '').trim(), kakao:c.kakao || '', phone:c.phone || '', contactId:c.contactId || '' }; }),
    ...extras.map(x => ({ role:'', name:x.name || '', org:x.org || '', email:(x.email || '').trim(), kakao:x.kakao || '', phone:x.phone || '', contactId:x.contactId || '' })),
  ];
  const toEntry = (x, addr) => ({ role:x.role, name:x.name, org:x.org, addr, contactId:x.contactId });

  const scrim = el('div','scrim');
  const m = el('div','modal wide');
  m.setAttribute('role','dialog');
  m.setAttribute('aria-label', p.company + ' ' + s.name + ' 보내기');
  const close = () => { scrim.remove(); m.remove(); };
  scrim.addEventListener('click', close);

  m.append(el('h2', null, '보내기 — ' + p.company));
  m.append(el('p','hint', s.n + '. ' + s.name + ' · ' + p.cycle));

  /* 수신자 (여러 명 선택 → 한 통) */
  const rl = el('div','sf');
  rl.append(el('label', null, '수신자 — 여러 명 고르면 한 통에 모두 받는 사람으로 들어갑니다'));
  const roleChips = el('div','chips');
  rl.append(roleChips);
  // + 수신자 추가: 주소록 담당자 선택 또는 직접 입력
  const xadd = el('div','xadd');
  const xsel = document.createElement('select');
  xsel.id = 'send-xsel'; xsel.setAttribute('aria-label','담당자 목록에서 수신자 추가');
  xsel.append(new Option('+ 담당자 목록에서 추가…', ''));
  for (const r of ROLE_ORDER){
    const group = peopleOfType(r);
    if (!group.length) continue;
    const og = document.createElement('optgroup'); og.label = ROLES[r].label;
    for (const x of group) og.append(new Option(optLabel(x) + (x.c.email ? '' : ' (이메일 없음)'), x.id));
    xsel.append(og);
  }
  xsel.addEventListener('change', () => {
    const cid = xsel.value; xsel.value = '';
    if (!cid || extras.some(x => x.key === 'c:' + cid)) return;
    const snap = snapshotOf(cid);
    if (!snap) return;
    extras.push({ key:'c:' + cid, name:snap.name, org:snap.org, email:snap.email, kakao:snap.kakao, phone:(state.people.get(cid) || {}).phone || '', contactId:cid });
    refresh();
  });
  const xname = document.createElement('input'); xname.id = 'send-xname'; xname.placeholder = '이름 (선택)';
  const xaddr = document.createElement('input'); xaddr.id = 'send-xaddr'; xaddr.placeholder = '이메일 또는 카톡 ID';
  const xbtn = el('button','btn','추가');
  xbtn.addEventListener('click', () => {
    const addr = xaddr.value.trim();
    if (!addr) return setStat('bad', '추가할 이메일 또는 카톡 ID를 입력하세요.');
    const isMail = EMAIL_RE.test(addr);
    const key = 'm:' + addr.toLowerCase();
    if (extras.some(x => x.key === key)) return setStat('bad', '이미 추가된 수신자입니다.');
    extras.push({ key, name:xname.value.trim(), org:'', email:isMail ? addr : '', kakao:isMail ? '' : addr, contactId:'' });

  kl.append(kindChips);
  m.append(kl);

  /* 수신 정보 */
  const info = el('div','sf');
  info.append(el('label', null, '수신 정보'));
  const infoBox = el('div', null);
  info.append(infoBox);
  m.append(info);

  /* 제목 · 본문 */
  const sf1 = el('div','sf');
  const subLabel = el('label', null, '제목 (메일)'); subLabel.htmlFor = 'send-subject';

  const bodyLabel = el('label', null, '본문 — 보내기 전에 여기서 고치세요'); bodyLabel.htmlFor = 'send-body';
  const bodyTa = document.createElement('textarea'); bodyTa.id = 'send-body';
  sf2.append(bodyLabel, bodyTa); m.append(sf2);

  /* 첨부 (Gmail 발송 전용): 내 컴퓨터 · 보드 파일 · 구글 드라이브 */
  let atts = [];

  sf3.append(el('label', null, '첨부 — «Gmail로 보내기»에만 붙습니다'));
  const attChips = el('div','chips');
  const attBar = el('div','lact');
  const fileIn = document.createElement('input'); fileIn.type = 'file'; fileIn.id = 'send-file'; fileIn.multiple = true; fileIn.style.display = 'none';
  const pcBtn = el('label','btn','내 컴퓨터'); pcBtn.htmlFor = fileIn.id;
  const boardBtn = el('button','btn','보드 파일');
  const driveBtn = el('button','btn','구글 드라이브');
  driveBtn.hidden = !driveReady();
  attBar.append(pcBtn, boardBtn, driveBtn);
  const picker = el('div','picker'); picker.hidden = true;
  sf3.append(attChips, attBar, fileIn, picker);

  const addAtt = a => { if (!atts.some(x => x.key === a.key)){ atts.push(a); paintAtts(); if (!sending){ disarm(); setStat('', ''); } } };
  function paintAtts(){
    attChips.replaceChildren();
    for (const a of atts){
      const b = el('button','chip xchip on', (a.link ? '링크 · ' : '') + a.name + (a.size ? ' · ' + fmtSize(a.size) : '') + ' ✕');

      b.addEventListener('click', () => { atts = atts.filter(x => x.key !== a.key); paintAtts(); if (!sending) disarm(); });
      attChips.append(b);
    }
    attChips.hidden = !atts.length;
    for (const x of picker.querySelectorAll('button[data-key]')) x.disabled = atts.some(a => a.key === x.dataset.key);
  }
  fileIn.addEventListener('change', () => {
    for (const f of fileIn.files || []) addAtt({ key:'pc:' + f.name + ':' + f.size, name:f.name, size:f.size, mime:f.type, src:'pc', blob:f });

  boardBtn.addEventListener('click', () => {
    if (!picker.hidden && picker.dataset.kind === 'board'){ picker.hidden = true; return; }

    for (const [title, items] of boardFileGroups(id)){
      picker.append(el('div','subhead', title));
      if (!items.length) picker.append(el('div','rnote', '없음 — 과제 상세 «자료함»에서 올릴 수 있습니다.'));
      for (const it of items){
        const r = el('div','prow');
        const add = el('button','btn ghost','추가'); add.dataset.key = it.key;

    paintAtts();

  paintAtts();
  // 큰 파일은 파일 인자($file)로 보낸다. 지원 여부는 listTools로만 알 수 있다(동의 창을 띄우지 않음).
  let fileArgs = false;
  if (mcp) mcp.listTools().then(r => { fileArgs = !!(r && r.fileArgs); }).catch(() => {});

  /* 액션: 1줄 = Gmail 발송, 2줄 = 직접 보낸 뒤 기록 */
  const bar = el('div','sendbar');
  const gmailBtn = el('button','btn primary','Gmail로 보내기');
  gmailBtn.hidden = !mcp;
  const copyBody = el('button','btn','본문 복사');
  const closeBtn = el('button','btn ghost','닫기');
  closeBtn.addEventListener('click', close);
  bar.append(gmailBtn, copyBody, el('span','grow'), closeBtn);
  m.append(bar);

  const bar2 = el('div','sendbar');
  const mailA = document.createElement('a');
  mailA.className = 'btn'; mailA.textContent = '메일 앱 열기';
  mailA.target = '_blank'; mailA.rel = 'noopener noreferrer';
  const mailRec = el('button','btn ghost','메일 앱으로 보냄 기록');
  const copyKakao = el('button','btn','카톡용 문구 복사');
  const kakaoRec = el('button','btn ghost','카톡 보냄 기록');
  bar2.append(mailA, mailRec, copyKakao, kakaoRec);
  m.append(bar2);

  const stat = el('div','sendstat'); stat.hidden = true;
  m.append(stat);
  const setStat = (cls, text) => { stat.className = 'sendstat' + (cls ? ' ' + cls : ''); stat.textContent = text; stat.hidden = !text; };

  const caveat = el('div','caveat');
  caveat.textContent = (mcp
    ? '«Gmail로 보내기»는 claude.ai에 연결된 Gmail 계정으로 즉시 발송하며, 보낸편지함과 «활동 이력»에 자동으로 남습니다. 한 번 누르면 확인 문구로 바뀌고, 한 번 더 눌러야 발송됩니다. '
    : 'Gmail 커넥터를 쓸 수 없는 화면이라 메일을 직접 보내지 않습니다. ')
    + '카카오톡과 메일 앱은 앱이 대신 보내지 못하고 보냈는지도 알 수 없습니다. 직접 보낸 뒤 «보냄 기록»을 누르면 «활동 이력»에 수동 기록으로 남습니다(앱이 확인한 발송이 아닙니다).';
  m.append(caveat);

  let sending = false;
  const disarm = () => { delete gmailBtn.dataset.armed; gmailBtn.textContent = 'Gmail로 보내기'; };
  const current = () => ({ subject: subject.value.trim(), body: bodyTa.value });

  gmailBtn.addEventListener('click', async () => {
    if (sending) return;
    const rs = recipients();
    if (!rs.length){ setStat('bad', '수신자를 한 명 이상 고르세요.'); return; }
    const to = rs.map(x => toEntry(x, x.email));
    const bad = rs.filter(x => !EMAIL_RE.test(x.email)).map(x => toEntry(x, x.email || x.kakao || x.phone));
    if (bad.length){ setStat('bad', '이메일이 비었거나 형식이 맞지 않는 수신자: ' + recipText(bad) + ' — 담당자 정보에서 고치거나 수신자에서 빼세요.'); return; }
    if (!subject.value.trim() || !bodyTa.value.trim()){ setStat('bad', '제목과 본문을 입력하세요.'); return; }
    if (!db || !writable){ setStat('bad', '이 화면은 저장 권한이 없어 활동 이력을 남길 수 없습니다. 게시된 링크에서 편집 권한으로 여세요.'); return; }
    if (kind === 'log' && !atts.length){ setStat('bad', '«수행일지 송부»는 수행일지 파일(또는 드라이브 링크)을 첨부해야 보낼 수 있습니다. 아래 «첨부»에서 고르세요.'); return; }
    const nFiles = atts.filter(a => !a.link).length, nLinks = atts.filter(a => a.link).length;

    if (!gmailBtn.dataset.armed){
      gmailBtn.dataset.armed = '1';
      gmailBtn.textContent = (to.length === 1 ? to[0].addr + ' 에게' : to.length + '명에게') + ' 발송 확인' + (atts.length ? ' (첨부 ' + nFiles + (nLinks ? ' · 링크 ' + nLinks : '') + ')' : '');
      setTimeout(() => { if (gmailBtn.isConnected && !sending) disarm(); }, 5000);
      return;
    }

    sending = true; disarm();
    gmailBtn.disabled = true; gmailBtn.textContent = '발송 중…';
    setStat('', '');
    const sent = current();
    try {
      const packed = await packAttachments(atts, fileArgs);   // 한도 초과면 여기서 멈추고 발송하지 않는다
      sent.body += packed.linkBlock;
      const input = { to:to.map(t => t.addr), subject:sent.subject, body:sent.body };
      if (packed.attachments.length) input.attachments = packed.attachments;
      const res = await mcp.callTool(GMAIL, 'send_message', input);
      const msg = res && res.payload && typeof res.payload === 'object' ? res.payload : {};
      if (!msg.id) throw { code:'upstream_error', message:'응답에 메시지 id가 없습니다' };
      addActivity(id, {
        step:s.n, channel:'gmail', record:'auto', kind, to,
        subject:sent.subject, body:sent.body, attachment: attachSummary(atts),
        messageId:msg.id, threadId:msg.threadId || '',
      });
      setStat('ok', recipText(to) + '에게 발송했습니다. Gmail «보낸편지함»과 «활동 이력»에서 확인할 수 있습니다.');
    } catch (e){
      setStat('bad', e && e.code === 'att_limit' ? attLimitText(e) : e && e.code === 'att_load' ? e.message + ' — 메일은 발송되지 않았습니다.' : mailError(e));
    } finally {
      sending = false; gmailBtn.disabled = false;
    }
  });

  /* 직접 보낸 건의 수동 기록 */
  function manualRecord(btn, channel, addrOf){
    btn.addEventListener('click', () => {
      if (recorded.has(channel)) return;
      const rs = recipients();
      if (!rs.length){ setStat('bad', '수신자를 한 명 이상 고르세요.'); return; }
      const sent = current();
      const ok = addActivity(id, {
        step:s.n, channel, record:'manual', kind,
        to: rs.map(x => toEntry(x, addrOf(x))),
        subject:sent.subject, body: channel === 'kakao' ? kakaoText(sent.body) : sent.body, attachment:'',
      });
      if (!ok){ setStat('bad', '이 화면은 저장 권한이 없어 활동 이력을 남길 수 없습니다.'); return; }
      recorded.add(channel);
      btn.textContent = '기록됨'; btn.disabled = true;
      setStat('ok', CHANNELS[channel] + '으로 보냄을 «활동 이력»에 기록했습니다(수동 기록).');
    });
  }
  manualRecord(kakaoRec, 'kakao',   c => c.kakao || c.phone || '');
  manualRecord(mailRec,  'mailapp', c => c.email || '');
  const resetRecs = () => {
    recorded.clear();
    kakaoRec.disabled = false; kakaoRec.textContent = '카톡 보냄 기록';
    mailRec.disabled  = false; mailRec.textContent  = '메일 앱으로 보냄 기록';
  };

  function refresh(){
    /* 수신자 칩 (토글) */
    roleChips.replaceChildren();
    for (const r of ROLE_ORDER){
      const c = contact(r);
      const has = !!(c.email || c.kakao || c.name);
      const who = [orgPrefix(c.org, c.name).trim(), c.name].filter(Boolean).join(' ');
      const b = el('button','chip' + (roles.has(r) ? ' on' : ''), ROLES[r].label + (who ? ' · ' + who : ''));
      b.style.setProperty('--rc', rv(r));
      b.setAttribute('aria-pressed', String(roles.has(r)));
      if (!has) { b.disabled = true; b.title = '연락처가 비어 있습니다. 과제 상세의 «역할별 담당자»에서 입력하세요.'; }
      b.addEventListener('click', () => { if (roles.has(r)) roles.delete(r); else roles.add(r); refresh(); });
      roleChips.append(b);
    }
    /* 템플릿 칩 */
    kindChips.replaceChildren();
    for (const t of MSG_KINDS){
      if (!kindAvail(t, s)) continue;
      const b = el('button','chip' + (t.k === kind ? ' on' : ''), t.label);
      b.style.setProperty('--rc', rv(s.owner));
      b.addEventListener('click', () => { kind = t.k; if (t.k === 'log') roles = new Set(['sogongin']); refresh(); });
      kindChips.append(b);
    }
    /* 추가 수신자 칩 (✕로 빼기) */
    extraChips.replaceChildren();
    extraChips.hidden = !extras.length;
    for (const x of extras){
      const b = el('button','chip xchip on', (x.name || x.org || '추가') + ' · ' + (x.email || x.kakao || '주소 없음') + ' ✕');
      b.title = '수신자에서 빼기';
      b.addEventListener('click', () => { extras = extras.filter(y => y.key !== x.key); refresh(); });
      extraChips.append(b);
    }
    /* 수신 정보: 선택한 사람마다 한 줄 */
    infoBox.replaceChildren();
    const rs = rolesArr();
    const all = recipients();
    if (!all.length) infoBox.append(el('div','kv', '수신자를 고르세요.'));
    for (const c of all){
      const row = el('div','kv');
      row.append(el('i', null, c.role ? ROLES[c.role].label : '추가'));
      row.append(el('span','val' + (c.email ? '' : ' none'), c.email || '이메일 미입력'));
      if (c.email){ const cp = el('button', null, '메일 복사'); cp.addEventListener('click', () => copyText(cp, c.email)); row.append(cp); }
      const kk = c.kakao || c.phone;
      if (kk){ const cp = el('button', null, '카톡 ' + (c.kakao ? 'ID' : '번호') + ' 복사'); cp.addEventListener('click', () => copyText(cp, kk)); row.append(cp); }
      infoBox.append(row);
    }
    /* 문구 */
    const msg = buildMessage(p, s, rs, kind, extras);
    subject.value = msg.subject;
    bodyTa.value = msg.body;
    if (!sending){ disarm(); setStat('', ''); }
    resetRecs();
    syncMail();
  }

  function syncMail(){
    const emails = recipients().map(x => x.email).filter(Boolean);
    if (!emails.length){
      mailA.classList.add('off');
      mailA.removeAttribute('href');
      mailA.title = '선택한 수신자의 이메일이 비어 있습니다.';
    } else {
      mailA.classList.remove('off');
      mailA.href = 'mailto:' + emails.map(encodeURIComponent).join(',')
        + '?subject=' + encodeURIComponent(subject.value)
        + '&body=' + encodeURIComponent(bodyTa.value);
      mailA.title = emails.join(', ') + ' 로 보낼 메일 앱을 엽니다';
    }
  }
  subject.addEventListener('input', syncMail);
  bodyTa.addEventListener('input', syncMail);
  copyBody.addEventListener('click', () => copyText(copyBody, bodyTa.value));
  copyKakao.addEventListener('click', () => copyText(copyKakao, kakaoText(bodyTa.value)));

  refresh();
  document.body.append(scrim, m);
  subject.focus();
}

function openNew(){
  const scrim = el('div','scrim');
  const m = el('div','modal');
  m.setAttribute('role','dialog'); m.setAttribute('aria-label','새 과제 등록');
  m.append(el('h2', null, '새 과제 등록'));
  m.append(el('p','hint','과제 단위는 업체 × 연도·차수입니다. 담당자는 «담당자» 목록에 등록된 사람 중에서 고르고, 나중에 상세 화면에서 바꿔도 됩니다.'));

  const g = el('div','mgrid');
  const field = (k, label, node) => { const f = el('div','mf'); const l = el('label', null, label); l.htmlFor = 'nf-' + k; node.id = 'nf-' + k; f.append(l, node); g.append(f); return node; };

  // 업체명: 소공인 기관만 고른다(자유 입력 없음 — 다른 유형 기관이나 오타가 소공인으로 생기지 않게).
  // 목록에 없으면 «+ 새 소공인 기관 등록…»으로 기관 창을 열고, 저장하면 그 기관이 선택된다.
  const company = field('company', '업체명 (소공인 기관)', document.createElement('select'));
  const fillCompany = sel => {
    company.replaceChildren(new Option('소공인 기관 선택…', ''));
    for (const [aid, a] of [...state.accounts.entries()].filter(([, a]) => a.type === 'sogongin').sort((x, y) => x[1].name.localeCompare(y[1].name, 'ko')))
      company.append(new Option(a.name, aid));
    company.append(new Option('+ 새 소공인 기관 등록…', '__new'));
    company.value = sel || '';
  };
  fillCompany('');
  // 연도·차수: 목록에서 고르거나 직접 입력. 목록 = 이미 쓰는 차수 + 사업 규칙 연도·올해의 «연도-1»·«연도-2»(최신 먼저)
  const cdl = document.createElement('datalist'); cdl.id = 'nf-cycle-list';
  const years = new Set([String(new Date().getFullYear()), ...state.programs.keys()]);
  const cycles = new Set([...state.projects.values()].map(p => p.cycle).filter(Boolean));
  for (const y of years) for (const n of [1, 2]) cycles.add(y + '-' + n);
  for (const c of [...cycles].sort((a, b) => b.localeCompare(a, 'ko', { numeric:true }))) cdl.append(new Option(c, c));
  const cycle = field('cycle', '연도·차수 (목록에서 선택 또는 입력)', document.createElement('input'));
  cycle.setAttribute('list', cdl.id); cycle.placeholder = '예: 2026-1'; cycle.autocomplete = 'off';
  m.append(cdl);
  const notice = field('notice', '공고 구분', noticeSelect('', ''));

  const sels = {};
  for (const r of ROLE_ORDER){
    const sel = document.createElement('select');
    sel.append(new Option('나중에 지정', ''));
    for (const x of peopleOfType(r)) sel.append(new Option(optLabel(x), x.id));
    sels[r] = field('r-' + r, ROLES[r].label + ' 담당자', sel);
  }
  m.append(g);

  // 기관을 고르면 그 기관 담당자가 한 명일 때 소공인 담당자 칸 기본값으로
  const pickPerson = () => {
    if (!company.value || company.value === '__new' || sels.sogongin.value) return;
    const people = peopleOfType('sogongin').filter(x => x.c.accountId === company.value);
    if (people.length === 1) sels.sogongin.value = people[0].id;
  };
  company.addEventListener('change', () => {
    if (company.value !== '__new') return pickPerson();
    company.value = '';
    openAccountForm(null, { type:'sogongin' }, aid => {
      if (state.accounts.get(aid)?.type !== 'sogongin'){ err.hidden = false; err.textContent = '소공인이 아닌 기관은 업체로 고를 수 없습니다.'; return; }
      err.hidden = true;
      fillCompany(aid);
    });
  });

  const note = el('p','hint');
  note.style.margin = '10px 0 0';
  const bookA = el('button','btn ghost','담당자 목록 열기');
  bookA.addEventListener('click', () => { close(); state.tab = 'con'; render(); });
  note.append(document.createTextNode('목록에 없는 사람은 먼저 «담당자» 탭에서 등록하세요. '), bookA);
  m.append(note);

  const err = el('div','err'); err.hidden = true; m.append(err);
  const act = el('div','mact');
  const cancel = el('button','btn','취소');
  const ok = el('button','btn primary','등록');
  act.append(cancel, ok); m.append(act);

  const close = () => { scrim.remove(); m.remove(); };
  cancel.addEventListener('click', close);
  scrim.addEventListener('click', close);
  ok.addEventListener('click', () => {
    const cyc = cycle.value.trim();
    const sgCid = sels.sogongin.value;
    let aid = company.value && company.value !== '__new' ? company.value : '';
    if (!aid && sgCid) aid = snapshotOf(sgCid)?.accountId || '';   // 업체를 안 골랐으면 소공인 담당자의 소속 기관
    const name = state.accounts.get(aid)?.name || '';
    if (!aid || !name || !cyc){ err.hidden = false; err.textContent = '업체(소공인 기관)와 연도·차수는 반드시 골라 주세요.'; return; }

    const contacts = {};
    for (const r of ROLE_ORDER) contacts[r] = sels[r].value ? snapshotOf(sels[r].value) : EMPTY_CONTACT();
    if (!sgCid){
      // 소공인 담당자 미지정: 고른 기관만 연결 — 업체명이 기관명과 함께 관리된다
      contacts.sogongin = Object.assign(EMPTY_CONTACT(), { accountId:aid, org:name });
    } else if (contacts.sogongin.accountId !== aid){
      err.hidden = false; err.textContent = '업체(' + name + ')와 소공인 담당자의 소속(' + (contacts.sogongin.org || '기관 없음') + ')이 다릅니다. 둘 중 하나를 맞춰 주세요.';
      return;
    }
    const id = newId('p');
    close();
    state.openId = id; state.openSteps = new Set(['1']);
    const np = newProject({ company:name, cycle:cyc }, contacts);
    if (notice.value) np.notice = notice.value;
    save(id, np);
  });

  document.body.append(scrim, m);
  company.focus();
}

    downloads = await c.use('downloads');

    c.use('mcp').then(x => { mcp = x; if (state.tab === 'sched' || state.tab === 'today') paint(); checkReplies(); });   // 없으면 null → Gmail·캘린더 기능 숨김. db 로드를 기다리게 하지 않는다
    c.use('assets').then(x => { assets = x; if (state.openId) render(); });   // 쓰기 권한자만 non-null → 자료함 올리기·삭제
    c.use('user').then(async u => {   // 작성자 id(by) · 소유자면 «관리» 탭
      user = u;
      if (u){ try { me = await u.id(); } catch (e) {} try { isOwner = !!(await u.isOwner()); } catch (e) {} }
      document.getElementById('tabAdmin').hidden = !isOwner;
      if (!isOwner && state.tab === 'admin') state.tab = 'board';
      render();
    });
    document.getElementById('assistBtn').hidden = false;   // claude.ai 안이면 항상 보인다 — 못 쓰는 화면이면 도우미 창이 이유를 알린다
    c.use('sample').then(x => { sampleFn = x; sampleState = x ? 'ready' : 'none'; assistCaps(); if (x && (state.tab === 'acc' || state.tab === 'con')) paint(); });   // «명함으로 등록» 버튼   // 사업계획서 점검(Claude). null이면 문서 항목은 사람이 판정
  }

  db = c && c.use ? await c.use('db') : null;
  if (!db){
    setNotice('공유 저장소에 연결되지 않아 이 화면의 변경 내용은 저장되지 않습니다. 게시된 링크로 열면 저장됩니다.');
    return;
  }
  db.collection('projects').onSnapshot(
    snap => {
      state.projects = new Map(snap.docs.map(d => [d.id, d.data()]));
      render();
    },
    e => setNotice('데이터를 불러오지 못했습니다 (' + e.code + ').')
  );
  // 주소록 마스터
  for (const [col, key] of [['accounts','accounts'], ['contacts','people'], ['products','products'], ['assets','assets'], ['programs','programs'], ['checklists','checklists']]){
    db.collection(col).onSnapshot(
      snap => { state[key] = new Map(snap.docs.map(d => [d.id, d.data()])); render(); },
      e => setNotice('기관·담당자 목록을 불러오지 못했습니다 (' + e.code + ').')
    );
  }
})();
</script>

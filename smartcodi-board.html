/** 장비 등록·수정. done(productId) */
function openProductForm(prid, preset, done){
  const pr = prid ? state.products.get(prid) : null;
  const src = pr || preset || {};
  const sups = [...state.accounts.entries()].filter(([, a]) => a.type === 'supplier').sort((x, y) => x[1].name.localeCompare(y[1].name, 'ko'));
  formModal({
    title: pr ? '장비 수정' : '장비 추가',
    hint: '장비(Product) = 공급기업이 제안·공급하는 모델 1종. 과제에 실제로 들여온 건은 «자산»으로 등록합니다. 단가는 견적서에 적힌 값만 넣으세요.',
    fields: [
      { k:'kind', label:'구분', type:'select', options:Object.entries(PRODUCT_KIND), value:src.kind || 'hw' },
      { k:'supplierId', label:'공급기업', type:'select', options:[['', '(미지정)'], ...sups.map(([id, a]) => [id, a.name])], value:src.supplierId || '' },
      { k:'name', label:'장비명', value:src.name || '', ph:'예: 자동 계량기' },
      { k:'model', label:'모델명', value:src.model || '' },
      { k:'unitPrice', label:'견적 단가 (원, 부가세 별도 여부는 메모)', value:src.unitPrice === '' || src.unitPrice == null ? '' : String(src.unitPrice), ph:'숫자만' },
      { k:'unit', label:'단위', type:'select', options:PRODUCT_UNITS.map(u => [u, u]), value:src.unit || '대' },
      { k:'spec', label:'주요 사양', type:'textarea', value:src.spec || '', full:true },
      { k:'memo', label:'메모', type:'textarea', value:src.memo || '', full:true },
    ],
    onSave: v => {
      if (!v.name) return '장비명을 입력하세요.';
      const raw = v.unitPrice.replace(/[\s원]/g, ''), price = raw.replace(/,/g, '');
      if (price && !/^\d+$/.test(price)) return '단가는 숫자만 입력하세요.';
      if (raw.includes(',') && !/^\d{1,3}(,\d{3})+$/.test(raw)) return '단가의 쉼표 자리가 맞지 않습니다(' + raw + '). 세 자리마다 쉼표를 넣거나 숫자만 입력하세요.';
      const id = prid || newId('pr');
      saveProduct(id, Object.assign({}, pr || {}, v, { unitPrice: price ? Number(price) : '' }));
      if (done) done(id);
    },
    onDelete: pr ? () => {
      const used = assetsWhere(a => a.productId === prid);
      if (used.length) return '자산 ' + used.length + '건에 쓰이고 있어 삭제할 수 없습니다. 자산을 먼저 삭제하세요.';
      deleteMaster('products', state.products, prid);
    } : null,
  });
}

/** 자산(도입 장비) 등록·수정. preset: {projectId, productId} */
function openAssetForm(aid, preset){
  const as = aid ? state.assets.get(aid) : null;
  const src = as || preset || {};
  if (!state.products.size){ openProductForm(null, null, prid => openAssetForm(null, Object.assign({}, preset, { productId:prid }))); return; }
  const prods = [...state.products.entries()].sort((x, y) => (x[1].kind || '').localeCompare(y[1].kind || '') || productLabel(x[1]).localeCompare(productLabel(y[1]), 'ko'));
  const projs = [...state.projects.entries()].sort((x, y) => projLabel(x[1]).localeCompare(projLabel(y[1]), 'ko'));
  if (!projs.length) return setNotice('과제가 없어 자산을 등록할 수 없습니다. 먼저 과제를 만드세요.');
  formModal({
    title: as ? '자산 수정' : '자산 등록 (도입 장비)',
    hint: '자산(Asset) = 한 과제에 들여온 장비. 상태는 검토 중 → 발주 → 설치 완료 → 가동 중을 섞지 않고 확인된 만큼만 고릅니다.',
    fields: [
      { k:'projectId', label:'과제', type:'select', options:projs.map(([id, p]) => [id, projLabel(p)]), value:src.projectId || projs[0][0], full:true },
      { k:'productId', label:'장비', type:'select', options:prods.map(([id, pr]) => [id, '[' + (PRODUCT_KIND[pr.kind] || '') + '] ' + productLabel(pr) + (supplierOf(pr) ? ' — ' + supplierOf(pr).name : '')]), value:src.productId || prods[0][0], full:true },
      { k:'qty', label:'수량', value:src.qty == null ? '1' : String(src.qty) },
      { k:'serial', label:'시리얼·자산번호', value:src.serial || '' },
      { k:'status', label:'상태', type:'select', options:Object.entries(ASSET_STATUS).map(([k, x]) => [k, x.label]), value:src.status || 'review' },
      { k:'orderedAt', label:'발주일', type:'date', value:src.orderedAt || '' },
      { k:'installedAt', label:'설치일', type:'date', value:src.installedAt || '' },
      { k:'operatingAt', label:'가동 확인일', type:'date', value:src.operatingAt || '' },
      { k:'memo', label:'메모 (설치 위치·A/S 등)', type:'textarea', value:src.memo || '', full:true },
    ],
    onSave: v => {
      if (!/^\d+$/.test(v.qty) || Number(v.qty) < 1) return '수량은 1 이상의 숫자로 입력하세요.';
      const id = aid || newId('as');
      saveAsset(id, Object.assign({}, as || {}, v, { qty:Number(v.qty) }));
    },
    onDelete: as ? () => { deleteMaster('assets', state.assets, aid); } : null,
  });
}

/* ======================= 기관·담당자 입력 폼 ======================= */

/* 폼 모달 공통. fields: [{k, label, type:'text'|'select'|'textarea', options:[[v,t]], value, ph, full}]
   onSave(values) → 오류 문구(string)면 모달 유지, 아니면 닫힘. onDelete() 동일(두 번 눌러 삭제). */
function formModal({ title, hint, fields, onSave, onDelete }){
  const scrim = el('div','scrim');
  const m = el('div','modal');
  m.setAttribute('role','dialog'); m.setAttribute('aria-label', title);
  m.append(el('h2', null, title));
  if (hint) m.append(el('p','hint', hint));
  const g = el('div','mgrid');
  const inputs = {};
  for (const f of fields){
    const w = el('div','mf' + (f.full ? ' full' : ''));
    const l = el('label', null, f.label); l.htmlFor = 'ff-' + f.k;
    let i;
    if (f.type === 'select'){
      i = document.createElement('select');
      for (const [v,t] of f.options) i.append(new Option(t, v));
    } else if (f.type === 'textarea'){
      i = document.createElement('textarea'); i.rows = 2;
    } else {
      i = document.createElement('input');
      if (f.type) i.type = f.type;
    }
    i.id = 'ff-' + f.k; i.value = f.value || ''; if (f.ph) i.placeholder = f.ph;
    inputs[f.k] = i; w.append(l, i); g.append(w);
    if (f.list){   // 추천 목록(직접 입력도 됨)
      const dl = document.createElement('datalist'); dl.id = 'ff-' + f.k + '-list';
      for (const t of f.list) dl.append(new Option(t, t));
      i.setAttribute('list', dl.id); w.append(dl);
    }
  }
  m.append(g);
  const err = el('div','err'); err.hidden = true; m.append(err);
  const act = el('div','mact');
  const close = () => { scrim.remove(); m.remove(); };
  const fail = t => { err.hidden = false; err.textContent = t; };
  if (onDelete){
    const del = el('button','btn ghost danger','삭제');
    del.addEventListener('click', () => {
      if (!del.dataset.armed){ del.dataset.armed = '1'; del.textContent = '삭제 확인'; return; }
      const r = onDelete();
      if (typeof r === 'string'){ fail(r); delete del.dataset.armed; del.textContent = '삭제'; return; }
      close();
    });
    act.append(del, el('span','grow'));
  }
  const cancel = el('button','btn','취소');
  const ok = el('button','btn primary','저장');
  act.append(cancel, ok); m.append(act);
  cancel.addEventListener('click', close);
  scrim.addEventListener('click', close);
  ok.addEventListener('click', () => {
    const v = Object.fromEntries(Object.entries(inputs).map(([k,i]) => [k, String(i.value || '').trim()]));
    const r = onSave(v);
    if (typeof r === 'string') return fail(r);
    close();
  });
  document.body.append(scrim, m);
  inputs[fields[0].k].focus();
  return { m, inputs };
}

const TYPE_OPTS = ROLE_ORDER.map(r => [r, ROLES[r].label]);

/** 기관 등록·수정. done(accountId)는 저장 후 호출된다. */
function openAccountForm(aid, preset, done){
  const a = aid ? state.accounts.get(aid) : null;
  formModal({
    title: a ? '기관 수정' : '기관 추가',
    hint: '소공인 업체, 공급기업, 컨설팅사, 코디네이터 소속기관을 등록합니다. 소공인 기관명은 과제 업체명으로 쓰입니다.',
    fields: [
      { k:'type', label:'유형', type:'select', options:TYPE_OPTS, value:a?.type || preset?.type || 'sogongin' },
      { k:'name', label:'기관명', value:a?.name || preset?.name || '' },
      { k:'phone', label:'대표전화', value:a?.phone || preset?.phone || '' },
      { k:'address', label:'주소 (도로명) — 방문·길찾기에 쓰입니다', value:a?.address || preset?.address || '', ph:'예: 서울 금천구 가산디지털1로 000', full:true },
      { k:'addressDetail', label:'상세 주소', value:a?.addressDetail || preset?.addressDetail || '', ph:'동·층·호' },
      { k:'visitNote', label:'방문 안내', value:a?.visitNote || preset?.visitNote || '', ph:'주차·출입 방법 등' },
      { k:'memo', label:'메모', type:'textarea', value:a?.memo || preset?.memo || '', full:true },
    ],
    onSave: v => {
      if (!v.name) return '기관명을 입력하세요.';
      const dup = [...state.accounts.entries()].find(([id,x]) => id !== aid && x.type === v.type && x.name === v.name);
      if (dup) return '같은 유형에 같은 이름의 기관이 이미 있습니다.';
      if (a && a.type !== v.type && projectsLinkedTo(c => c.accountId === aid).length) return '과제에 지정된 기관은 유형을 바꿀 수 없습니다.';
      const id = aid || newId('a');
      saveAccount(id, Object.assign({}, a || {}, v));
      if (done) done(id);
    },
    onDelete: a ? () => {
      const n = [...state.people.values()].filter(c => c.accountId === aid).length;
      if (n) return '소속 담당자 ' + n + '명이 있어 삭제할 수 없습니다. 담당자를 먼저 삭제하세요.';
      const used = projectsLinkedTo(c => c.accountId === aid);
      if (used.length) return '과제에 연결돼 있어 삭제할 수 없습니다: ' + used.map(([,p]) => p.company + ' ' + p.cycle).join(', ');
      deleteMaster('accounts', state.accounts, aid);
    } : null,
  });
}

/** 담당자 등록·수정. preset: {accountId, type, name, title, phone, email, kakao}. done(contactId). */
function openContactForm(cid, preset, done){
  const c = cid ? state.people.get(cid) : null;
  const type = preset?.type || (c ? state.accounts.get(c.accountId)?.type : '');
  const accs = [...state.accounts.entries()]
    .filter(([,a]) => !type || a.type === type)
    .sort((x,y) => ROLE_ORDER.indexOf(x[1].type) - ROLE_ORDER.indexOf(y[1].type) || x[1].name.localeCompare(y[1].name,'ko'));
  if (!accs.length){ openAccountForm(null, { type }, aid => openContactForm(null, Object.assign({}, preset, { accountId:aid }), done)); return; }
  const src = c || preset || {};
  formModal({
    title: c ? '담당자 수정' : '담당자 추가',
    hint: c ? '여기서 고친 연락처는 이 사람이 지정된 모든 과제에 자동으로 반영됩니다(보낸 메일 이력은 그대로).' : '이름을 모르면 직함(예: 영업 담당)만 적어도 됩니다.',
    fields: [
      { k:'accountId', label:'소속 기관', type:'select', options:accs.map(([id,a]) => [id, ROLES[a.type].label + ' · ' + a.name]), value:src.accountId || accs[0][0], full:true },
      { k:'name', label:'이름', value:src.name || '' },
      { k:'title', label:'직함 (이름과 따로)', value:src.title || '', ph:'대표, 과장, 영업 담당…', list:TITLE_LIST },
      { k:'phone', label:'전화', value:src.phone || '' },
      { k:'email', label:'이메일', value:src.email || '' },
      { k:'kakao', label:'카톡 ID', value:src.kakao || '' },
      { k:'memo', label:'메모', value:src.memo || '' },
    ],
    onSave: v => {
      if (!v.name && !v.title) return '이름이나 직함 중 하나는 입력하세요.';
      const nt = v.name.match(/^(.+?)\s+(\S+)$/);
      if (nt && TITLE_LIST.includes(nt[2])) return '이름 끝의 «' + nt[2] + '»는 직함입니다. 이름에는 «' + nt[1] + '»만 적고 직함은 직함 칸에 따로 입력하세요.';
      if (v.email && !EMAIL_RE.test(v.email)) return '이메일 형식이 맞지 않습니다.';
      if (c && c.accountId !== v.accountId && state.accounts.get(c.accountId)?.type !== state.accounts.get(v.accountId)?.type
          && projectsLinkedTo(x => x.contactId === cid).length) return '과제에 지정된 담당자는 다른 유형의 기관으로 옮길 수 없습니다.';
      const id = cid || newId('c');
      saveContact(id, Object.assign({}, c || {}, v));
      if (done) done(id);
    },
    onDelete: c ? () => {
      const used = projectsLinkedTo(x => x.contactId === cid);
      if (used.length) return '과제에 담당자로 지정돼 있어 삭제할 수 없습니다: ' + used.map(([,p]) => p.company + ' ' + p.cycle).join(', ') + '. 과제에서 먼저 해제하세요.';
      deleteMaster('contacts', state.people, cid);
    } : null,
  });
}

/* ======================= 오브젝트 목록 · 상세 =======================
   Project(과제 = 업체 × 연도·차수) / Account(기관) / Contact(담당자).
   목록 탭에서 행을 누르면 상세 패널이 열리고, 상세끼리는 go()로 오간다.
   상세 패널은 한 번에 하나: 과제 = state.openId, 기관·담당자 = state.rec.   */

const curRec = () => state.rec ? state.rec : state.openId ? { t:'project', id:state.openId } : null;
function go(t, id, push = true){
  const cur = curRec();
  if (push && cur && !(cur.t === t && cur.id === id)) state.back.push(cur);
  if (t === 'project'){
    state.rec = null; state.openId = id;
    state.openSteps = new Set([String(Math.min(state.projects.get(id)?.currentStep || 1, 8))]);
  } else {
    state.openId = null; state.rec = { t, id };
  }
  drawerScroll = 0;
  render();
}
function goBack(){ const prev = state.back.pop(); if (prev) go(prev.t, prev.id, false); }
function closeRec(){ state.openId = null; state.rec = null; state.back = []; render(); }

/** 상세 패널 틀: 뒤로 · 제목 · 부제 · 버튼들 · 닫기. body를 돌려준다. */
function drawerFrame(label, title, sub, btns){
  const scrim = el('div','scrim');
  scrim.addEventListener('click', closeRec);
  const dr = el('aside','drawer');
  dr.setAttribute('role','dialog'); dr.setAttribute('aria-label', label);
  const head = el('div','dr-head');
  if (state.back.length){
    const b = el('button','btn ghost','← 뒤로');
    b.addEventListener('click', goBack);
    head.append(b);
  }
  const ttl = el('div', null); ttl.style.flex = '1 1 auto';
  ttl.append(el('h2', null, title));
  const sb = el('div','sub');
  for (const x of [].concat(sub)) sb.append(typeof x === 'string' ? document.createTextNode(x) : x);
  ttl.append(sb);
  head.append(ttl, ...btns);
  const close = el('button','btn ghost','닫기');
  close.addEventListener('click', closeRec);
  head.append(close);
  dr.append(head);
  const body = el('div','dr-body');
  dr.append(body);
  document.body.append(scrim, dr);
  drawerHost = { remove(){ scrim.remove(); dr.remove(); } };
  return body;
}
const linkBtn = (text, fn) => { const b = el('button','linkbtn', text); b.addEventListener('click', fn); return b; };
/** 상세 안의 이동 행 */
function recRow(main, meta, rc, fn){
  const b = el('button','rrow');
  if (rc) b.style.setProperty('--rc', rc);
  b.append(el('b', null, main), el('span','m', meta || ''));
  b.addEventListener('click', fn);
  return b;
}
function kvBlock(pairs){
  const box = el('div', null);
  for (const [k, v] of pairs){
    const row = el('div','kv');
    row.append(el('i', null, k), el('span','val' + (v ? '' : ' none'), v || '—'));
    if (v){ const cp = el('button', null, '복사'); cp.addEventListener('click', () => copyText(cp, v)); row.append(cp); }
    box.append(row);
  }
  return box;
}
const rolesIn = (p, pred) => ROLE_ORDER.filter(r => pred(p.contacts?.[r] || {}));
const curStepName = p => (p.currentStep || 1) >= DONE_COL ? '완료' : (p.currentStep || 1) + '. ' + STEPS[(p.currentStep || 1) - 1].name;
const peopleOf = aid => [...state.people.entries()].filter(([,c]) => c.accountId === aid).sort((x,y) => personLabel(x[1]).localeCompare(personLabel(y[1]),'ko'));

/** 전 과제 활동: [{pid, p, a}] 최신순 */
function allActivities(){
  const out = [];
  for (const [pid, p] of state.projects) for (const a of activitiesOf(p)) out.push({ pid, p, a });
  return out.sort((x,y) => String(y.a.ts).localeCompare(String(x.a.ts)));
}
/** 이 담당자(들)에게 간 연락인가: contactId, 없으면 주소로 맞춘다(주소록 연결 전 기록 대비) */
function sentTo(a, cids){
  const addrs = new Set();
  for (const cid of cids){ const c = state.people.get(cid); if (c?.email) addrs.add(c.email.toLowerCase()); if (c?.kakao) addrs.add(c.kakao.toLowerCase()); }
  return (a.to || []).some(t => (t.contactId && cids.has(t.contactId)) || (t.addr && addrs.has(String(t.addr).toLowerCase())));
}
function activitySection(body, rows, emptyText){
  body.append(el('div','sec-title','연락 이력 ' + rows.length + '건'));
  const av = el('div','mails');
  if (!rows.length) av.append(el('div','rnote', emptyText));
  rows.slice(0, 20).forEach(x => av.append(activityEl(x.a, true, x.p.company + ' ' + x.p.cycle)));
  if (rows.length > 20) av.append(el('div','rnote','최근 20건만 표시합니다. 전체는 «활동» 탭에서 보세요.'));
  body.append(av);
}

/* ---------- 기관(Account) 상세 ---------- */
function renderAccountRec(aid){
  const a = state.accounts.get(aid);
  if (!a){ state.rec = null; return; }
  const ed = el('button','btn ghost','수정');
  ed.addEventListener('click', () => openAccountForm(aid));
  const body = drawerFrame(a.name + ' 기관 상세', a.name, (ROLES[a.type]?.label || '') + ' 기관' + (a.isSample ? ' · 예시' : ''), [ed]);

  body.append(el('div','sec-title','기관 정보'));
  body.append(kvBlock([['대표전화', a.phone], ['주소', a.address], ['상세 주소', a.addressDetail], ['방문 안내', a.visitNote], ['메모', a.memo]]));
  if (a.address) body.append(mapButtons({ address:a.address, addressDetail:a.addressDetail }), originControl());

  const people = peopleOf(aid);
  body.append(el('div','sec-title','담당자 ' + people.length + '명'));
  const pl = el('div','rlist');
  for (const [cid, c] of people)
    pl.append(recRow(personLabel(c) || '(이름 없음)', [c.phone, c.email].filter(Boolean).join(' · '), rv(a.type), () => go('contact', cid)));
  const addC = el('button','btn','+ 담당자 추가');
  addC.addEventListener('click', () => openContactForm(null, { accountId:aid, type:a.type }));
  pl.append(addC);
  body.append(pl);

  const projs = projectsLinkedTo(c => c.accountId === aid);
  body.append(el('div','sec-title','관련 과제 ' + projs.length + '건'));
  const jl = el('div','rlist');
  if (!projs.length) jl.append(el('div','rnote','이 기관이 지정된 과제가 없습니다.'));
  for (const [pid, p] of projs){
    const roles = rolesIn(p, c => c.accountId === aid).map(r => ROLES[r].label).join('·');
    jl.append(recRow(p.company + ' ' + p.cycle, roles + ' · ' + curStepName(p) + ' · ' + progress(p) + '/8', rv(a.type), () => go('project', pid)));
  }
  body.append(jl);

  if (a.type === 'supplier'){
    const prods = [...state.products.entries()].filter(([, x]) => x.supplierId === aid);
    body.append(el('div','sec-title','공급 장비 ' + prods.length + '종'));
    const pl2 = el('div','rlist');
    if (!prods.length) pl2.append(el('div','rnote','이 공급기업으로 등록된 장비가 없습니다.'));
    for (const [prid, x] of prods) pl2.append(recRow('[' + (PRODUCT_KIND[x.kind] || '') + '] ' + productLabel(x), assetsWhere(as => as.productId === prid).length + '건 도입', rv('supplier'), () => go('product', prid)));
    const addP = el('button','btn','+ 장비 추가');
    addP.addEventListener('click', () => openProductForm(null, { supplierId:aid }));
    pl2.append(addP);
    body.append(pl2);
  }
  if (a.type === 'sogongin'){
    const pids = new Set(projs.map(([pid]) => pid));
    const rows = assetsWhere(as => pids.has(as.projectId));
    body.append(el('div','sec-title','도입 장비 ' + rows.length + '건'));
    body.append(assetList(rows, '이 업체 과제에 등록된 도입 장비가 없습니다.', true));
  }

  const cids = new Set(people.map(([cid]) => cid));
  // 기관명이 org로, 또는 (주소록 이전 기록처럼) 이름 칸에 기관명이 들어간 수신자도 이 기관 연락으로 본다
  activitySection(body, allActivities().filter(x => sentTo(x.a, cids) || (x.a.to || []).some(t => (t.org && t.org === a.name) || (t.name && t.name === a.name))),
    '이 기관 담당자에게 보낸 연락이 없습니다.');
}

/* ---------- 담당자(Contact) 상세 ---------- */

/* ---------- «명함으로 등록» ----------
   명함 사진·텍스트 → Claude(sample.json 한 번)가 칸을 뽑는다 → 기관·담당자 등록 창을 미리 채워 연다.
   명함에 적힌 값만 옮기고(추측 금지), 저장은 사람이 창에서 확인해 누른다. 사진은 저장하지 않는다(Claude에게만 보냄).
   누른 사람의 Claude 사용량을 쓰고 첫 호출에 동의 창이 뜬다. 기관 유형은 추정값을 기본으로 사람이 고른다. */
const CARD_TYPES = [['sogongin','소공인'], ['supplier','공급기업'], ['consultant','컨설팅사'], ['coord','코디 소속기관']];
const CARD_KEYS = ['org','orgType','orgTypeWhy','name','title','mobile','tel','email','kakao','address','addressDetail','website','other'];
function cardPrompt(text, nImg){
  return [
    '[명함] 아래 명함' + (nImg ? '(첨부 이미지 ' + nImg + '장' + (text ? ' + 텍스트' : '') + ')' : ' 텍스트') + '에서 기관·연락처 정보를 뽑아 JSON 객체 하나로 답하세요.',
    '규칙:',
    '- 명함에 적힌 것만 옮깁니다. 추측·보완·지어내기 금지. 없으면 "".',
    '- name에는 사람 이름만, 직함·직위(대표, 이사, 과장, 팀장, 영업 담당 등)는 title에 둡니다.',
    '- mobile = 휴대폰, tel = 회사 대표·사무실 전화. 번호는 명함 표기 그대로(하이픈 유지).',
    '- address = 도로명 주소(시·구·도로명·건물번호까지), addressDetail = 동·층·호 등 나머지.',

const cardErrorText = e => ({

  empty_completion:'Claude 답이 비었습니다. 사진을 더 선명하게 찍어 주세요.', refused:'Claude가 이 요청을 거절했습니다.',

}[e && e.code] || '읽지 못했습니다 (' + ((e && (e.code || e.message)) || 'unknown') + ').');
const normOrg = s => String(s || '').replace(/\(주\)|주식회사|㈜|\s/g, '').toLowerCase();
const digitsOf = s => String(s || '').replace(/\D/g, '');
/** Claude가 돌려준 명함 값 정리: 문자열로 맞추고, 이름 끝에 붙어 온 직함은 나눈다(담당자 저장 규칙: 직함은 따로) */
function normCard(r){
  const c = Object.fromEntries(CARD_KEYS.map(k => [k, String(r?.[k] ?? '').trim()]));
  const nt = c.name.match(/^(.+?)\s+(\S+)$/);
  if (nt && TITLE_LIST.includes(nt[2]) && !c.title){ c.name = nt[1]; c.title = nt[2]; }
  return c;
}
/** 명함 값으로 기관(새로 또는 기존)·담당자 등록 창을 차례로 연다. 저장은 사람이. 문제가 있으면 안내 문구, 열었으면 true */
function openCardForms(c, aid0, type){
  if (!aid0 && !type) return '새 기관의 유형을 고르세요.';
  const memo = [c.website && '웹사이트 ' + c.website, c.other].filter(Boolean).join(' / ');
  const person = aid => ({ accountId:aid, type:state.accounts.get(aid)?.type, name:c.name, title:c.title, phone:c.mobile || c.tel, email:c.email, kakao:c.kakao,
    memo:[c.mobile && c.tel ? '회사 전화 ' + c.tel : '', '명함에서 등록'].filter(Boolean).join(' / ') });
  const doneC = () => setNotice('명함에서 담당자를 등록했습니다: ' + [c.name, c.title].filter(Boolean).join(' ') + (c.org ? ' · ' + c.org : ''));
  if (aid0) openContactForm(null, person(aid0), doneC);
  else openAccountForm(null, { type, name:c.org, phone:c.tel, address:c.address, addressDetail:c.addressDetail, memo }, aid => openContactForm(null, person(aid), doneC));
  return true;
}
/** 명함 미리보기 + 기관 선택(같은 이름이면 기존 기관이 기본) + 유형 + 중복 경고 + «등록 창 열기». idp = 요소 id 접두사.
    box.openForms()로 버튼과 같은 동작을 부를 수 있다(도우미의 «등록해 줘»). */
function cardReview(c, idp, onOpened){
  const box = el('div','cardbox');
  box.append(kvBlock([['기관명', c.org], ['이름', c.name], ['직함', c.title], ['휴대폰', c.mobile], ['전화', c.tel], ['이메일', c.email], ['카톡', c.kakao],
    ['주소', c.address], ['상세 주소', c.addressDetail], ['웹사이트', c.website], ['기타', c.other]]));
  const same = [...state.accounts.entries()].filter(([, a]) => c.org && normOrg(a.name) === normOrg(c.org));
  const pick = el('div','sf');
  const pl = el('label', null, '기관'); pl.htmlFor = idp + '-acc';
  const accSel = document.createElement('select'); accSel.id = idp + '-acc';
  for (const [aid, a] of same) accSel.append(new Option('기존 기관에 담당자 추가 — ' + a.name + ' (' + (ROLES[a.type]?.label || a.type) + ')', aid));
  accSel.append(new Option('새 기관으로 등록' + (c.org ? ' — ' + c.org : ''), ''));
  const typeSel = document.createElement('select'); typeSel.id = idp + '-type'; typeSel.setAttribute('aria-label','기관 유형');
  typeSel.append(new Option('기관 유형을 고르세요', ''));
  for (const [k, v] of CARD_TYPES) typeSel.append(new Option(v + (k === c.orgType ? ' (추정)' : ''), k));
  typeSel.value = CARD_TYPES.some(([k]) => k === c.orgType) ? c.orgType : '';
  const why = el('div','rnote', c.orgTypeWhy ? '유형 추정 근거: ' + c.orgTypeWhy : '');
  const sync = () => { typeSel.hidden = !!accSel.value; why.hidden = !!accSel.value || !c.orgTypeWhy; };
  accSel.addEventListener('change', sync); sync();
  pick.append(pl, accSel, typeSel, why); box.append(pick);
  const dup = [...state.people.entries()].filter(([, p]) => (c.email && (p.email || '').toLowerCase() === c.email.toLowerCase())
    || (digitsOf(c.mobile).length >= 9 && digitsOf(p.phone) === digitsOf(c.mobile)));
  if (dup.length) box.append(el('div','caveat cdup', '이미 등록된 담당자일 수 있습니다: ' + dup.map(([, p]) => personLabel(p) + ' (' + (state.accounts.get(p.accountId)?.name || '기관 없음') + ')').join(', ')));
  const err = el('div','err'); err.hidden = true;

    if (r !== true){ err.textContent = r; err.hidden = false; return r; }
    err.hidden = true; onOpened?.(); return true;
  };
  open.addEventListener('click', () => box.openForms());
  const ob = el('div','sendbar'); ob.append(open); box.append(ob, err);
  return box;
}

/* ---------- 도우미 양식 초안: buildDraft 뼈대(보드 값) → 빈 칸·초안 칸만 Claude가 씀 → 미리보기 → 단계 산출물로 등록 ---------- */

const draftSteps = form => form.id === 'plan' ? [1, 2, 3, 4] : form.id === 'result' ? [1, 2, 3, 4, 5, 6, 7, 8] : STEPS.map(s => s.n).filter(n => n <= form.step);

async function saveDraftDocx(p, name, draft, btn){

/** 초안을 해당 단계 산출물(steps[n].outputs)에 버전으로 기록. 산출물 체크박스(docs)는 건드리지 않는다. 반환 = 버전 */
function registerOutput(pid, form, draft){
  const np = structuredClone(state.projects.get(pid)), key = String(form.step);
  np.steps[key] = np.steps[key] || { status:'todo', planned:'', actual:'', tasks:{}, docs:{}, notes:[] };
  const outs = np.steps[key].outputs = np.steps[key].outputs || [];
  const v = outs.filter(o => o.formId === form.id).reduce((m, o) => Math.max(m, o.v || 0), 0) + 1;
  outs.push(Object.assign({ id:newId('o'), formId:form.id, name:form.name + ' 초안 v' + v, v, ts:new Date().toISOString(), draft, fromChat:true }, me ? { by:me } : {}));
  save(pid, np);
  return v;

function assistCaps(){

  if (!sampleFn){

/** 과제 사업비 점검 표시: [{ok, text}] */
function budgetFlags(b){
  if (!b.rule) return [{ ok:false, text:(b.year || '연도 미상') + '년 규칙 없음' }];
  const out = [];
  if (b.sw > 0 && b.over > 0) out.push({ ok:false, text:'S/W ' + won(b.over) + ' 초과' });
  if (b.inkind > 0 && b.inkindOver > 0) out.push({ ok:false, text:'현물 ' + won(b.inkindOver) + ' 초과' });
  if (b.inkindMax > 0 && b.inkindOver < 0) out.push({ ok:false, text:'현물 ' + won(-b.inkindOver) + ' 부족' });
  if (b.govOver > 0) out.push({ ok:false, text:'국비 상한 ' + won(b.govOver) + ' 초과' });
  return out.length ? out : [{ ok:true, text:'한도 이내' }];
}
/** 보고서 «사업비 현황»: 과제별 H/W·S/W·현물·총 사업비·국비·현금(입력값 기반 계산) */
function budgetCard(rows){
  const card = el('section','rcard budcard');
  const items = rows.map(r => ({ r, b:budgetOf(r.id) })).filter(x => x.b.hw + x.b.sw + x.b.inkind > 0);
  const hh = el('div','rhead');
  hh.append(el('h2', null, '사업비 현황'), el('span','n mono', items.length + '개 과제'), el('span','grow'));
  const flagText = b => budgetFlags(b).map(f => f.text).join(' · ');
  hh.append(csvBtn('사업비현황_' + today() + '.csv',
    [['업체명', x => x.r.p.company], ['차수', x => x.r.p.cycle], ['공고', x => NOTICES[x.r.p.notice]?.label || '미확인'],
     ['H/W', x => x.b.hw], ['S/W', x => x.b.sw], ['현물(인건비)', x => x.b.inkind], ['총 사업비', x => x.b.total],
     ['국비', x => x.b.gov ?? ''], ['현금', x => x.b.cash ?? ''], ['S/W 한도', x => x.b.limit ?? ''], ['현물 목표', x => x.b.inkindMax ?? ''],
     ['점검', x => flagText(x.b)], ['단가 없는 장비', x => x.b.noPrice.join(', ')]], items));
  card.append(hh);
  const tb = document.createElement('table');
  tb.append(headRow(['업체명','차수','공고','H/W','S/W','현물','총 사업비','국비','현금','점검']));
  const body = document.createElement('tbody');
  if (!items.length) body.append(emptyRow(10, '도입 장비나 현물 인건비가 입력된 과제가 없습니다.'));
  const tot = { hw:0, sw:0, inkind:0, total:0, gov:0, cash:0 };
  for (const { r, b } of items){
    const tr = document.createElement('tr');
    tr.style.cursor = 'pointer';
    tr.addEventListener('click', () => openStep(r.id, 4));
    const nc = document.createElement('td');
    for (const f of budgetFlags(b)) nc.append(el('span','badge ' + (f.ok ? 'ch-auto' : 'warn'), f.text));
    const tc = document.createElement('td'); tc.append(noticeBadge(r.p));
    tr.append(td(r.p.company,'co'), td(r.p.cycle,'num'), tc, td(won(b.hw),'num'), td(won(b.sw),'num'), td(won(b.inkind),'num'),
      td(won(b.total),'num'), td(b.gov == null ? '—' : won(b.gov),'num'), td(b.cash == null ? '—' : won(b.cash),'num'), nc);
    body.append(tr);
    for (const k of Object.keys(tot)) tot[k] += b[k] || 0;
  }
  if (items.length > 1){
    const tr = el('tr','sumrow');
    tr.append(td('합계','co'), td(''), td(''), ...['hw','sw','inkind','total','gov','cash'].map(k => td(won(tot[k]),'num')), td(''));
    body.append(tr);
  }
  tb.append(body);
  const w = el('div','tbl-wrap'); w.append(tb); card.append(w);
  card.append(el('div','rnote','입력값(장비 단가 × 자산 수량, 현물 인건비) 기반 계산값입니다 — 확정 금액이 아닙니다. 총 사업비 = H/W + S/W + 현물, 국비 = 총 사업비 × 연도별 규칙의 비율, 현금 = 나머지. 원가산정보고서에 따라 지원금액이 조정될 수 있습니다(공고). 행을 누르면 4단계 체크포인트가 열립니다. 상단 검색·연도·공고·코디 필터가 적용됩니다.'));
  return card;
}

function headRow(labels){
  const thead = document.createElement('thead');
  const tr = document.createElement('tr');
  for (const l of labels){ const th = document.createElement('th'); th.textContent = l; tr.append(th); }
  thead.append(tr);
  return thead;
}
function td(text, cls){
  const c = document.createElement('td');
  if (cls) c.className = cls;
  c.textContent = text;
  return c;
}
function emptyRow(span, text){
  const tr = el('tr','emptyrow');
  const c = document.createElement('td');
  c.colSpan = span; c.textContent = text;
  tr.append(c);
  return tr;
}

function csvBtn(filename, cols, rows, opts = {}){
  // 구글 캘린더 가져오기는 BOM이 붙으면 첫 헤더를 못 읽으므로 bom:false로 뺀다.
  // 엑셀에서 열 CSV는 BOM이 있어야 한글이 깨지지 않으므로 기본값은 true.
  const bom = opts.bom === false ? '' : '﻿';
  const b = el('button','btn', opts.label || 'CSV 내보내기');
  if (!downloads) { b.disabled = true; b.title = '이 화면에서는 파일 저장을 쓸 수 없습니다.'; return b; }
  b.addEventListener('click', async () => {
    const esc = v => '"' + String(v ?? '').replace(/"/g,'""') + '"';
    const text = bom + [cols.map(c => esc(c[0])).join(',')]
      .concat(rows.map(r => cols.map(c => esc(c[1](r))).join(',')))
      .join('\r\n');
    b.disabled = true;
    try { await downloads.save({ filename, data:text }); }
    catch (e) { if (e && e.code !== 'declined') setNotice('파일 저장에 실패했습니다 (' + ((e&&e.code)||'unknown') + ').'); }
    finally { b.disabled = false; }
  });
  return b;
}

async function copySummary(btn, visits, rows){

}

let drawerHost = null;
let drawerScroll = 0;
const drafts = new Map();   // 메모 입력 중이던 텍스트를 다시 그릴 때 보존
let actAllId = null;        // 활동 이력을 전부 펼친 과제
let refocus = null;         // 다시 그린 뒤 포커스를 돌려줄 입력칸 {id, sel}
let redrawing = false;      // 상세 패널을 지우는 중

function renderDrawer(){
  if (drawerHost) {
    const prev = document.querySelector('.dr-body');
    if (prev) drawerScroll = prev.scrollTop;
    for (const ta of document.querySelectorAll('.noteadd textarea')){
      if (ta.value.trim()) drafts.set(ta.id, ta.value); else drafts.delete(ta.id);
    }
    // 진단 입력: 저장 전 값만 보존(저장된 값과 같으면 버려서 다른 사람의 수정이 가려지지 않게)
    for (const ta of document.querySelectorAll('.diag textarea')){
      if (ta.value.trim() !== ta.dataset.saved) drafts.set(ta.id, ta.value); else drafts.delete(ta.id);
    }
    const ae = document.activeElement;
    if (!refocus && ae && ae.id && ae.closest && ae.closest('.diag')) refocus = { id:ae.id, sel:ae.selectionStart };
    redrawing = true;   // 제거 중 blur로 저장이 끼어들지 않게(입력 중인 값은 drafts로 보존됨)
    try { drawerHost.remove(); } finally { redrawing = false; }
    drawerHost = null;
  }
  if (state.rec){
    if (state.rec.t === 'account') renderAccountRec(state.rec.id);
    else if (state.rec.t === 'contact') renderContactRec(state.rec.id);
    else if (state.rec.t === 'product') renderProductRec(state.rec.id);
    else if (state.rec.t === 'asset') renderAssetRec(state.rec.id);
    if (state.rec){ const b = document.querySelector('.dr-body'); if (b) b.scrollTop = drawerScroll; refocus = null; return; }
    // 삭제돼 열 수 없으면 아래(과제 또는 닫힘)로
  }
  const id = state.openId;
  if (!id || !state.projects.has(id)) { drawerScroll = 0; drafts.clear(); refocus = null; if (!state.rec) state.back = []; return; }
  const p = state.projects.get(id);

  const del = el('button','btn ghost danger','삭제');
  del.addEventListener('click', () => {
    if (del.dataset.armed) { removeProject(id); return; }
    del.dataset.armed = '1'; del.textContent = '삭제 확인';
    setTimeout(() => { if (del.isConnected){ delete del.dataset.armed; del.textContent = '삭제'; } }, 4000);
  });
  const sgAid = p.contacts?.sogongin?.accountId;
  const sub = [p.cycle + ' · 담당 ' + (p.contacts?.coord?.name || '미지정') + ' · ' + progress(p) + '/8 단계 완료'];
  if (sgAid && state.accounts.has(sgAid)) sub.push(' · ', linkBtn('기관 보기', () => go('account', sgAid)));
  const body = drawerFrame(p.company + ' 과제 상세', p.company, sub, [del]);

  const bytes = docBytes(p);
  if (bytes > SIZE_WARN){
    const w = el('div','notice'); w.style.margin = '0 0 12px';
    w.textContent = '이 과제 문서가 ' + fmtSize(bytes) + '로 저장 한도(256KB)에 가깝습니다. «과제» 탭의 «전체 백업»을 먼저 받은 뒤, 1년 지난 연락 이력의 본문을 비워 용량을 줄이세요(제목·수신자·일시는 남습니다). ';
    const b = el('button','btn','1년 지난 활동 본문 정리');
    b.addEventListener('click', () => {
      if (!b.dataset.armed){ b.dataset.armed = '1'; b.textContent = '백업 받았으면 한 번 더 누르세요'; return; }
      trimOldBodies(id);
    });
    w.append(b); body.append(w);
  }

  const sk = skipped(p);
  if (sk){
    const w = el('div','notice');
    w.style.margin = '0 0 12px';
    w.textContent = '현재 단계보다 앞선 단계 ' + sk + '개가 아직 완료되지 않았습니다. 순서를 건너뛴 상태입니다.';
    body.append(w);
  }

  body.append(el('div','sec-title','공고 구분'));
  const nbox = el('div','cbody');
  const nsel = noticeSelect('ng-' + id, p.notice);
  nsel.setAttribute('aria-label','공고 구분');
  nsel.addEventListener('change', () => { const np = structuredClone(state.projects.get(id)); np.notice = nsel.value; save(id, np); });
  nbox.append(nsel);
  if (!NOTICES[p.notice]) nbox.append(el('div','rnote','원공고(98_)와 추가공고(99_)는 매출 요건이 정반대입니다. 공고문·신청서로 확인한 뒤 지정하세요.'));
  body.append(nbox);

  body.append(el('div','sec-title','역할별 담당자'));
  const cts = el('div','contacts');
  for (const r of ROLE_ORDER) cts.append(contactRow(id, p, r));
  body.append(cts);

  body.append(el('div','sec-title','방문지'));
  body.append(visitSection(id, p));

  body.append(el('div','sec-title','자료함 ' + (p.files || []).length + '건'));
  body.append(filesSection(id, p));

  const pas = assetsWhere(a => a.projectId === id);
  body.append(el('div','sec-title','도입 장비 ' + pas.length + '건'));
  const al = assetList(pas, '등록된 도입 장비가 없습니다. 견적·발주가 정해지면 등록하세요.', false);
  const addA = el('button','btn','+ 장비 도입 등록');
  addA.addEventListener('click', () => openAssetForm(null, { projectId:id }));
  al.append(addA);
  body.append(al);
  if (pas.length){
    const b = budgetOf(id);
    body.append(el('div','rnote bsum', budgetLine(b) + ' — 현물 인건비·협약일은 4단계 «사업계획서 체크포인트»에서 입력'));
    const bw = budgetWarnBox(b);
    if (bw) body.append(bw);
  }

  // 과제 전체 활동 이력 (최신 5건, «전체 보기»로 펼침)
  const acts = activitiesOf(p);
  body.append(el('div','sec-title','활동 이력 ' + acts.length + '건'));
  const av = el('div','mails');
  if (!acts.length) av.append(el('div','rnote','아직 기록된 연락이 없습니다. 각 단계의 «메일 · 카톡 보내기»에서 보내거나 기록하면 여기에 모입니다.'));
  const all = actAllId === id;
  (all ? acts : acts.slice(0, 5)).forEach(a => av.append(activityEl(a, true)));
  if (acts.length > 5){
    const more = el('button','btn ghost', all ? '최근 5건만 보기' : '전체 보기 (' + acts.length + '건)');
    more.addEventListener('click', () => { actAllId = all ? null : id; render(); });
    av.append(more);
  }
  body.append(av);

  body.append(el('div','sec-title','8단계 진행'));
  for (const s of STEPS) body.append(stepEl(id, p, s));

  body.scrollTop = drawerScroll;
  const rf = refocus && document.getElementById(refocus.id);
  if (rf){ rf.focus({ preventScroll:true }); if (refocus.sel != null) try { rf.setSelectionRange(refocus.sel, refocus.sel); } catch (e) {} }
  refocus = null;
}

/* 역할별 담당자 한 줄: 주소록 선택 목록 + (연결됨) 읽기 전용 정보 / (미연결) 기존 직접 입력 칸 */
function contactRow(id, p, r){
  const cur = p.contacts?.[r] || {};
  const row = el('div','crow m');
  row.style.setProperty('--rc', rv(r));
  row.append(el('div','rl', ROLES[r].label));
  const cb = el('div','cbody');

  const sel = document.createElement('select');
  sel.id = 'cs-' + id + '-' + r; sel.setAttribute('aria-label', ROLES[r].label + ' 담당자 선택');
  sel.append(new Option(cur.contactId ? '(지정 해제)' : '담당자 목록에서 선택…', ''));
  for (const x of peopleOfType(r)) sel.append(new Option(optLabel(x), x.id));
  sel.append(new Option('+ 기존 기관에 새 담당자 등록', '__new'));
  sel.append(new Option('+ 새 기관 등록', '__newacc'));
  sel.value = cur.contactId && state.people.has(cur.contactId) ? cur.contactId : '';
  sel.addEventListener('change', () => {
    const v = sel.value;
    if (v === '__new') openContactForm(null, { type:r }, cid => assignContact(id, r, cid));
    else if (v === '__newacc') openAccountForm(null, { type:r }, aid => openContactForm(null, { type:r, accountId:aid }, cid => assignContact(id, r, cid)));
    else if (v) assignContact(id, r, v);
    else if (cur.contactId) assignContact(id, r, null);
    if (v.startsWith('__')) sel.value = cur.contactId || '';
  });
  cb.append(sel);

  if (cur.contactId){
    const box = el('div','linked');
    const nameEl = el('b', null);
    if (cur.org && state.accounts.has(cur.accountId)) nameEl.append(linkBtn(cur.org, () => go('account', cur.accountId)), document.createTextNode(' · '));
    else if (cur.org) nameEl.append(document.createTextNode(cur.org + ' · '));
    nameEl.append(state.people.has(cur.contactId) ? linkBtn(cur.name || '(이름 없음)', () => go('contact', cur.contactId)) : document.createTextNode(cur.name || '(이름 없음)'));
    box.append(nameEl);
    box.append(document.createTextNode(' ' + ([cur.phone, cur.email, cur.kakao].filter(Boolean).join(' · ') || '연락처 미입력')));
    if (!state.people.has(cur.contactId)) box.append(el('span','badge warn',' 담당자 목록에서 삭제됨'));
    cb.append(box);
    const la = el('div','lact');
    if (state.people.has(cur.contactId)){
      const ed = el('button','btn ghost','연락처 수정');
      ed.title = '담당자 정보를 고치면 이 사람이 지정된 모든 과제에 반영됩니다';
      ed.addEventListener('click', () => openContactForm(cur.contactId));
      la.append(ed);
    }
    const un = el('button','btn ghost','해제');
    un.addEventListener('click', () => assignContact(id, r, null));
    la.append(un);
    cb.append(la);
  } else {
    // 미연결: 기존 직접 입력 값을 그대로 보여 주고 고칠 수 있게 둔다
    const grid = el('div','cin');
    for (const [k, ph] of [['name','담당자명'],['phone','연락처'],['email','이메일'],['kakao','카톡 ID·번호']]){
      const inp = document.createElement('input');
      inp.id = 'c-'+id+'-'+r+'-'+k;
      if (k === 'email') inp.type = 'email';
      inp.value = cur[k] || '';
      inp.placeholder = ph;
      inp.addEventListener('change', () => {
        const np = structuredClone(state.projects.get(id) || p);
        np.contacts = np.contacts || {};
        np.contacts[r] = Object.assign(EMPTY_CONTACT(), np.contacts[r]);
        np.contacts[r][k] = inp.value.trim();
        save(id, np);
      });
      grid.append(inp);
    }
    cb.append(grid);
    if (cur.name || cur.phone || cur.email || cur.kakao){
      const la = el('div','lact');
      const pr = el('button','btn','담당자로 등록 후 연결');
      pr.title = '지금 입력된 값으로 기관·담당자를 만들고 이 과제에 연결합니다';
      pr.addEventListener('click', () => promoteLegacy(id, r));
      la.append(pr);
      cb.append(la);
    }
  }
  row.append(cb);
  return row;
}

/** 미연결(직접 입력) 담당자를 주소록에 등록하고 연결한다. 기존 데이터를 옮기는 경로. */
function promoteLegacy(pid, role){
  const p = state.projects.get(pid);
  if (!p) return;
  const cur = p.contacts?.[role] || {};
  const orgName = role === 'sogongin' ? p.company : (cur.org || cur.name || '');
  // "정상호 대표" → 이름 정상호 / 직함 대표. 기관명이 곧 이름으로 들어가 있던 경우(공급기업)는 이름을 비운다.
  let name = cur.name || '', title = '';
  const mt = name.match(/^(.+?)\s+(\S+)$/);
  if (mt && TITLES.test(mt[2])){ name = mt[1]; title = mt[2]; }
  if (role !== 'sogongin' && cur.name && cur.name === orgName) name = '';
  const preset = { type:role, name, title, phone:cur.phone || '', email:cur.email || '', kakao:cur.kakao || '' };
  const toContact = aid => openContactForm(null, Object.assign({}, preset, { accountId:aid }), cid => assignContact(pid, role, cid));
  const same = [...state.accounts.entries()].find(([,a]) => a.type === role && a.name === orgName);
  if (same) toContact(same[0]);
  else openAccountForm(null, { type:role, name:orgName }, toContact);
}

        line.append(el('div','caveat pcwarn', '⚠ 임차 종료일 ' + to + '이 사업 종료일 ' + end + '을 넘습니다. 사업기간 안에서는 최대 ' + fit + '개월'
          + (price == null ? '' : '(' + won(price * fit) + ')') + '까지입니다. 넘는 ' + (n - fit) + '개월분' + left
          + (toHw ? '은 지원받을 수 없습니다. 남는 S/W 예산은 H/W 구매비로 쓸 수 있습니다.' : '은 지원받을 수 없고 H/W 등으로 돌려 쓸 수도 없습니다.')));
      }
    }
    sl.append(line);
  }
  box.append(sl);

  // 현물 인건비: 과제책임자(대표자·기존 직원)의 직전년도 연봉 기준
  const sy = salaryYearOf(p) ? salaryYearOf(p) + '년' : '직전년도';
  box.append(el('label', null, '현물 인건비 (대표자·기존 직원의 ' + sy + ' 연봉 ÷ 12 × 계상 개월 × 참여율)'));
  const labor = p.labor || [];
  const tl = el('div','rlist');
  if (!labor.length) tl.append(el('div','rnote','입력한 인력이 없습니다. 현물(인건비)을 계상하면 «+ 인력 추가»로 넣으세요.'));
  labor.forEach((x, i) => {
    const r = el('div','cin pclabor');
    // 칸마다 라벨(값을 넣어도 무슨 칸인지 보이게). 연봉은 쉼표로 보여 주고 저장은 숫자
    const fld = (k, label, type, ph) => {
      const w = el('div','field');
      const inp = document.createElement('input');
      inp.id = 'lb-' + id + '-' + i + '-' + k; inp.placeholder = ph || '';
      const lab = el('label', null, label); lab.htmlFor = inp.id;
      if (type === 'won'){ inp.inputMode = 'numeric'; inp.value = x[k] === '' || x[k] == null ? '' : Number(x[k]).toLocaleString('ko-KR'); }
      else { inp.value = x[k] ?? ''; if (type){ inp.type = type; inp.min = '0'; } }
      onLeave(inp, () => {
        let v;
        if (type === 'won'){
          const raw = inp.value.replace(/[\s원]/g, ''), num = raw.replace(/,/g, '');
          if (num && (!/^\d+$/.test(num) || (raw.includes(',') && !/^\d{1,3}(,\d{3})+$/.test(raw)))){ setNotice('연봉은 숫자로 입력하세요(쉼표는 세 자리마다).'); return; }
          v = num === '' ? '' : Number(num);
        } else v = type ? (inp.value === '' ? '' : Number(inp.value)) : inp.value.trim();
        if (v === (x[k] ?? '')) return;
        edit(np => { np.labor[i][k] = v; });
      });
      w.append(lab, inp);
      r.append(w);
    };
    fld('name', '이름'); fld('title', '직위', null, '대표자·기존 직원');
    fld('salary', sy + ' 연봉 (원)', 'won', '예: 36,000,000'); fld('rate', '참여율 (%)', 'number'); fld('months', '계상 개월', 'number');
    const el2 = el('label','chk pcelig');
    const cb = document.createElement('input'); cb.type = 'checkbox'; cb.id = 'lb-' + id + '-' + i + '-eligible'; cb.checked = !!x.eligible;
    cb.addEventListener('change', () => edit(np => { np.labor[i].eligible = cb.checked; }));
    el2.append(cb, el('span', null, sy + ' 연봉 있음 — 대표자·기존 직원(현물 계상 가능)'));
    r.append(wide(el2));
    const amt = laborAmount(x);
    const info = el('div','rnote', amt == null ? '연봉·참여율·계상 개월을 모두 넣으면 금액을 계산합니다.' : '= ' + won(amt) + (x.eligible ? '' : ' (합계 제외)'));
    const del = el('button','btn ghost danger','삭제');
    del.addEventListener('click', () => edit(np => { np.labor.splice(i, 1); }));
    const la = el('div','lact'); la.append(info, del);
    r.append(wide(la));
    if (!x.eligible) r.append(wide(el('div','caveat pcwarn', '⚠ ' + sy + ' 연봉이 없으면 현물로 계상할 수 없습니다(공고 1.사 — 과제책임자의 직전년도 인건비). 합계에서 뺐습니다.')));
    if (span && x.months !== '' && x.months != null && Number(x.months) > span.months)
      r.append(wide(el('div','caveat pcwarn', '⚠ 계상 ' + x.months + '개월이 사업기간(' + spanText(span) + ')의 온전한 개월 수 ' + span.months + '개월을 넘습니다.')));
    if (x.rate !== '' && x.rate != null && (Number(x.rate) > 100 || Number(x.rate) < 0)) r.append(wide(el('div','caveat pcwarn', '⚠ 참여율은 0~100% 사이여야 합니다.')));
    tl.append(r);
  });
  const add = el('button','btn','+ 인력 추가');
  add.addEventListener('click', () => edit(np => { np.labor = (np.labor || []).concat([{ name:'', title:'', salary:'', rate:'', months:span ? span.months : '', eligible:false }]); }));
  tl.append(add);
  box.append(tl);
  if (span && span.days) box.append(el('div','rnote', '사업기간의 남는 ' + span.days + '일은 개월 수에 넣지 않았습니다. 일할 계상 여부는 운영지침으로 확인하세요(미확인).'));

  // 합계 · 한도 · 현물 목표를 채울 수 있는지
  const b = budgetOf(id);
  box.append(el('div','rnote pcsum', budgetLine(b)));
  const bw = budgetWarnBox(b, true);
  if (bw) box.append(bw);
  if (rule && span && b.inkindMax > 0){
    const most = inkindMost(p, span);
    if (most == null) box.append(el('div','rnote pcfill', '현물 목표 ' + won(b.inkindMax) + ' — ' + sy + ' 연봉이 있는 대표자·기존 직원을 넣어 채울 수 있는지 확인하세요.'));
    else if (most < b.inkindMax) box.append(el('div','caveat pcwarn pcfill', '⚠ 사업기간 ' + span.months + '개월 안에서 참여율 100%로 계상해도 최대 ' + won(most)
      + '이라 현물 목표 ' + won(b.inkindMax) + '을 채울 수 없습니다 — 인력 추가 또는 현금 자부담 증액이 필요합니다.'));
  }
  if (rule?.note) box.append(el('div','rnote', '규칙 메모: ' + rule.note));
  if (rule) box.append(el('div','rnote', '근거: ' + (rule.source || '(입력 없음)')));
  return box;
}

/* ---------- 사업 규칙(연도별 메타정보) — programs/{연도} ---------- */
function openProgramForm(year){
  const cur = year ? state.programs.get(year) : null;
  const src = cur || {};
  formModal({
    title: cur ? year + '년 사업 규칙 수정' : '사업 규칙 추가',
    hint: '해마다 바뀌는 사업 규칙입니다. 공고문·운영지침으로 확인한 값만 넣으세요. 이 연도의 모든 과제 체크포인트·한도 계산에 바로 반영됩니다.',
    fields: [
      { k:'year', label:'사업 연도 (차수 앞 4자리)', value:year || '', ph:'예: 2027' },
      { k:'salaryYear', label:'현물 인건비 기준 연도 (직전년도)', type:'number', value:src.salaryYear ?? '' },
      { k:'agreeDefault', label:'기본 협약일', type:'date', value:src.agreeDefault || '' },
      { k:'end', label:'사업 종료일', type:'date', value:src.end || '' },
      { k:'swRate', label:'S/W 임차비 한도 (총 사업비의 %)', type:'number', value:src.swRate ?? '' },
      { k:'swCap', label:'S/W 임차비 상한 (원)', type:'number', value:src.swCap ?? '' },
      { k:'inkindRate', label:'현물 목표·상한 (총 사업비의 %)', type:'number', value:src.inkindRate ?? '' },
      { k:'govRate', label:'국비 비율 (총 사업비의 %)', type:'number', value:src.govRate ?? '' },
      { k:'govCap', label:'국비 상한 (원)', type:'number', value:src.govCap ?? '' },
      { k:'swLeftoverToHw', label:'기간이 짧아 남는 S/W 예산의 H/W 전용', type:'select', options:[['false','불가'], ['true','가능']], value:String(!!src.swLeftoverToHw) },
      { k:'note', label:'추가 규칙 메모 (체크포인트에 표시)', type:'textarea', value:src.note || '', full:true },
      { k:'source', label:'근거 (공고·운영지침·확인일)', type:'textarea', value:src.source || '', full:true },
    ],
    onSave: v => {
      if (!/^\d{4}$/.test(v.year)) return '사업 연도는 숫자 4자리로 입력하세요.';
      if (cur && v.year !== year) return '연도는 바꿀 수 없습니다. 새 연도는 «+ 연도 추가»로 넣으세요.';
      if (!cur && state.programs.has(v.year)) return v.year + '년 규칙이 이미 있습니다. 표에서 «수정»을 누르세요.';
      if (!v.agreeDefault || !v.end) return '기본 협약일과 사업 종료일을 입력하세요.';
      if (v.agreeDefault > v.end) return '기본 협약일이 사업 종료일보다 늦습니다.';
      const pct = x => /^\d{1,2}(\.\d+)?$/.test(x) && Number(x) < 100;
      if (!pct(v.swRate) || !pct(v.inkindRate)) return '비율은 0~99 사이 숫자로 입력하세요.';
      if (!/^\d+$/.test(v.swCap)) return 'S/W 상한은 원 단위 숫자로 입력하세요.';
      if (!pct(v.govRate) || !/^\d+$/.test(v.govCap)) return '국비 비율(0~99)과 상한(원)을 숫자로 입력하세요.';
      if (!/^\d{4}$/.test(v.salaryYear)) return '인건비 기준 연도는 숫자 4자리로 입력하세요.';
      writeMaster('programs', state.programs, v.year, Object.assign({}, cur || {}, {
        agreeDefault:v.agreeDefault, end:v.end, swRate:Number(v.swRate), swCap:Number(v.swCap), inkindRate:Number(v.inkindRate),
        govRate:Number(v.govRate), govCap:Number(v.govCap),
        salaryYear:Number(v.salaryYear), swLeftoverToHw:v.swLeftoverToHw === 'true', note:v.note, source:v.source,
      }));
    },
  });
}

/* ---------- 4단계 «사업계획서 버전 · 체크리스트 점검» ----------
   코디네이터가 초안을 보내고 소공인이 수정본을 돌려준다. 버전(PDF)을 과제 planDocs에 등록하고(바이트는 assets),
   체크리스트(checklists/plan — 관리 탭, 소유자만 편집)로 점검한다.
   · board 항목: 보드 수치로 직접 판정(budgetOf 등)
   · ai 항목: 페이지가 Claude(sample)에게 문서 텍스트 — 글자가 부족하면 쪽 이미지 — 와 보드 사실을 주고 판정받는다.
     보는 사람의 Claude 사용량을 쓰고 첫 호출에 동의 창이 뜬다. Claude를 못 쓰면 «미확인»으로 두고 사람이 판정한다.
   결과는 미확정으로 저장하고 사람이 고쳐 «확정»한다. 항목 문구는 스냅샷으로 남긴다. 단계 상태는 바꾸지 않는다. */
const PLAN_SRC = { sent:'보낸 초안', received:'받은 수정본' };
const VERDICT = { pass:{ label:'통과', cls:'ch-auto' }, fix:{ label:'보완', cls:'warn' }, unknown:{ label:'미확인', cls:'sample' } };
const BOARD_CHECKS = {
  swLimit:'S/W 임차비 한도 이내', swPeriod:'S/W 임차 기간이 사업기간 이내', inkindTarget:'현물이 목표(총 사업비 %)와 맞음',
  inkindFill:'직전년도 연봉으로 현물 목표를 채울 수 있음', govCap:'국비 상한 이내',
};
const PLAN_MIN_LETTERS = 50;    // 쪽당 평균 글자(한글·영문)가 이보다 적으면 텍스트가 없는 PDF(스캔·인쇄 변환본)로 보고 쪽 이미지로 읽는다
const PLAN_TEXT_MAX = 12000;    // Claude에게 보내는 문서 텍스트 상한(자) — 요청 전체 64KiB 한도 안
const PDFJS = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
let sampleFn = null, sampleDenied = false;
let planBusy = null;            // { id, docId, ctl, stage }
let planOpen = null;            // 결과 표를 펼친 'pid|docId'
let planUpSrc = 'received';
const planMsg = {};             // pid → 안내 문구
const planChecklist = () => state.checklists.get('plan') || null;

const loadScript = src => new Promise((ok, fail) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = () => fail(new Error('load')); document.head.append(s); });
let pdfjsLoading = null;
/** pdf.js(UMD). worker 스크립트를 일반 script로 불러 globalThis.pdfjsWorker가 생기면 메인 스레드에서 돈다(다른 출처 Worker 불가) */
function loadPdfjs(){
  if (window.pdfjsLib && globalThis.pdfjsWorker) return Promise.resolve(window.pdfjsLib);
  return pdfjsLoading = pdfjsLoading || Promise.all([loadScript(PDFJS + 'pdf.min.js'), loadScript(PDFJS + 'pdf.worker.min.js')])
    .then(() => { const lib = window.pdfjsLib; lib.GlobalWorkerOptions.workerSrc = PDFJS + 'pdf.worker.min.js'; return lib; })
    .catch(e => { pdfjsLoading = null; throw e; });
}

/** 보드 수치로 판정하는 항목 */
function boardVerdict(id, p, item){
  const mk = (verdict, evidence, comment = '') => ({ id:item.id, text:item.text, kind:'board', verdict, evidence, comment });
  const b = budgetOf(id), rule = b.rule;
  if (!rule) return mk('unknown', (b.year || '연도 미상') + '년 사업 규칙 없음');
  const end = programEnd(p), ag = agreementOf(p), span = periodSpan(ag, end);
  switch (item.boardKey){
    case 'swLimit':
      if (!b.sw) return mk('pass', 'S/W 견적 없음');
      return b.over > 0 ? mk('fix', 'S/W ' + won(b.sw) + ' > 한도 ' + won(b.limit) + ' (' + won(b.over) + ' 초과)', 'S/W 임차 금액·기간을 한도 안으로 조정')
                        : mk('pass', 'S/W ' + won(b.sw) + ' ≤ 한도 ' + won(b.limit));
    case 'swPeriod': {
      const monthly = assetsWhere(a => a.projectId === id).map(([, a]) => [a, state.products.get(a.productId)])
        .filter(([, pr]) => pr && pr.kind === 'sw' && pr.unit === '월(임차)');
      if (!monthly.length) return mk('pass', '월 임차 S/W 없음');
      if (!ag || !end) return mk('unknown', '협약일·종료일 미확인');
      const over = monthly.filter(([a]) => monthsEnd(ag, Number(a.qty) || 1) > end);
      return over.length ? mk('fix', over.map(([a, pr]) => productLabel(pr) + ' ' + (Number(a.qty) || 1) + '개월 → ' + monthsEnd(ag, Number(a.qty) || 1)).join(', ') + ' > 종료일 ' + end,
                              '임차 개월을 사업기간(' + spanText(span) + ') 안으로 줄이기')
                         : mk('pass', '임차 종료일이 모두 ' + end + ' 이내');
    }
    case 'inkindTarget':
      if (!(b.inkindMax > 0)) return mk('unknown', '도입 장비 금액 없음');
      if (b.inkindOver < 0) return mk('fix', '현물 ' + won(b.inkind) + ' < 목표 ' + won(b.inkindMax) + ' (' + won(-b.inkindOver) + ' 부족)', '부족분만큼 현금 자부담이 늘어남 — 인력·참여율 확인');
      if (b.inkindOver > 0) return mk('fix', '현물 ' + won(b.inkind) + ' > 목표 ' + won(b.inkindMax) + ' (' + won(b.inkindOver) + ' 초과)', '참여율·계상 개월 줄이기');
      return mk('pass', '현물 ' + won(b.inkind) + ' = 목표');
    case 'inkindFill': {
      if (!(b.inkindMax > 0) || !span) return mk('unknown', !span ? '사업기간 미확인' : '도입 장비 금액 없음');
      const most = inkindMost(p, span);
      if (most == null) return mk('unknown', '직전년도 연봉이 있는 인력 입력 없음', '대표자·기존 직원의 직전년도 연봉 입력');
      return most < b.inkindMax ? mk('fix', '최대 ' + won(most) + '(' + span.months + '개월·참여율 100%) < 목표 ' + won(b.inkindMax), '인력 추가 또는 현금 자부담 증액')
                                : mk('pass', '최대 ' + won(most) + ' ≥ 목표 ' + won(b.inkindMax));
    }
    case 'govCap':
      if (b.gov == null) return mk('unknown', '국비 비율 규칙 없음');
      return b.govOver > 0 ? mk('fix', '국비 ' + won(b.gov) + ' > 상한 ' + won(rule.govCap), '총 사업비 조정') : mk('pass', '국비 ' + won(b.gov) + (rule.govCap ? ' ≤ 상한 ' + won(rule.govCap) : ''));
    default: return mk('unknown', '알 수 없는 보드 기준: ' + (item.boardKey || '(없음)'));
  }
}

/** Claude에게 보낼 프롬프트: 판정 원칙 + 보드 사실 + 항목 + 문서 */
function planPrompt(id, p, items, mode, text, pages, pagesChecked){
  const b = budgetOf(id), end = programEnd(p), ag = agreementOf(p), span = periodSpan(ag, end);
  const eq = assetsWhere(a => a.projectId === id).map(([, a]) => { const pr = state.products.get(a.productId);
    return '  · [' + (PRODUCT_KIND[pr?.kind] || '') + '] ' + productLabel(pr) + ' × ' + (a.qty || 1) + (pr?.unit || '대') + (supplierOf(pr) ? ' — ' + supplierOf(pr).name : '')
      + (pr && pr.unitPrice !== '' && pr.unitPrice != null ? ' (단가 ' + won(pr.unitPrice) + ')' : ''); });
  const lb = (p.labor || []).map(x => '  · ' + [x.name, x.title].filter(Boolean).join(' ') + ' · 연봉 ' + (x.salary === '' || x.salary == null ? '미입력' : won(x.salary))
    + ' · 참여율 ' + (x.rate ?? '') + '% · ' + (x.months ?? '') + '개월 · 직전년도 연봉 ' + (x.eligible ? '있음' : '미확인'));
  const doc = mode === 'image'
    ? '(사업계획서 쪽 이미지 ' + pagesChecked + '장을 첨부했습니다 — 1~' + pagesChecked + '쪽' + (pages > pagesChecked ? ', 전체 ' + pages + '쪽 중 일부' : '') + ')'
    : text.slice(0, PLAN_TEXT_MAX) + (text.length > PLAN_TEXT_MAX ? '\n(… 앞 ' + PLAN_TEXT_MAX.toLocaleString('ko-KR') + '자만 보냄)' : '');
  return [
    '당신은 소공인 스마트제조지원사업 «사업계획서»를 점검하는 검토자입니다.',
    '아래 [체크리스트]의 각 항목을 [사업계획서] 내용만 근거로 판정하세요.',
    '규칙:',
    '- verdict: "pass" = 문서에 충족 근거가 있음 / "fix" = 문서에 있으나 틀리거나 부족해 보완이 필요함 / "unknown" = 문서에서 확인할 수 없음.',
    '- 문서에 없는 내용을 추측하거나 지어내지 마세요. 확신이 없으면 "unknown".',
    '- evidence: 판정 근거가 된 문서 문구를 그대로 인용(150자 이내). 이미지면 "n쪽: …" 형식. 근거가 없으면 "".',
    '- comment: fix·unknown일 때 소공인에게 요청할 보완 내용 한 문장. pass면 "".',
    '- [보드 사실]은 코디네이터 보드에 입력된 값입니다. 문서와 비교하는 기준으로만 쓰세요.',
    '답은 JSON 배열만: [{"id":"ck_…","verdict":"pass|fix|unknown","evidence":"…","comment":"…"}] — 항목마다 하나씩.',
    '',
    '[보드 사실]',
    '- 업체: ' + p.company + ' (' + p.cycle + ') · 공고: ' + (NOTICES[p.notice]?.label || '미확인'),
    '- 사업기간: ' + (span ? ag + ' ~ ' + end + ' (' + spanText(span) + ')' : '미확인'),
    '- 도입 장비:', ...(eq.length ? eq : ['  · (등록 없음)']),
    '- 계산 사업비(보드 입력값 기반): H/W ' + won(b.hw) + ' · S/W ' + won(b.sw) + ' · 현물 ' + won(b.inkind) + ' · 총 ' + won(b.total)
      + (b.gov != null ? ' · 국비 ' + won(b.gov) + ' · 현금 ' + won(b.cash) : ''),
    '- 현물 인력:', ...(lb.length ? lb : ['  · (입력 없음)']),
    '',
    '[체크리스트]',
    ...items.map(i => '[id:' + i.id + '] ' + i.text + (i.guide ? ' — 기준: ' + i.guide : '')),
    '',
    '[사업계획서]' + (mode === 'text' ? ' (PDF에서 뽑은 텍스트, 전체 ' + pages + '쪽)' : ''),
    doc,
  ].join('\n');
}

function planErrorText(e){
  switch (e && e.code){
    case 'cancelled':        return '점검을 멈췄습니다.';
    case 'rate_limited':     return 'Claude 사용 한도에 걸렸습니다. 잠시 뒤 다시 누르세요.';
    case 'session_expired':  return 'claude.ai에 다시 로그인한 뒤 점검하세요.';
    case 'prompt_too_large': return '문서가 너무 깁니다. 필요한 쪽만 PDF로 다시 저장해 등록하세요.';
    case 'image_rejected':   return '쪽 이미지를 보낼 수 없습니다. 한글·소상공인24에서 «PDF로 저장»으로 다시 받아 등록하세요.';
    case 'refused':          return 'Claude가 이 요청을 거절했습니다. 체크리스트 기준 문구를 확인하세요.';
    case 'invalid_json':
    case 'empty_completion': return 'Claude 답을 읽지 못했습니다. «체크리스트로 점검»을 한 번 더 누르세요.';
    case 'pdf':              return 'PDF를 열 수 없습니다(' + (e.message || '형식 오류') + '). 다른 이름으로 다시 저장해 등록하세요.';
    default:                 return e && e.message === 'load' ? 'PDF 읽기 도구를 불러오지 못했습니다(네트워크 확인).' : '점검하지 못했습니다 (' + ((e && (e.code || e.message)) || 'unknown') + ').';
  }
}

async function runPlanCheck(id, docId){
  const cl = planChecklist();
  if (!cl || !(cl.items || []).length){ planMsg[id] = '체크리스트가 없습니다. 보드 소유자가 «관리» 탭에서 항목을 넣어야 합니다.'; render(); return; }
  const p = state.projects.get(id);
  const ctl = new AbortController();
  planBusy = { id, docId, ctl, stage:'PDF 읽는 중…' }; planMsg[id] = ''; render();
  const stage = t => { if (planBusy) planBusy.stage = t; const s = document.getElementById('pc-stage-' + docId); if (s) s.textContent = t; };
  try {
    const items = cl.items;
    const aiItems = items.filter(i => i.kind !== 'board');
    let mode = 'board', pages = 0, pagesChecked = 0, note = '';
    let ai = {};
    if (aiItems.length){
      if (!sampleFn || sampleDenied) note = 'Claude 점검을 쓸 수 없는 화면이라 문서 항목은 «미확인»으로 두었습니다 — 직접 판정하세요.';
      else {
        const lib = await loadPdfjs();
        const blob = await fetchBlob('/_blob/' + docId);
        let pdf;
        try { pdf = await lib.getDocument({ data:new Uint8Array(await blob.arrayBuffer()), isEvalSupported:false, disableFontFace:true }).promise; }
        catch (x){ throw { code:'pdf', message:x && x.name }; }
        pages = pdf.numPages;
        let text = '';
        for (let n = 1; n <= pages; n++){
          const tc = await (await pdf.getPage(n)).getTextContent();
          text += '\n[' + n + '쪽]\n' + tc.items.map(x => (x.str || '') + (x.hasEOL ? '\n' : ' ')).join('');
        }
        let images = null;
        if ((text.match(/[가-힣A-Za-z]/g) || []).length >= PLAN_MIN_LETTERS * pages){ mode = 'text'; pagesChecked = pages; }
        else {
          const lim = await sampleFn.limits().catch(() => null);
          if (!lim || !lim.images){ note = '글자를 읽을 수 없는 PDF입니다(스캔·인쇄 변환본). 한글·소상공인24에서 «PDF로 저장»으로 다시 받아 등록하세요. 문서 항목은 «미확인»으로 두었습니다.'; }
          else {
            mode = 'image'; pagesChecked = Math.min(pages, lim.images.maxCount); images = [];
            for (let n = 1; n <= pagesChecked; n++){
              stage('쪽을 이미지로 바꾸는 중… (' + n + '/' + pagesChecked + ')');
              const pg = await pdf.getPage(n), vp = pg.getViewport({ scale:1.6 });
              const c = document.createElement('canvas'); c.width = Math.ceil(vp.width); c.height = Math.ceil(vp.height);
              const cx = c.getContext('2d'); cx.fillStyle = '#fff'; cx.fillRect(0, 0, c.width, c.height);
              await pg.render({ canvasContext:cx, viewport:vp }).promise;
              images.push(await new Promise(ok => c.toBlob(ok, 'image/png')));
            }
            text = '';
          }
        }
        if (mode !== 'board'){
          stage('Claude가 판정하는 중… (수십 초 걸릴 수 있습니다)');
          try {
            const out = await sampleFn.json(planPrompt(id, p, aiItems, mode, text, pages, pagesChecked),
              Object.assign({ signal:ctl.signal, modelTier:'default' }, images ? { images } : {}));
            const arr = Array.isArray(out) ? out : Array.isArray(out?.results) ? out.results : [];
            for (const r of arr) if (r && r.id != null) ai[String(r.id)] = r;
          } catch (e){
            if (['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed','images_unavailable'].includes(e && e.code)){
              sampleDenied = e.code !== 'images_unavailable' ? true : sampleDenied;
              note = 'Claude 점검을 쓸 수 없어(' + e.code + ') 문서 항목은 «미확인»으로 두었습니다 — 직접 판정하세요.';
            } else throw e;
          }
        }
      }
    }
    const results = items.map(i => {
      if (i.kind === 'board') return boardVerdict(id, p, i);
      const r = ai[i.id];
      const v = r && VERDICT[r.verdict] ? r.verdict : 'unknown';
      return { id:i.id, text:i.text, kind:'ai', verdict:v, evidence:String(r?.evidence || '').slice(0, 300),
               comment:String(r?.comment || (r ? '' : '직접 확인 필요')).slice(0, 300) };
    });
    editPlanDoc(id, docId, d => {
      d.check = Object.assign({ ts:new Date().toISOString(), checklistAt:cl.updatedAt || '', mode, pages, pagesChecked, results, confirmed:null }, me ? { by:me } : {});
    });
    planOpen = id + '|' + docId;
    planMsg[id] = note || '점검했습니다. 판정을 확인·수정한 뒤 «점검 결과 확정»을 누르세요.';
  } catch (e){
    planMsg[id] = planErrorText(e);
  } finally {
    planBusy = null; render();
  }
}

/** 보완 요청 문구(보완·미확인 항목) */
function planFixText(p, d){
  const rows = (d.check?.results || []).filter(r => r.verdict !== 'pass');
  return ['[사업계획서 보완 요청] ' + p.company + ' (' + p.cycle + ')', d.name + ' 기준으로 아래 항목을 확인·보완해 주세요.', '',
    ...rows.map((r, i) => (i + 1) + '. ' + r.text + (r.comment ? ' — ' + r.comment : r.evidence ? ' — ' + r.evidence : '')),
    ...(rows.length ? [] : ['(보완할 항목이 없습니다)'])].join('\n');
}

    + (cl && c.checklistAt && cl.updatedAt && cl.updatedAt !== c.checklistAt ? ' · ⚠ 그 뒤 체크리스트가 바뀌었습니다 — 다시 점검하세요' : '')));

    vc.append(sel);
    if (r.edited) vc.append(el('span','badge sample','수정'));
    const cc = document.createElement('td');
    const ci = document.createElement('input');
    ci.id = 'pm-' + d.id + '-' + i; ci.value = r.comment || ''; ci.placeholder = '보완 요청·메모'; ci.className = 'pcomment';
    ci.addEventListener('change', () => editPlanDoc(id, d.id, dd => { const x = dd.check.results[i]; x.comment = ci.value.trim(); x.edited = true; dd.check.confirmed = null; }));
    cc.append(ci);
    tr.append(td(r.text, 'co'), td(r.kind === 'board' ? '보드' : 'Claude'), vc, td(r.evidence || '—'), cc);
    body.append(tr);
  });
  tb.append(body);
  const w = el('div','tbl-wrap'); w.append(tb); box.append(w);
  const la = el('div','lact');

  else {
    const ok = el('button','btn primary','점검 결과 확정');
    ok.addEventListener('click', () => editPlanDoc(id, d.id, dd => { dd.check.confirmed = Object.assign({ ts:new Date().toISOString() }, me ? { by:me } : {}); }));
    la.append(ok);
  }
  const cp = el('button','btn','보완 요청 문구 복사');
  cp.addEventListener('click', () => copyText(cp, planFixText(p, d)));
  la.append(cp);
  box.append(la);

  return box;
}

function planDocRow(id, p, d){
  const row = el('div','frow pdoc');
  const top = el('div','lact');
  const c = d.check;
  const fixN = c ? c.results.filter(r => r.verdict !== 'pass').length : 0;
  const st = !c ? ['미점검','sample'] : c.confirmed ? ['확정 ✓' + (fixN ? ' · 보완 ' + fixN : ''), 'ch-auto'] : ['점검됨 · 보완 ' + fixN + ' · 미확정', 'warn'];
  top.append(el('span','badge ' + (d.source === 'sent' ? 'ntc-main' : 'ntc-extra'), PLAN_SRC[d.source] || d.source),
    extLink('linkbtn', d.name, '/_blob/' + d.id, '새 탭에서 열기'), el('span','fmsg', fmtTs(d.ts) + (d.by ? ' · ' + who(d.by) : '')),
    el('span','badge pstat ' + st[1], st[0]));
  row.append(top);
  if (d.note) row.append(el('div','rnote', d.note));
  const busy = planBusy && planBusy.docId === d.id;
  const la = el('div','lact');
  const chk = el('button','btn', c ? '다시 점검' : '체크리스트로 점검');
  chk.disabled = !!planBusy;
  chk.title = '체크리스트 항목을 보드 수치와 Claude(문서 판정)로 점검합니다. 보는 사람의 Claude 사용량을 씁니다.';
  chk.addEventListener('click', () => runPlanCheck(id, d.id));
  la.append(chk);
  if (c){
    const open = planOpen === id + '|' + d.id;
    const tg = el('button','btn ghost', open ? '결과 닫기' : '결과 보기');
    tg.addEventListener('click', () => { planOpen = open ? null : id + '|' + d.id; render(); });
    la.append(tg);
  }
  if (assets){
    const del = el('button','btn ghost danger','삭제');
    del.addEventListener('click', async () => {
      if (!del.dataset.armed){ del.dataset.armed = '1'; del.textContent = '삭제 확인'; return; }
      del.disabled = true;
      try { await assets.delete(d.id); } catch (e) {}
      const np = structuredClone(state.projects.get(id));
      np.planDocs = (np.planDocs || []).filter(x => x.id !== d.id);
      save(id, np);
    });
    la.append(del);
  }
  row.append(la);
  if (busy){
    const pr = el('div','lact pbusy');
    const stp = el('button','btn ghost','멈추기');
    stp.addEventListener('click', () => planBusy?.ctl.abort());
    pr.append(Object.assign(el('span','fmsg', planBusy.stage), { id:'pc-stage-' + d.id }), stp);
    row.append(pr);
  }
  if (c && planOpen === id + '|' + d.id) row.append(planResultEl(id, p, d));
  return row;
}

      planMsg[id] = '올리는 중…'; render();

        planMsg[id] = '등록했습니다. «체크리스트로 점검»을 누르세요.';
        save(id, np);
      } catch (e){
        planMsg[id] = ({ too_large:'파일이 너무 큽니다(20MB 한도)', quota_or_state:'저장 공간이 부족합니다', not_granted:'올리기 권한이 없습니다' }[e && e.code]) || '올리지 못했습니다 (' + ((e && e.code) || 'unknown') + ')';
        render();
      }
    });
    up.append(src, note, lab, fi);
    box.append(up);
  } else box.append(el('div','rnote','이 화면에서는 파일을 올릴 수 없습니다(편집 권한 필요).'));
  if (planMsg[id]) box.append(el('div','sendstat pmsg', planMsg[id]));
  return box;
}

    hint: '«Claude» 항목은 판정 기준을 Claude에게 그대로 전달합니다 — 문서에서 무엇을 보고 언제 보완(fix)인지 구체적으로 쓰세요. «보드» 항목은 보드에 입력된 수치로 자동 판정합니다.',
    fields: [
      { k:'text', label:'항목', value:cur?.text || '', full:true },
      { k:'kind', label:'판정 방식', type:'select', options:[['ai','Claude가 문서를 읽고 판정'], ['board','보드 수치로 자동 판정']], value:cur?.kind || 'ai' },
      { k:'boardKey', label:'보드 기준 (보드 판정일 때)', type:'select', options:[['', '—'], ...Object.entries(BOARD_CHECKS)], value:cur?.boardKey || '' },
      { k:'guide', label:'판정 기준', type:'textarea', value:cur?.guide || '', full:true },
    ],
    onSave: v => {
      if (!v.text) return '항목을 입력하세요.';
      if (v.kind === 'board' && !BOARD_CHECKS[v.boardKey]) return '보드 판정 항목은 보드 기준을 고르세요.';
      if (v.kind === 'ai' && !v.guide) return 'Claude 판정 항목은 판정 기준을 입력하세요.';
      const item = { id:cur?.id || newId('ck_'), kind:v.kind, text:v.text, guide:v.guide };
      if (v.kind === 'board') item.boardKey = v.boardKey;
      if (cur) items[items.indexOf(cur)] = item; else items.push(item);
      saveChecklist(items);
    },
  });
}
